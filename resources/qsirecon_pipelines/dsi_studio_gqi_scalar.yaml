# Custom dsi_studio_gqi pipeline for TI-Toolbox: GQI scalar maps only.
# Based on the upstream dsi_studio_gqi spec but WITHOUT the connectivity
# node (which requires --atlases and hits the plot_reports bug in
# QSIRecon >= 1.2.0) and WITHOUT the 5M-streamline tractography node.
# The SimNIBS DTI tensor does not come from here (tit.pre.qsi.dti_extractor
# fits it from QSIPrep output); pick an upstream spec for tractography.
name: dsistudio_gqi_scalar
nodes:
-   action: reconstruction
    input: qsirecon
    name: dsistudio_gqi
    parameters:
        method: gqi
    qsirecon_suffix: DSIStudio
    software: DSI Studio
-   action: export
    input: dsistudio_gqi
    name: scalar_export
    qsirecon_suffix: DSIStudio
    software: DSI Studio
space: T1w
