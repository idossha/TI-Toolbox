      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableData"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: path escapes the project jail
        "404":
          $ref: "#/components/responses/NotFound"

