  # ---------------------------------------------------------------------------------- pipelines (v1)
  # A pipeline is a DAG of existing job kinds (contracts/pipeline.schema.json). Running one is
  # exactly one `submit_plan` call, so a pipeline run is ONE job group with ONE group_id -- there
  # is no pipeline executor and no new job kind. See tit/pipeline/ and docs/wiki/pipelines.md.
  /api/pipelines:
    get:
      tags: [pipelines]
      summary: Saved pipelines in this project (code/ti-toolbox/pipelines/)
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PipelineListEntry" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/pipelines/kinds:
    get:
      tags: [pipelines]
      summary: Node kinds and their typed ports (the canvas palette)
      description: >-
        The canvas draws its ports from this rather than from a hand-kept copy, so a port added
        on the server appears in the UI without a renderer change.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineKinds"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/pipelines/validate:
    post:
      tags: [pipelines]
      summary: Validate a pipeline graph, with a reason per problem
      description: >-
        Never 500s on a graph problem: a cycle, an incompatible port or an unbound required input
        comes back as an `issue` with a sentence the UI shows next to the node or wire. A 422 means
        the document is not shaped like a pipeline at all.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PipelineRequest" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PipelineValidation" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: the document is not a valid pipeline document

  /api/pipelines/run:
    post:
      tags: [pipelines]
      summary: Run a whole pipeline as one job group
      description: >-
        One submission. Every job's `after` is the document's edges resolved to real job ids, and
        every job carries the one `group_id` in the response -- so Jobs shows the pipeline as one
        row with its member tree and cancels as one thing. Ports whose value only exists after the
        producer ran (montage names from an optimizer, a leadfield, a simulation name whose montages
        were themselves optimized) get a small `tools` resolve job planned between producer and
        consumer.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PipelineRunRequest" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PipelineRunResult" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: the pipeline does not validate (body carries the issues) or a config is invalid

  /api/pipelines/export:
    post:
      tags: [pipelines]
      summary: Export a pipeline as a Jupyter notebook
      description: >-
        A pure function of the document. The body is the `.ipynb` JSON as text; the pipeline itself
        rides along in `metadata.ti_toolbox.pipeline`, so a later import restores the canvas without
        parsing Python.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: format
          required: false
          schema: { type: string, enum: [ipynb], default: ipynb }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PipelineRequest" }
      responses:
        "200":
          content:
            text/plain:
              schema: { type: string, description: the .ipynb document as JSON text }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: unsupported format, or an invalid document
        "501":
          description: nbformat is not installed in this environment

  /api/pipelines/{name}:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
    get:
      tags: [pipelines]
      summary: Load a saved pipeline
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pipeline" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: illegal pipeline name, or the saved file is not a pipeline document
    put:
      tags: [pipelines]
      summary: Save a pipeline document
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PipelineRequest" }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [name, saved]
                properties:
                  name: { type: string }
                  saved: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: illegal pipeline name, or an invalid document
    delete:
      tags: [pipelines]
      summary: Delete a saved pipeline
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "204":
          description: deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # -------------------------------------------------------------------------------------- scene (v1)
  # dev/notes/v3-scene-ia-plan.md §2, decisions S1-S3. Response bodies are plain dicts (the
  # pattern every /api/catalog route follows), so the shapes below are stated inline rather
  # than as named components -- there is no server-side Pydantic model for the dump to name.
  /api/scene/manifest:
    get:
      tags: [scene]
      summary: Everything one subject's scene pane can load, with cache state
      description: >-
        `202` with a `Retry-After` header while the surfaces are still being extracted from the
        head mesh; the body then carries `cache.state: "building"`, an empty `parts`, and the
        cheap halves (`nets`, `atlases`, `volumes`) already filled in. `wait=<seconds>` asks for
        an explicit, capped block instead of polling — the default of 0 never holds the
        connection. `X-Scene-Build-Ms` reports what the served artifacts cost to build and
        `X-Scene-Cache: hit|building` whether this request paid it.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: subject
          required: true
          schema: { type: string }
        - in: query
          name: wait
          required: false
          description: seconds to block for a cold build before answering 202 (0 = never block)
          schema: { type: number, default: 0 }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [subject, space, parts, nets, atlases, volumes, cache]
                properties:
                  subject: { type: string }
                  space: { type: string, enum: [subject-ras] }
                  bbox:
                    type: [array, "null"]
                    description: >-
                      [x0, y0, z0, x1, y1, z1] over every served part, world mm; `null` when no
                      part is cached yet, which is the body a `202` carries.
                    items: { type: number }
                  focus_bbox:
                    type: [array, "null"]
                    description: >-
                      The framing hint (plan §S7): the same box with the neck cut off at the
                      lowest grey-matter vertex, i.e. everything at or above the bottom of the
                      cerebellum. `bbox` is what the scene *contains*; this is what a pane should
                      *frame*, because a head model's skin runs to the shoulders (sub-ernie:
                      z = -128.9 mm, against -50.7 for grey matter) and framing that spends about
                      a fifth of a pane's height on neck. `null` on a `202`, and on any cache
                      entry written before builder version 2.
                    items: { type: number }
                  parts:
                    type: array
                    items:
                      type: object
                      required: [id, kind, triangles, vertices, bytes, fingerprint, url]
                      properties:
                        id: { type: string, enum: [skin, gm] }
                        kind: { type: string, enum: [surface] }
                        triangles: { type: integer }
                        vertices: { type: integer }
                        bytes: { type: integer }
                        fingerprint: { type: string }
                        url: { type: string }
                        simplified: { type: boolean }
                        within_budget:
                          type: boolean
                          description: >-
                            false when the §S3 budget (150 000 triangles, 3 MB) could not be met;
                            the true counts are still reported rather than the payload silently
                            shipping oversized.
                        max_deviation_mm: { type: number }
                        bbox:
                          type: array
                          items: { type: number }
                        focus_bbox:
                          type: array
                          description: this part's own contribution to the manifest's focus_bbox
                          items: { type: number }
                  nets:
                    type: array
                    items:
                      type: object
                      required: [name, electrodes, url]
                      properties:
                        name: { type: string }
                        electrodes: { type: integer }
                        url: { type: string }
                  atlases:
                    type: array
                    items:
                      type: object
                      required: [id, hemispheres, regions, url]
                      properties:
                        id: { type: string }
                        hemispheres:
                          type: array
                          items: { type: string, enum: [lh, rh] }
                        regions: { type: integer }
                        url: { type: string }
                  volumes:
                    type: array
                    items:
                      type: object
                      required: [id, url, legend_url]
                      properties:
                        id: { type: string }
                        url: { type: string }
                        legend_url: { type: string }
                  cache:
                    type: object
                    required: [state]
                    properties:
                      state: { type: string, enum: [ready, building] }
                      built_ms: { type: number }
        "202":
          description: the cache is building; retry after Retry-After seconds
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >-
            `detail` is one sentence a user can act on, never "unknown subject": a subject the
            project does not have is told which ids it does have; a subject whose head model has
            not been built yet (listed by `GET /api/catalog/subjects`, including one whose raw
            data is only staged under `sourcedata/`) is told that `m2m_<id>/` is missing and what
            to run. Every `/api/scene/*` route answers a subject-level question the same way.
  /api/scene/surface:
    get:
      tags: [scene]
      summary: One scene surface (skin or gm) as TVSC1 or GIfTI binary
      description: >-
        The `tvsc` payload is the `TVSC1` layout frozen in `dev/notes/v3-scene-ia-plan.md` §2.3:
        a 32-byte header (magic `TVSC`, version 1, `u32` vertexCount, `u32` indexCount, `u32`
        flags, 12 reserved bytes) then `float32` positions in world millimetres and `uint32`
        triangle indices. `format=gii` serves the same vertices and triangles as a GIfTI mesh for
        the embedded Tetravox renderer. `ETag` is the part plus its source fingerprint and the
        requested format, and the response is `must-revalidate`, because the same URL legitimately
        changes content after charm is re-run. `X-Scene-Vertices` / `X-Scene-Triangles` repeat the
        manifest's counts so a client can size a buffer before reading the body.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: subject
          required: true
          schema: { type: string }
        - in: query
          name: part
          required: true
          schema: { type: string, enum: [skin, gm] }
        - in: query
          name: format
          required: false
          description: >-
            Which serialisation to serve. `tvsc` is the frozen `TVSC1` binary above;
            `gii` is GIfTI — `NIFTI_INTENT_POINTSET` (float32) plus
            `NIFTI_INTENT_TRIANGLE` (int32), `GZipBase64Binary` (a zlib stream), the
            coordinate system declared as `NIFTI_XFORM_SCANNER_ANAT` with an identity
            matrix — which the Tetravox embed reads with no bespoke decoder
            (`dev/notes/v3-embed-convergence-plan.md` decision E7). Both are built from
            the same vertices and triangles by one build, and the `ETag` names the
            format so one payload can never be revalidated as the other.
          schema: { type: string, enum: [tvsc, gii], default: tvsc }
        - in: query
          name: wait
          required: false
          schema: { type: number, default: 0 }
        - in: header
          name: If-None-Match
          required: false
          schema: { type: string }
      responses:
        "200":
          description: TVSC1 or GIfTI binary, per ?format
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "202":
          description: the cache is building; retry after Retry-After seconds
        "304":
          description: not modified (If-None-Match matched the ETag)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >-
            `detail` is one sentence a user can act on, never "unknown subject": a subject the
            project does not have is told which ids it does have; a subject whose head model has
            not been built yet (listed by `GET /api/catalog/subjects`, including one whose raw
            data is only staged under `sourcedata/`) is told that `m2m_<id>/` is missing and what
            to run. Every `/api/scene/*` route answers a subject-level question the same way.
            Also: a `part` other than `skin` or `gm`, which names the parts that exist.
  /api/scene/labels:
    get:
      tags: [scene]
      summary: Per-vertex uint16 region labels aligned to part "gm", as TVSC1 or GIfTI binary
      description: >-
        `format=tvsc` serves the compatibility labels payload (`indexCount` 0, `flags` bit0 set):
        the same positions the `gm` surface serves, in the same order, followed by one `uint16` per
        vertex. `format=gii` serves a renderable GIfTI mesh carrying the grey-matter triangles plus
        a `NIFTI_INTENT_LABEL` array and the atlas' `<LabelTable>`, so Tetravox can render and pick
        cortical regions from this one dataset. `0` means "no region" — the head mesh's grey-matter
        tag covers cerebellum and brainstem, which no cortical atlas describes. The label values
        index the `legend[].label` field of `GET /api/scene/regions` for the same atlas.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: subject
          required: true
          schema: { type: string }
        - in: query
          name: atlas
          required: true
          schema: { type: string }
        - in: query
          name: format
          required: false
          description: >-
            Which serialisation to serve. `tvsc` is the frozen `TVSC1` binary above;
            `gii` is GIfTI — `NIFTI_INTENT_POINTSET` (float32) plus
            `NIFTI_INTENT_TRIANGLE` (int32), `GZipBase64Binary` (a zlib stream), the
            coordinate system declared as `NIFTI_XFORM_SCANNER_ANAT` with an identity
            matrix — which the Tetravox embed reads with no bespoke decoder
            (`dev/notes/v3-embed-convergence-plan.md` decision E7). Both are built from
            the same vertices and triangles by one build, and the `ETag` names the
            format so one payload can never be revalidated as the other.
          schema: { type: string, enum: [tvsc, gii], default: tvsc }
        - in: query
          name: wait
          required: false
          schema: { type: number, default: 0 }
        - in: header
          name: If-None-Match
          required: false
          schema: { type: string }
      responses:
        "200":
          description: TVSC1 labels payload or a renderable GIfTI mesh with label data, per ?format
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "202":
          description: the cache is building; retry after Retry-After seconds
        "304":
          description: not modified (If-None-Match matched the ETag)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >-
            `detail` is one sentence a user can act on, never "unknown subject": a subject the
            project does not have is told which ids it does have; a subject whose head model has
            not been built yet (listed by `GET /api/catalog/subjects`, including one whose raw
            data is only staged under `sourcedata/`) is told that `m2m_<id>/` is missing and what
            to run. Every `/api/scene/*` route answers a subject-level question the same way.
            Also: an atlas this subject has no annotation for, which names the ones it has.
  /api/scene/regions:
    get:
      tags: [scene]
      summary: One atlas' legend plus the URL of its label payload for part "gm"
      description: >-
        `legend[].label` is the `uint16` value that appears in the payload at `url`;
        `legend[].id` is the region's `.annot` row index within its own hemisphere — the same
        integer `GET /api/catalog/atlases/regions` and `FlexConfig.AtlasROI.label` use, so a
        pick in the pane maps straight onto a config.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: subject
          required: true
          schema: { type: string }
        - in: query
          name: atlas
          required: true
          schema: { type: string }
        - in: query
          name: wait
          required: false
          schema: { type: number, default: 0 }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [atlas, subject, legend, url, cache]
                properties:
                  atlas: { type: string }
                  subject: { type: string }
                  aligned_to: { type: string, enum: [gm] }
                  vertices: { type: integer }
                  radius_mm:
                    type: number
                    description: >-
                      a gm vertex further than this from any central-surface vertex is left
                      unlabelled rather than given the least-far region
                  labelled_fraction: { type: number }
                  url: { type: string }
                  legend:
                    type: array
                    items:
                      type: object
                      required: [label, id, hemi, name, color]
                      properties:
                        label: { type: integer }
                        id: { type: integer }
                        hemi: { type: string, enum: [lh, rh] }
                        name: { type: string }
                        color: { type: string }
                  cache:
                    type: object
                    properties:
                      state: { type: string, enum: [ready, building] }
                      built_ms: { type: number }
        "202":
          description: the labels payload is building; retry after Retry-After seconds
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >-
            `detail` is one sentence a user can act on, never "unknown subject": a subject the
            project does not have is told which ids it does have; a subject whose head model has
            not been built yet (listed by `GET /api/catalog/subjects`, including one whose raw
            data is only staged under `sourcedata/`) is told that `m2m_<id>/` is missing and what
            to run. Every `/api/scene/*` route answers a subject-level question the same way.
            Also: an atlas this subject has no annotation for, which names the ones it has.
  /api/scene/electrodes:
    get:
      tags: [scene]
      summary: One EEG net's electrode positions, in the surfaces' own world space
      description: >-
        Parsed from `m2m_<id>/eeg_positions/<net>.csv` (`<type>,x,y,z,name` rows). Coordinates
        are world millimetres in the same space as `GET /api/scene/surface`, which is what makes
        a marker land on the skin instead of beside it.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: subject
          required: true
          schema: { type: string }
        - in: query
          name: net
          required: true
          description: the net's CSV file name, as listed by GET /api/catalog/eeg-nets
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [net, space, electrodes, reference, fiducials]
                properties:
                  net: { type: string }
                  space: { type: string, enum: [subject-ras] }
                  electrodes:
                    type: array
                    items:
                      type: object
                      required: [name, world]
                      properties:
                        name: { type: string }
                        world:
                          type: array
                          items: { type: number }
                  reference:
                    type: array
                    items:
                      type: object
                      required: [name, world]
                      properties:
                        name: { type: string }
                        world:
                          type: array
                          items: { type: number }
                  fiducials:
                    type: array
                    items:
                      type: object
                      required: [name, world]
                      properties:
                        name: { type: string }
                        world:
                          type: array
                          items: { type: number }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >-
            `detail` is one sentence a user can act on, never "unknown subject": a subject the
            project does not have is told which ids it does have; a subject whose head model has
            not been built yet (listed by `GET /api/catalog/subjects`, including one whose raw
            data is only staged under `sourcedata/`) is told that `m2m_<id>/` is missing and what
            to run. Every `/api/scene/*` route answers a subject-level question the same way.
            Also: a net file this subject does not have.
  /api/scene/volume-legend:
    get:
      tags: [scene]
      summary: The label volume's id -> name/colour legend
      description: >-
        Parsed from `m2m_<id>/segmentation/labeling_LUT.txt` with the same line parser the
        optimizer's ROI picker uses, so the scene legend and the ROI dropdown cannot disagree
        about what a label is called. `color` is `null` when the table carries no RGB columns.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: subject
          required: true
          schema: { type: string }
        - in: query
          name: id
          required: false
          schema: { type: string, default: labeling }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [id, entries]
                properties:
                  id: { type: string }
                  entries:
                    type: array
                    items:
                      type: object
                      required: [id, name, color]
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        color: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >-
            `detail` is one sentence a user can act on, never "unknown subject": a subject the
            project does not have is told which ids it does have; a subject whose head model has
            not been built yet (listed by `GET /api/catalog/subjects`, including one whose raw
            data is only staged under `sourcedata/`) is told that `m2m_<id>/` is missing and what
            to run. Every `/api/scene/*` route answers a subject-level question the same way.
            Also: a volume id with no `labeling_LUT.txt` beside it.

  # -------------------------------------------------------------------------------------- guide (v1)
  # desktop/IMPLEMENTATION_PLAN.md R4. The fixed guide scene: the same shapes /api/scene/* answers
  # with, minus every project-dependent part of them. No `subject` parameter, no cache state worth
  # polling, no build -- each response is a read of a file packaged with the installation.
  /api/guide/manifest:
    get:
      tags: [guide]
      summary: Everything the fixed guide scene contains
      description: >-
        The guide is prebuilt and immutable, so this never answers `202` and never depends on a
        project being bound. `space` is `guide-ras`, never `subject-ras`: the millimetres belong to
        the guide head, and a client that wrote one into a research subject's configuration would
        produce a coordinate no later validation could catch (R4). `parts[]`, `nets[]` and
        `atlases[]` have the same shape as the scene manifest's, so one pane component consumes
        either.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [guide, space, parts, nets, atlases, volumes, cache]
                properties:
                  guide:
                    type: object
                    required: [id, label]
                    properties:
                      id: { type: string, description: the source subject the guide was derived from }
                      label: { type: string }
                  guide_version: { type: integer }
                  space: { type: string, enum: [guide-ras] }
                  bbox:
                    type: [array, "null"]
                    items: { type: number }
                  focus_bbox:
                    type: [array, "null"]
                    items: { type: number }
                  parts:
                    type: array
                    items:
                      type: object
                      required: [id, kind, triangles, vertices, bytes, fingerprint, url]
                      properties:
                        id: { type: string, enum: [skin, gm] }
                        kind: { type: string, enum: [surface] }
                        triangles: { type: integer }
                        vertices: { type: integer }
                        bytes:
                          type: integer
                          description: size of the TVSC1 payload, held to the same 3 MB budget as a subject's
                        fingerprint: { type: string }
                        url: { type: string }
                        simplified: { type: boolean }
                        within_budget: { type: boolean }
                        max_deviation_mm: { type: number }
                        bbox:
                          type: array
                          items: { type: number }
                        focus_bbox:
                          type: array
                          items: { type: number }
                  nets:
                    type: array
                    items:
                      type: object
                      required: [name, electrodes, url]
                      properties:
                        name: { type: string }
                        electrodes: { type: integer }
                        url: { type: string }
                  atlases:
                    type: array
                    items:
                      type: object
                      required: [id, hemispheres, regions, url]
                      properties:
                        id: { type: string }
                        hemispheres:
                          type: array
                          items: { type: string, enum: [lh, rh] }
                        regions: { type: integer }
                        url: { type: string }
                  volumes:
                    type: array
                    description: always empty; the guide packages no label volume
                    items: { type: object }
                  provenance:
                    type: object
                    description: where the guide anatomy came from and under which licence
                    properties:
                      source: { type: string }
                      source_url: { type: string }
                      license: { type: string }
                      notes: { type: string }
                  cache:
                    type: object
                    required: [state]
                    properties:
                      state: { type: string, enum: [ready] }
                      built_ms: { type: number }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: the guide assets are not installed; `detail` says how to regenerate them
  /api/guide/surface:
    get:
      tags: [guide]
      summary: One packaged guide surface as TVSC1 or GIfTI binary
      description: >-
        The same two payload formats `GET /api/scene/surface` serves, from the packaged guide.
        `ETag` is the file's SHA-256 and `Cache-Control` is a year plus `immutable`: unlike a
        subject's surface, this URL's bytes cannot change without the installation changing.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: part
          required: true
          schema: { type: string, enum: [skin, gm] }
        - in: query
          name: format
          required: false
          schema: { type: string, enum: [tvsc, gii], default: tvsc }
      responses:
        "200":
          description: TVSC1 or GIfTI binary
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "304":
          description: not modified (If-None-Match matched the ETag)
        "400":
          description: unknown ?format
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: no such packaged part, or the guide is not installed
  /api/guide/labels:
    get:
      tags: [guide]
      summary: One packaged atlas' grey-matter surface with per-vertex labels
      description: >-
        A GIfTI mesh carrying the guide's grey-matter triangles, a `NIFTI_INTENT_LABEL` array and
        the atlas' own `<LabelTable>` — the payload the embedded renderer draws and picks regions
        on. Its label values index the `legend[].label` field of `GET /api/guide/regions`.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: atlas
          required: true
          schema: { type: string }
        - in: query
          name: format
          required: false
          schema: { type: string, enum: [gii], default: gii }
      responses:
        "200":
          description: GIfTI binary with a label array and label table
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "304":
          description: not modified
        "400":
          description: unknown ?format
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: no such packaged atlas, or the guide is not installed
  /api/guide/regions:
    get:
      tags: [guide]
      summary: One packaged atlas' legend plus the URL of its label payload
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: atlas
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [atlas, space, legend, url]
                properties:
                  atlas: { type: string }
                  space: { type: string, enum: [guide-ras] }
                  aligned_to: { type: string, enum: [gm] }
                  vertices: { type: integer }
                  radius_mm: { type: number }
                  labelled_fraction: { type: number }
                  legend:
                    type: array
                    items:
                      type: object
                      required: [label, id, hemi, name, color]
                      properties:
                        label:
                          type: integer
                          description: the uint16 value in the label payload
                        id:
                          type: integer
                          description: the .annot row index, which is what a config's AtlasROI.label carries
                        hemi: { type: string, enum: [lh, rh] }
                        name: { type: string }
                        color: { type: string }
                  url: { type: string }
                  cache:
                    type: object
                    properties:
                      state: { type: string, enum: [ready] }
                      built_ms: { type: number }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: no such packaged atlas, or the guide is not installed
  /api/guide/electrodes:
    get:
      tags: [guide]
      summary: One packaged EEG net's electrode positions in the guide's own space
      description: >-
        `world` is millimetres in `guide-ras`. Names are what a montage form writes; the positions
        exist so the pane can draw the net, not so a configuration can carry them.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: net
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [net, space, electrodes]
                properties:
                  net: { type: string }
                  space: { type: string, enum: [guide-ras] }
                  electrodes:
                    type: array
                    items:
                      type: object
                      required: [name, world]
                      properties:
                        name: { type: string }
                        world:
                          type: array
                          items: { type: number }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: no such packaged net, or the guide is not installed

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: tit_session
    bearerAuth:
      type: http
      scheme: bearer

  responses:
    Unauthorized:
      description: missing or invalid session/token
    NotFound:
      description: no such resource

  parameters: {}

  schemas:
    # ------------------------------------------------------------------------------- v0, unchanged
    Health:
      type: object
      required: [status, uptime_s]
      properties:
        status: { type: string, enum: [ok] }
        uptime_s: { type: number }
    Version:
      type: object
      required: [tit_version, server_api, schema_hash, python, simnibs]
      properties:
        tit_version:
          type: string
          description: >-
            The installed `tit` package version at build time (e.g. "2.4.0"). This is expected to
            differ from this document's own `info.version` -- see the top-level description.
        server_api: { type: string, enum: [v0] }
        schema_hash: { type: string, description: sha256 of contracts/schema.json (empty until Phase 1) }
        python: { type: string }
        simnibs: { type: [string, "null"] }
    Capabilities:
      # D3 (dev/notes/v3-docker-streamline-plan.md): x11_display/freeview/gmsh/freesurfer removed
      # from the runtime entirely. V4 (dev/notes/v3-native-panes-external-viewer-plan.md):
      # `tetravox_embed` removed with the embed itself -- viewing is the host-installed Tetravox
      # desktop app, which this server neither ships, serves nor knows the version of.
      type: object
      required: [docker_socket, bpy, jupyter, fastsurfer]
      properties:
        docker_socket: { type: boolean }
        bpy: { type: boolean }
        jupyter: { type: boolean }
        fastsurfer:
          type: boolean
          description: FASTSURFER_HOME (or /opt/fastsurfer) has run_fastsurfer.sh
    ViewerOpen:
      type: object
      required: [name, path, host_path, scene]
      description: >-
        V2 (dev/notes/v3-native-panes-external-viewer-plan.md): where POST /api/view/open just
        wrote the scene document, in both path languages. `path` is inside the container;
        `host_path` is the same file as the *host* sees it (tit/server/host_path.py) and is what
        the Electron shell hands to the Tetravox desktop app. `host_path` is null when this server
        cannot know the host's own path for its project -- the app then offers the scene as a
        download instead of a launch.
      properties:
        name:
          type: string
          description: the scene file's basename, ending in `.tetravox.json`
        path:
          type: string
          description: absolute container path, under <project>/code/ti-toolbox/viewer/
        host_path: { type: [string, "null"] }
        scene:
          type: object
          additionalProperties: true
          description: >-
            the ViewSpec v2 document that was written, with every dataset/sidecar path rewritten
            from an /api/files/raw URL to the host's own absolute path -- the desktop app reads
            files, not URLs. Validated by contracts/tetravox-viewspec-v2.schema.json.
    Project:
      type: object
      required: [container_path, name]
      properties:
        container_path: { type: string }
        host_path: { type: [string, "null"], description: from LOCAL_PROJECT_DIR when known }
        name: { type: string }
    Subject:
      type: object
      required: [id, has_raw, has_fastsurfer, has_freesurfer, has_m2m, n_simulations]
      properties:
        id: { type: string, description: without the sub- prefix }
        has_raw: { type: boolean }
        has_fastsurfer: { type: boolean }
        has_freesurfer:
          {
            type: boolean,
            description: legacy derivatives/freesurfer, still detected read-only,
          }
        has_m2m: { type: boolean }
        n_simulations: { type: integer }
        has_sourcedata:
          {
            type: boolean,
            description:
              "sourcedata/sub-<id>/ has a raw T1w or T2w series staged (DICOM
              or equivalent), converted or not -- 'not converted' is this
              True with has_raw False. Optional: added 2026-09-03, lane FX5.",
          }
    SubjectList:
      type: object
      required: [subjects]
      properties:
        subjects:
          type: array
          items: { $ref: "#/components/schemas/Subject" }
    Simulation:
      type: object
      required: [name, path, has_ti, has_mti]
      properties:
        name: { type: string }
        path: { type: string, description: container path }
        has_ti: { type: boolean }
        has_mti: { type: boolean }
    SimulationList:
      type: object
      required: [simulations]
      properties:
        simulations:
          type: array
          items: { $ref: "#/components/schemas/SimulationDetail" }
    SystemSnapshot:
      type: object
      required: [ts, cpu_percent, cpu_count, mem, disk, processes]
      properties:
        ts: { type: number, description: unix seconds }
        cpu_percent: { type: number }
        cpu_count: { type: integer }
        mem:
          type: object
          required: [total, available, used, percent]
          properties:
            total: { type: integer }
            available: { type: integer }
            used: { type: integer }
            percent: { type: number }
        disk:
          type: object
          required: [total, free, percent]
          properties:
            total: { type: integer }
            free: { type: integer }
            percent: { type: number }
        processes:
          type: array
          description: toolbox-relevant processes (same keyword filter as system_monitor_tab.py)
          items:
            type: object
            required: [pid, name, cpu_percent, rss, started]
            properties:
              pid: { type: integer }
              name: { type: string }
              cmdline: { type: string }
              cpu_percent: { type: number }
              rss: { type: integer }
              started: { type: number }

    # -------------------------------------------------------------------------------- catalog (v1)
    SubjectDetail:
      description: v0 Subject plus m2m path, eeg nets, leadfield presence, dwi/ct presence
      allOf:
        - $ref: "#/components/schemas/Subject"
        - type: object
          required: [m2m_path, eeg_nets, has_leadfields, has_dwi, has_ct]
          properties:
            m2m_path: { type: [string, "null"] }
            eeg_nets:
              type: array
              items: { type: string }
            has_leadfields:
              type: array
              items: { type: string }
              description: EEG net names with a precomputed leadfield
            has_dwi: { type: boolean }
            has_ct: { type: boolean }
    NiftiRef:
      type: object
      required: [path, field, space]
      properties:
        path: { type: string }
        field: { type: string }
        space: { type: string, enum: [subject, mni] }
        tissue: { type: [string, "null"] }
    MeshRef:
      type: object
      required: [path, kind]
      properties:
        path: { type: string }
        kind: { type: string }
    SimulationDetail:
      description: v0 Simulation plus montages, fields, spaces, reports, niftis, meshes
      allOf:
        - $ref: "#/components/schemas/Simulation"
        - type: object
          required: [montages, fields, space, report_ids, niftis, meshes]
          properties:
            montages:
              type: array
              items: { type: string }
            fields:
              type: array
              items: { type: string }
            space:
              type: array
              items: { type: string, enum: [subject, mni] }
            report_ids:
              type: array
              items: { type: string }
            niftis:
              type: array
              items: { $ref: "#/components/schemas/NiftiRef" }
            meshes:
              type: array
              items: { $ref: "#/components/schemas/MeshRef" }
    MontagePairs:
      type: array
      description: pairs of electrode labels, e.g. [["E1","E2"],["E3","E4"]]
      items:
        type: array
        items: { type: string }
        minItems: 2
        maxItems: 2
    MontageNet:
      type: object
      properties:
        uni_polar:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/MontagePairs"
        multi_polar:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/MontagePairs"
    Montages:
      type: object
      required: [nets]
      properties:
        nets:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/MontageNet"
    EegNet:
      type: object
      required: [name, electrodes, n]
      properties:
        name: { type: string }
        electrodes:
          type: array
          items: { type: string }
        n: { type: integer }
    Atlas:
      type: object
      required: [id, name, path]
      properties:
        id: { type: string }
        name: { type: string }
        path: { type: string }
        hemispheres:
          type: array
          items: { type: string, enum: [lh, rh] }
    Region:
      type: object
      required: [id, name, hemi]
      description: >-
        For a cortical (surface/annotation) atlas, `id` is the FreeSurfer `.annot` label index --
        exactly the integer `FlexConfig.AtlasROI.label` / `ExConfig`'s equivalent needs, not a
        display string -- and `hemi` is that region's own hemisphere ("lh"/"rh"), since one
        `.annot` file is per-hemisphere and a cortical ROI can union regions across both. For a
        subcortical (volumetric) atlas, `id` is the voxel label value in that atlas's NIfTI and
        `hemi` is `null` (volumetric atlases are not inherently split by hemisphere).
      properties:
        id: { type: integer }
        name: { type: string }
        hemi:
          type: [string, "null"]
          enum: [lh, rh, null]
    Roi:
      type: object
      required: [name, x, y, z, space]
      properties:
        name: { type: string }
        x: { type: number }
        y: { type: number }
        z: { type: number }
        radius: { type: number }
        space: { type: string, enum: [subject, mni] }
    Leadfield:
      type: object
      required: [net, path, exists, size_bytes]
      properties:
        net: { type: string }
        path: { type: string }
        exists: { type: boolean }
        size_bytes: { type: integer }
    FlexRun:
      type: object
      required: [name, path, goal, roi, created, manifest, artifacts]
      properties:
        name: { type: string }
        path: { type: string }
        goal: { type: string }
        roi:
          type: object
          additionalProperties: true
        created: { type: string, format: date-time }
        manifest:
          type: object
          additionalProperties: true
        mappings:
          type: array
          description: >-
            EEG-label electrode pairs already mapped for this run, one entry per net
            (from its electrode_mapping_<net>.json files). Empty when the run has never
            been mapped onto a net; `optimized` is then the only way to simulate it.
          items: { $ref: "#/components/schemas/FlexMapping" }
        optimized:
          type: array
          nullable: true
          description: >-
            The run's free XYZ electrode pairs (Montage mode flex_free), from
            electrode_positions.json; null when the run wrote no usable positions.
          items:
            type: array
            items:
              type: array
              items: { type: number }
        artifacts:
          type: array
          items: { $ref: "#/components/schemas/Artifact" }
          description: run outputs (Pareto-front/convergence PNGs, CSVs, manifests) to list, not just reveal-in-folder
    FlexMapping:
      type: object
      required: [eeg_net, pairs]
      properties:
        eeg_net: { type: string }
        pairs:
          type: array
          description: one [anode, cathode] EEG-label pair per stimulation channel
          items:
            type: array
            items: { type: string }
    ExBest:
      type: object
      required: [montage, score]
      properties:
        montage: { type: string }
        score: { type: number }
    ExRun:
      type: object
      required: [run_name, path, eeg_net, created, artifacts]
      properties:
        run_name: { type: string }
        path: { type: string }
        eeg_net: { type: string }
        created: { type: string, format: date-time }
        best:
          oneOf:
            - $ref: "#/components/schemas/ExBest"
            - type: "null"
        artifacts:
          type: array
          items: { $ref: "#/components/schemas/Artifact" }
          description: run outputs (PNG plots, results CSV, config JSON) to list on the Results/Optimizer pages
    Analysis:
      type: object
      required: [name, space, field, roi, csv, json]
      properties:
        name: { type: string }
        space: { type: string, enum: [subject, mni] }
        field: { type: string }
        roi: { type: string }
        csv: { type: string }
        json: { type: string }
        msh: { type: [string, "null"] }
        nifti: { type: [string, "null"] }
        pdf: { type: [string, "null"] }
    Report:
      type: object
      required: [id, kind, title, path, created]
      properties:
        id: { type: string }
        kind: { type: string }
        title: { type: string }
        path: { type: string }
        created: { type: string, format: date-time }
    ElectrodeOverlay:
      type: object
      required: [mode, path, exists]
      properties:
        mode: { type: string, enum: [TI, mTI] }
        path: { type: string, description: container path (may not exist yet -- see `exists`) }
        exists: { type: boolean }
    ElectrodePosition:
      type: object
      required: [x, y, z]
      properties:
        label: { type: string }
        x: { type: number }
        y: { type: number }
        z: { type: number }
    FreehandConfig:
      type: object
      required: [name, type, electrode_positions]
      properties:
        name: { type: string }
        type:
          type: string
          enum: [U, M]
          description: >-
            On-disk stim_configs semantics (unipolar/multipolar), not xyz/label -- see
            `tit/catalog.py::_read_freehand_file`, the source of truth for
            `m2m_<id>/stim_configs/*.json` written by
            `tit/gui/extensions/electrode_placement.py`.
        electrode_positions:
          type: array
          items: { $ref: "#/components/schemas/ElectrodePosition" }
    GroupCatalog:
      type: object
      required: [stats, nilearn, group_analyses]
      properties:
        stats:
          type: array
          items: { type: object, additionalProperties: true }
        nilearn:
          type: array
          items: { type: object, additionalProperties: true }
        group_analyses:
          type: array
          items: { type: object, additionalProperties: true }
    Notes:
      type: object
      required: [text]
      properties:
        text: { type: string }
        updated_at: { type: [string, "null"], format: date-time }
    TableData:
      type: object
      required: [columns, rows]
      properties:
        columns:
          type: array
          items: { type: string }
        rows:
          type: array
          items:
            type: array
            items: {}

    # ------------------------------------------------------------------------------- overview (v1)
    PresenceState:
      type: string
      description: >
        Presence of one artefact for one subject. `partial` is a distinguishable state
        (raw staged under sourcedata/ but never converted; some but not all EEG nets have a
        leadfield); `pending` means a job that would produce it is queued or running now;
        `failed` means the newest such job failed and the artefact is still absent.
      enum: [present, absent, partial, pending, failed]
    OverviewCounts:
      type: object
      required: [simulations, optimizations, analyses]
      properties:
        simulations: { type: integer }
        optimizations: { type: integer, description: flex + ex + mEx search runs }
        analyses: { type: integer }
    OverviewReadiness:
      type: object
      required: [stage, ready]
      properties:
        stage:
          type: string
          enum: [preprocess, simulator, optimizer, analyzer]
        ready: { type: boolean }
        reason:
          type: string
          nullable: true
          description: the missing requirement, never a sentence
    OverviewSubject:
      type: object
      required: [id, raw, fastsurfer, freesurfer, m2m, dwi, ct, leadfield, eeg_net, leadfields, eeg_nets, counts, readiness]
      properties:
        id: { type: string, description: without the sub- prefix }
        raw: { $ref: "#/components/schemas/PresenceState" }
        fastsurfer: { $ref: "#/components/schemas/PresenceState" }
        freesurfer: { $ref: "#/components/schemas/PresenceState" }
        m2m: { $ref: "#/components/schemas/PresenceState" }
        dwi: { $ref: "#/components/schemas/PresenceState" }
        ct: { $ref: "#/components/schemas/PresenceState" }
        leadfield: { $ref: "#/components/schemas/PresenceState" }
        eeg_net: { $ref: "#/components/schemas/PresenceState" }
        leadfields:
          type: array
          items: { type: string }
          description: EEG nets with a precomputed leadfield
        eeg_nets:
          type: array
          items: { type: string }
        counts: { $ref: "#/components/schemas/OverviewCounts" }
        readiness:
          type: array
          items: { $ref: "#/components/schemas/OverviewReadiness" }
    OverviewCoverage:
      type: object
      required: [id, have, total]
      properties:
        id: { type: string }
        have: { type: integer }
        total: { type: integer }
    OverviewTotals:
      type: object
      required: [subjects, simulations, optimizations, analyses, coverage]
      properties:
        subjects: { type: integer }
        simulations: { type: integer }
        optimizations: { type: integer }
        analyses: { type: integer }
        coverage:
          type: array
          items: { $ref: "#/components/schemas/OverviewCoverage" }
    Overview:
      type: object
      required: [subjects, totals]
      properties:
        subjects:
          type: array
          items: { $ref: "#/components/schemas/OverviewSubject" }
        totals: { $ref: "#/components/schemas/OverviewTotals" }

    # --------------------------------------------------------------------------------- schema (v1)
    # (no dedicated component; /api/schema[/…] responses are typed as a generic object above)

    # ---------------------------------------------------------------------- validate / plan (v1)
    PipelineKind:
      type: string
      enum:
        [
          pre,
          sim,
          flex,
          flex_adaptive,
          flex_pareto,
          ex,
          mex,
          leadfield,
          analyzer,
          stats,
          source,
          blender,
          nifti_average,
          nilearn,
        ]
    ValidateError:
      type: object
      required: [path, message]
      properties:
        path: { type: string }
        message: { type: string }
    ValidateResult:
      type: object
      required: [ok, errors]
      properties:
        ok: { type: boolean }
        errors:
          type: array
          items: { $ref: "#/components/schemas/ValidateError" }
    LockConflict:
      type: object
      required: [key, held_by, kind, subject, started_at]
      properties:
        key: { type: string }
        held_by: { type: string, description: job id holding the lock }
        kind: { $ref: "#/components/schemas/JobKind" }
        subject: { type: string }
        started_at: { type: string, format: date-time }
    PlanJob:
      type: object
      required: [kind, subject, output_dir, exists, will_overwrite]
      properties:
        kind: { $ref: "#/components/schemas/JobKind" }
        subject: { type: string }
        output_dir: { type: string }
        exists: { type: boolean }
        will_overwrite: { type: boolean }
    PlanCost:
      type: object
      required: [cpus, mem_gb]
      properties:
        cpus: { type: number }
        mem_gb: { type: number }
    MontageSources:
      type: object
      description: >-
        Subject-scoped montage sources (flex-search run picks, saved freehand stim-configs) to
        merge into config.montages -- kind=sim only. tit.server.routes.plan resolves these via
        tit.sim.montage_sources and returns the merged set as PlanResolved.montages, one entry per
        (subject, source) pair. Kept out of the SimulationConfig dataclass itself: unlike a plain
        montage_list.json entry these two sources are inherently per-subject (a flex-search run
        directory or a stim_configs/*.json file only exists under one subject's m2m), so they
        cannot be part of the montage list every subject in a batch shares.
      properties:
        flex:
          type: array
          items:
            type: object
            required: [run]
            properties:
              subject: { type: string, description: "defaults to the job's own subject when omitted" }
              run: { type: string, description: "flex-search run directory name (FlexRun.name)" }
              electrode_type: { type: string }
              eeg_net: { type: string }
        freehand:
          type: array
          items:
            type: object
            required: [name]
            properties:
              subject: { type: string, description: "defaults to the job's own subject when omitted" }
              name: { type: string, description: "FreehandConfig.name" }
    PlanResolved:
      type: object
      properties:
        montages:
          type: array
          items: { type: object, additionalProperties: true }
        search_space:
          type: object
          additionalProperties: true
    PlanResult:
      type: object
      required: [jobs, lock_conflicts, cost, warnings]
      properties:
        jobs:
          type: array
          items: { $ref: "#/components/schemas/PlanJob" }
        lock_conflicts:
          type: array
          items: { $ref: "#/components/schemas/LockConflict" }
        cost: { $ref: "#/components/schemas/PlanCost" }
        warnings:
          type: array
          items: { type: string }
        resolved:
          oneOf:
            - $ref: "#/components/schemas/PlanResolved"
            - type: "null"

    # ------------------------------------------------------------------------------------- jobs (v1)
    JobKind:
      type: string
      enum:
        [
          pre,
          sim,
          flex,
          flex_adaptive,
          flex_pareto,
          ex,
          mex,
          leadfield,
          analyzer,
          stats,
          source,
          blender,
          nifti_average,
          nilearn,
          project_init,
          tools,
          report,
        ]
    JobState:
      type: string
      enum: [queued, running, succeeded, failed, cancelled, skipped, lost]
    JobProgress:
      type: object
      required: [stage, i, n, pct]
      properties:
        stage: { type: string }
        i: { type: integer }
        n: { type: integer }
        pct: { type: number }
    WaitingOn:
      type: object
      required: [key, job_id]
      properties:
        key: { type: string }
        job_id: { type: string }
    JobError:
      type: object
      required: [type, message, last_lines]
      properties:
        type:
          type: string
          enum:
            [
              preflight,
              lock_wait,
              budget_wait,
              runner_failed,
              oom_suspected,
              cancelled,
              skipped,
              lost,
              docker_unavailable,
              kind_error,
            ]
          description: >-
            The nine-value taxonomy `pages/jobs/format.ts::ERROR_LABEL` labels, plus `kind_error`
            (`tit/jobs/manager.py:628`, an unknown/disallowed job kind rejected before a runner ever
            starts). `pages/jobs/format.ts::errorLabel` title-cases any other value it does not
            recognise, so a not-yet-enumerated runner-emitted type degrades gracefully rather than
            crashing the Jobs page.
        message: { type: string }
        last_lines:
          type: array
          items: { type: string }
    Artifact:
      type: object
      required: [path, kind]
      properties:
        path: { type: string }
        kind: { type: string }
        label: { type: string }
    JobStatus:
      type: object
      required: [id, kind, state, subject_ids, created_at, artifacts]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/JobKind" }
        state: { $ref: "#/components/schemas/JobState" }
        subject_ids:
          type: array
          items: { type: string }
        group_id: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        progress:
          oneOf:
            - $ref: "#/components/schemas/JobProgress"
            - type: "null"
        liveness:
          type: [string, "null"]
          enum: [active, stalled, null]
        waiting_on:
          type: array
          items: { $ref: "#/components/schemas/WaitingOn" }
        exit_code: { type: [integer, "null"] }
        error:
          oneOf:
            - $ref: "#/components/schemas/JobError"
            - type: "null"
        artifacts:
          type: array
          items: { $ref: "#/components/schemas/Artifact" }
        cpu_percent: { type: [number, "null"] }
        rss: { type: [integer, "null"] }
        log_path:
          type: [string, "null"]
          description: >-
            Container path to this job's raw stdout/stderr log (`code/ti-toolbox/jobs/<id>/stdout.log`),
            the same file `GET /api/jobs/{id}/log` serves. Present so `pages/jobs/JobDetailDrawer.tsx`
            can show/copy it without reconstructing the path convention client-side (ra_13 finding 6).
    JobSpec:
      type: object
      required: [kind, config, subject_ids]
      properties:
        kind: { $ref: "#/components/schemas/JobKind" }
        config: { $ref: "#/components/schemas/PipelineConfig" }
        subject_ids:
          type: array
          items: { type: string }
        after:
          type: array
          items: { type: string }
          description: job ids this job must run after (DAG edges)
        tags:
          type: array
          items: { type: string }
        overwrite: { type: boolean }
    JobDetail:
      type: object
      required: [spec, status, artifacts]
      properties:
        spec: { $ref: "#/components/schemas/JobSpec" }
        status: { $ref: "#/components/schemas/JobStatus" }
        artifacts:
          type: array
          items: { $ref: "#/components/schemas/Artifact" }
    # -------------------------------------------------------------------------------- pipelines
    PipelineNode:
      type: object
      description: One node = exactly one existing job kind carrying exactly the config that page builds.
      required: [id, kind]
      properties:
        id: { type: string, description: canvas-scoped node id, unique within the document }
        kind:
          type: string
          enum: [pre, leadfield, flex, ex, mex, sim, analyzer, source, stats]
        label: { type: string, description: user-visible name; defaults to the kind }
        config:
          $ref: "#/components/schemas/PipelineConfig"
        position:
          type: object
          description: canvas coordinates; carried through untouched by the server
          properties:
            x: { type: number }
            y: { type: number }
    PipelineEdge:
      type: object
      description: >-
        A typed wire. `port` is one named output of `from` bound into the same-named input of `to`
        -- which is what makes "Optimizer -> Simulator" mean "the simulator's montage list is the
        optimizer's result" rather than a drawn line with no semantics.
      required: [from, to, port]
      properties:
        from: { type: string }
        to: { type: string }
        port:
          type: string
          enum: [subjects, montages, simulation, roi, leadfield]
    Pipeline:
      type: object
      description: The canvas document; mirrors contracts/pipeline.schema.json exactly.
      required: [version, nodes]
      properties:
        version: { type: integer, enum: [1] }
        name: { type: string }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/PipelineNode" }
        edges:
          type: array
          items: { $ref: "#/components/schemas/PipelineEdge" }
    PipelineRequest:
      type: object
      description: >-
        A pipeline document, either sent bare or wrapped as `{pipeline: <document>}` (the wrapped
        form is what `run` uses, since it carries submission options alongside).
      properties:
        pipeline: { $ref: "#/components/schemas/Pipeline" }
        version: { type: integer, enum: [1] }
        name: { type: string }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/PipelineNode" }
        edges:
          type: array
          items: { $ref: "#/components/schemas/PipelineEdge" }
    PipelineRunRequest:
      type: object
      required: [pipeline]
      properties:
        pipeline: { $ref: "#/components/schemas/Pipeline" }
        parallel_subjects:
          type: integer
          minimum: 1
          default: 1
          description: >-
            The same per-group concurrency cap JobGroupRequest carries; enforced by the scheduler.
        tags:
          type: array
          items: { type: string }
        overwrite:
          type: boolean
          description: Replace existing output instead of skipping it, for every job in the pipeline.
    PipelineIssue:
      type: object
      description: >-
        One validation finding. `message` is for a human; `code` is what a client keys on, so the
        canvas can tell an "it runs on its own" note (stated once for the whole graph) from a real
        blocker, and can render a `missing_input` as a chip on the node's own card that opens its
        editor at `port`.
      required: [level, message]
      properties:
        level: { type: string, enum: [error, warning] }
        message: { type: string, description: one sentence the UI shows verbatim }
        code:
          type: string
          description: stable machine-readable name of the finding (`tit.pipeline.validate.ISSUE_CODES`)
          enum:
            [
              empty,
              duplicate_id,
              edge_unknown_node,
              self_edge,
              bad_output,
              bad_input,
              double_bound,
              cycle,
              missing_input,
              unconfigured,
              unconnected,
            ]
        port:
          type: string
          enum: [subjects, montages, simulation, roi, leadfield]
          description: the port a `missing_input`/`bad_input`/`bad_output`/`double_bound` is about
        node_id: { type: string }
        edge: { $ref: "#/components/schemas/PipelineEdge" }
    PipelineJobPreview:
      type: object
      description: >-
        One job `run` would submit -- the receipt, computed without submitting anything. `label`
        and `after` are the plan-scoped labels the server resolves to real job ids at submission.
      required: [label, kind, subject_ids, after]
      properties:
        label: { type: string }
        kind: { type: string }
        subject_ids:
          type: array
          items: { type: string }
        after:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
    PipelineValidation:
      type: object
      required: [ok, issues, order]
      properties:
        ok: { type: boolean, description: false iff any issue has level "error" }
        issues:
          type: array
          items: { $ref: "#/components/schemas/PipelineIssue" }
        order:
          type: array
          description: node ids in dependency-first order; empty when the graph has a cycle
          items: { type: string }
        jobs:
          type: array
          description: what Run would submit; empty when the pipeline does not validate
          items: { $ref: "#/components/schemas/PipelineJobPreview" }
    PipelineRunResult:
      type: object
      description: The one group the whole pipeline became.
      required: [group_id, jobs]
      properties:
        group_id: { type: string }
        pipeline: { type: string }
        jobs:
          type: array
          items: { $ref: "#/components/schemas/JobStatus" }
    PipelineListEntry:
      type: object
      required: [name, modified_at, size]
      properties:
        name: { type: string }
        modified_at: { type: number, description: unix seconds }
        size: { type: integer }
        nodes:
          type: integer
          description: >-
            How many steps the saved document has, so the Saved list can state a pipeline's size
            without loading it. Absent when the file could not be parsed as a document.
        edges:
          type: integer
          description: How many wires the saved document has. Absent when it could not be parsed.
    PipelineKinds:
      type: object
      required: [port_types, kinds]
      properties:
        port_types:
          type: array
          items: { type: string }
        kinds:
          type: array
          items:
            type: object
            required: [kind, inputs, outputs, required]
            properties:
              kind: { type: string }
              inputs:
                type: array
                items: { type: string }
              outputs:
                type: array
                items: { type: string }
              required:
                type: array
                description: inputs that must be wired or satisfied by the node's own config
                items: { type: string }
    JobGroupRequest:
      type: object
      required: [kind, config, subject_ids, parallel_subjects]
      properties:
        kind:
          type: string
          enum: [pre, sim, flex, flex_adaptive, flex_pareto, ex, mex]
          description: >-
            Every kind that runs one independent job per subject. `pre` expands into the
            per-subject G1-G6/report DAG (tit.jobs.plans.plan_preprocessing); the others expand
            into one job per (subject, config) entry (tit.jobs.plans.plan_per_subject). Cohort
            kinds (a grouped `analyzer` run, `stats`) are one job over the whole selection and
            are submitted through POST /api/jobs instead.
        config: { $ref: "#/components/schemas/PipelineConfig" }
        subject_ids:
          type: array
          items: { type: string }
        subject_configs:
          type: array
          description: >-
            Optional per-subject configs, for a workflow whose config depends on the subject (an
            ROI resolved against that subject's own atlas, a subject-specific leadfield path) or
            that runs several jobs for one subject (the Simulator's one job per (subject,
            montage)). Entries are matched to subject_ids by subject_id; a subject with no entry
            uses `config`. Whatever is sent, the server forces each generated config's subject_id
            to its own subject, so a config can never carry another subject's id.
          items:
            type: object
            required: [subject_id, config]
            properties:
              subject_id: { type: string }
              config: { $ref: "#/components/schemas/PipelineConfig" }
        tags:
          type: array
          description: Tags copied onto every job in the group.
          items: { type: string }
        overwrite:
          type: boolean
          description: >-
            Replace existing output instead of skipping it, for every job in the group (the same
            flag POST /api/jobs takes per job). Ignored for kind=pre, which carries that policy in
            its own config's skip_existing_outputs / replace_existing_outputs flags.
        parallel_subjects:
          type: integer
          minimum: 1
          description: >-
            Per-group concurrency cap: at most this many of the group's per-subject jobs run at
            once. Enforced by the scheduler (tit.jobs), not by the number of jobs submitted --
            every subject's job is created immediately with state "queued" and the scheduler
            releases them onto runners this-many-at-a-time as earlier ones finish.
    JobGroupResult:
      type: object
      required: [group_id, jobs]
      properties:
        group_id: { type: string }
        jobs:
          type: array
          items: { $ref: "#/components/schemas/JobStatus" }
    Event:
      type: object
      description: >-
        Mirrors contracts/events.schema.json exactly. code is required for exit; outputs is the
        arbitrary result payload (required for result); artifacts is the accumulated {path, kind,
        label} list carried alongside it (result only); path/kind/label are an artifact event's
        own flat fields (both required for artifact), not nested under outputs/artifacts.
      required: [seq, ts, type]
      properties:
        seq: { type: integer, minimum: 0 }
        ts: { type: number, description: unix seconds }
        type: { type: string, enum: [log, stage, progress, marker, artifact, result, exit] }
        level: { type: string, enum: [debug, info, warning, error, critical] }
        logger: { type: string }
        msg: { type: string }
        stage: { type: string }
        i: { type: integer }
        n: { type: integer }
        pct: { type: number }
        path: { type: string, description: "artifact events; the produced file's path" }
        kind: { type: string, description: "artifact events; the produced file's kind" }
        label: { type: string, description: "artifact events; optional human-readable label" }
        outputs:
          type: object
          additionalProperties: true
          description: "result events; the runner's arbitrary structured result payload"
        artifacts:
          type: array
          items: { $ref: "#/components/schemas/Artifact" }
          description: "result events; the job's accumulated artifact list"
        code: { type: integer, description: "exit events; the runner's process exit code" }
    JobsWsClientMessage:
      description: sent by the client to (un)subscribe to a job's events over the shared socket
      oneOf:
        - type: object
          required: [subscribe]
          properties:
            subscribe:
              type: object
              description: map of job id -> last seq already seen (0 for from the start)
              additionalProperties: { type: integer, minimum: 0 }
        - type: object
          required: [unsubscribe]
          properties:
            unsubscribe:
              type: array
              items: { type: string }
    JobsWsServerMessage:
      description: pushed by the server; "job" for every job's transitions, "event" only for subscribed jobs
      oneOf:
        - type: object
          required: [type, job]
          properties:
            type: { type: string, enum: [job] }
            job: { $ref: "#/components/schemas/JobStatus" }
        - type: object
          required: [type, job_id, event]
          properties:
            type: { type: string, enum: [event] }
            job_id: { type: string }
            event: { $ref: "#/components/schemas/Event" }

    # ---------------------------------------------------------------------------------- viewers (v1)
    ViewLayer:
      type: object
      required: [path, kind, colormap, opacity, visible]
      properties:
        path: { type: string }
        kind: { type: string, enum: [volume, label] }
        colormap: { type: string }
        opacity: { type: number, minimum: 0, maximum: 1 }
        visible: { type: boolean }
        cal_min: { type: [number, "null"] }
        cal_max: { type: [number, "null"] }
        lut: { type: [string, "null"] }
        percentile:
          oneOf:
            - type: object
              required: [lo, hi]
              properties:
                lo: { type: number, minimum: 0, maximum: 100 }
                hi: { type: number, minimum: 0, maximum: 100 }
            - type: "null"
          description: >-
            Requested percentile window (e.g. {lo: 95, hi: 99.9}), alternative to explicit
            cal_min/cal_max. The server resolves this against the volume's actual voxel-intensity
            distribution at launch time (GET /api/view/{kind} or POST /api/viewers/freeview),
            filling cal_min/cal_max with the resolved absolute values before responding -- a
            layer's cal_min/cal_max are always the final absolute thresholds a viewer applies,
            whether the caller supplied them directly or via percentile.
    ViewSpec:
      type: object
      required: [space, layers, freeview_args]
      properties:
        space: { type: string, enum: [subject, mni] }
        layers:
          type: array
          items: { $ref: "#/components/schemas/ViewLayer" }
          description: >-
            resolved_layers: by the time a ViewSpec leaves the server (from GET /api/view/{kind}
            or is accepted by POST /api/view/args), every layer's cal_min/cal_max is already
            resolved to concrete numbers -- percentile is carried for the client's display
            only (e.g. to preselect a threshold-mode control), never something the client must
            resolve itself.
        freeview_args:
          type: array
          items: { type: string }
          description: >-
            DEPRECATED (D3, dev/notes/v3-docker-streamline-plan.md): the exact argv tail an
            external Freeview process would need (to_freeview_args). Kept for one release; no
            route launches Freeview any more (there is no X11 in this runtime).
        scene:
          type: [object, "null"]
          description: >-
            The real Tetravox ViewSpec v2 document (tit.viewspec.to_tetravox_viewspec) the
            embedded viewer's Engine.load() accepts directly -- datasets addressed by
            origin-relative /api/files/raw/... URLs (both DatasetRef.path and .absPath), layers
            in the engine's own vocabulary (VolumeLayer/MeshLayer). Derived from `layers` by a
            pure function, so the two always describe the same files. Untyped here (a generic
            object) because the full engine scene model is Tetravox-owned; the subset this
            server emits is hand-schema'd in contracts/tetravox-viewspec-v2.schema.json
            (host-facing). Optional, so an older server still satisfies this contract.

    # ------------------------------------------------------------------------------------ files (v1)
    # (no dedicated components; responses are raw bytes / text / TableData, typed inline above)

    # -------------------------------------------------------------------------------- settings (v1)
    Telemetry:
      type: object
      required: [consented, enabled]
      properties:
        consented: { type: boolean }
        enabled: { type: boolean }
    Settings:
      type: object
      required: [telemetry, panels, allow_unsafe_overrides, theme]
      properties:
        telemetry: { $ref: "#/components/schemas/Telemetry" }
        panels:
          type: array
          items: { type: string }
          description: enabled optional panels (Source, Cluster Permutation, NIfTI Group Average, Nilearn Visuals, Quick Notes, Subject Info)
        image_tag: { type: [string, "null"] }
        allow_unsafe_overrides: { type: boolean }
        theme: { type: string, enum: [system, light, dark] }

