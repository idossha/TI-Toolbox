openapi: 3.1.0
info:
  title: TI-Toolbox job server (tit.server)
  version: "1.0.0"
  description: >-
    The contract of record for the v3 Electron GUI -- the only hand-written API contract in the
    repository (the real server's own OpenAPI document must be a superset of it; CI gate
    `dev/contracts_check.py`). It covers the job engine, catalog CRUD, ViewSpec viewers, jailed
    file access, validate/plan preflight, settings, the `/ws/jobs` live-job stream, and the
    Phase-0 skeleton routes it grew out of. Auth: the launcher passes
    `?token=<TIT_SERVER_TOKEN>` exactly once; the server mints a random session id (never the
    token), keeps it in memory, sets it as an HttpOnly, SameSite=Strict `tit_session` cookie and
    redirects to `/`. A server restart forgets every session (401 -> back to the launcher). API
    routes accept either that cookie or `Authorization: Bearer <token>` (scripts). Unauthenticated
    requests to any route other than `/api/health` and `/auth/session` get 401.
    `POST /auth/logout` forgets the session and clears the cookie.

    Config request bodies (`config` fields below) are `dict[str, Any]`, validated server-side with
    `tit.config_io.deserialize_config`. Their real shapes are the `contracts/generated/config.schema.json` `$defs`
    (`SimulationConfig`, `Montage`, `FlexConfig`, `ExConfig`, `MExConfig`, `AnalyzerConfig`,
    `PreprocessConfig`, `QSIPrepConfig`, `QSIReconConfig`, `GroupComparisonConfig`,
    `CorrelationConfig`, `SourceConfig`, `LeadfieldConfig`, `MontageConfig`,
    `VectorConfig`, `RegionConfig`) merged into this document's `components.schemas`
    by `dev/build_contract.py`, which replaces every schema below carrying `x-tit-config` with the
    generated one. Until that merge runs, each is a permissive placeholder
    (`additionalProperties: true`) so the frontend can build against `openapi-typescript` output
    today.

    Events: one line of `<job>/events.jsonl` is one `Event` object; `contracts/events.schema.json`
    is the standalone JSON Schema 2020-12 for that line and mirrors the `Event` component here.

    `/ws/jobs`: a client connects once and multiplexes every job it cares about over one socket.
    Client -> server messages are a `JobsWsClientMessage`: `{"subscribe": {"<job_id>": <since_seq>}}`
    to start (or resume, from `since_seq` exclusive) streaming a job's events, or
    `{"unsubscribe": ["<job_id>", ...]}` to stop. Server -> client messages are a
    `JobsWsServerMessage`: `{"type": "job", "job": <JobStatus>}` is pushed for *every* job on every
    state transition (queued/running/succeeded/... ) regardless of subscription, so the jobs rail
    can render every live job without subscribing to each one individually; `{"type": "event",
    "job_id": "...", "event": <Event>}` is pushed only for jobs the client has subscribed to, in
    `seq` order, starting at `since_seq + 1`. Auth via the `tit_session` cookie or `?token=`
    (checked once at connect, same-origin rule as `/ws/system`).

    Path parameters are named `id` uniformly wherever this document has one resource-scoped path
    (`/api/jobs/{id}`, `/api/jobs/{id}/...`, `/api/files/report/{id}`) even though the server's own
    route functions use kind-specific parameter names internally (`job_id`, `report_id`) for
    readability; `dev/contracts_check.py` normalises `{id}` / `{job_id}` / `{report_id}` as the same
    parameter when comparing this contract against a live `--dump-openapi`, so that internal naming
    difference is never reported as drift.

    `/ws/jobs` and `/ws/system` are required in this document (they are real, documented routes) but
    are exempt from the `--dump-openapi` superset check: FastAPI does not describe WebSocket routes
    in its generated OpenAPI document at all, so a dump can never "contain" them regardless of
    whether the server implements them correctly.

    Response codes 401 (no/invalid session or token), 403 (path escapes the project's file jail),
    and 404 (unknown resource) are implied by this global auth/jail note for every protected route
    and are not repeated on every operation below (nor required in the `--dump-openapi` superset
    check, which treats them as covered by this note rather than requiring FastAPI to have
    documented an explicit response model for each). Each tag's own description below repeats this
    in one line as the router-level pointer back to this paragraph.

    `info.version` is the contract's own version, bumped when this document's shape changes; the
    live server's `/api/version.tit_version` is the installed `tit` package version at build time
    (e.g. "2.4.0") and will normally differ from it -- that is expected, not drift, and is not
    checked by `dev/contracts_check.py` (which only compares `paths` and `components.schemas`).
servers:
  - url: /
tags:
  - name: auth
    description: token/cookie session exchange
  - name: system
    description: >-
      health, version, capabilities, project binding, host resource snapshot (401/403/404 implied
      globally -- see the auth/jail note in this document's top-level description)
  - name: catalog
    description: >-
      read (and light CRUD) access to subjects, montages, ROIs, runs, results (401/403/404 implied
      globally -- see the auth/jail note in this document's top-level description)
  - name: schema
    description: >-
      the generated JSON Schema for every config dataclass (401/403/404 implied globally -- see the
      auth/jail note in this document's top-level description)
  - name: validate
    description: >-
      preflight field-level validation of a config, no side effects (401/403/404 implied globally --
      see the auth/jail note in this document's top-level description)
  - name: plan
    description: >-
      preflight resolution of what a job would do (outputs, locks, cost) (401/403/404 implied
      globally -- see the auth/jail note in this document's top-level description)
  - name: jobs
    description: >-
      submit, watch, and control long-running work (401/403/404 implied globally -- see the
      auth/jail note in this document's top-level description)
  - name: viewers
    description: >-
      build a declarative ViewSpec (as a real Tetravox ViewSpec v2 `scene` document, served
      client-side by the embedded viewer at /tetravox/ -- see the `capabilities.tetravox_embed`
      and `/api/files/raw/{path}` entries) for something to view, and write the same document to
      disk with host paths so it can be exported (401/403/404 implied globally -- see the auth/jail
      note in this document's top-level description). D3
      (docs/dev/HISTORY.md § 2026-09-03 (Docker streamline)): the external Freeview/Gmsh launch routes this tag
      used to also cover are removed -- there is no X11 in this runtime any more.
  - name: files
    description: >-
      jailed access to report HTML, artifacts, logs, and CSV-as-table data (401/403/404 implied
      globally -- see the auth/jail note in this document's top-level description)
  - name: settings
    description: >-
      server/project settings and app-level preferences (401/403/404 implied globally -- see the
      auth/jail note in this document's top-level description)
  - name: tetravox
    description: >-
      install, activate and remove the embedded viewer bundle served at /tetravox/ (401/403/404
      implied globally -- see the auth/jail note in this document's top-level description).
      docs/dev/HISTORY.md § 2026-09-04 (embed convergence) decisions E1-E4: the app pins a protocol *range* and
      named features rather than a viewer version, so a Tetravox release no longer implies a
      TI-Toolbox release.
  - name: scene
    description: >-
      the slim scene service the 3D panes read: two extracted surfaces, an EEG net's electrode
      positions, per-vertex atlas labels and a label volume's legend, cached under
      derivatives/ti-toolbox/scene_cache/ (401/403/404 implied globally -- see the auth/jail note
      in this document's top-level description). It is a *form control's* data source, not a
      viewer: no slicing, colormaps, field overlays or screenshots live here
      (docs/dev/HISTORY.md § 2026-09-04 (scene service), decision S1).
  - name: guide
    description: >-
      the fixed guide scene: prebuilt, immutable surfaces, atlas label payloads, legends and EEG-net
      channel positions packaged with the installation and derived from one reference head
      (docs/dev/HISTORY.md § 2026-09-05 R4). It answers with no project bound and no subject selected,
      and its coordinates are `guide-ras` -- an anatomical legend for choosing *names*, never a
      source of coordinates for a research subject's configuration.
paths:
  # ---------------------------------------------------------------- system / auth (v0, unchanged)
  /api/health:
    get:
      tags: [system]
      summary: Liveness (no auth)
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/version:
    get:
      tags: [system]
      summary: Version handshake
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/capabilities:
    get:
      tags: [system]
      summary: What this runtime can do (used to grey out UI); v0 + jupyter
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/project:
    get:
      tags: [settings]
      summary: The project this server instance is bound to
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/project/init:
    post:
      tags: [settings]
      summary: Seed a fresh project directory, optionally with the bundled example dataset
      description: >-
        Long-running (copies/generates a BIDS tree) so it is a job (R3), not an inline response.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [example_data]
              properties:
                example_data: { type: boolean }
      responses:
        "201":
          description: project-init job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/catalog/subjects:
    get:
      tags: [catalog]
      summary: Subjects with presence flags (PathManager rules, never re-implemented in TS)
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/catalog/simulations:
    get:
      tags: [catalog]
      summary: Simulations of one subject (v0 shape plus per-item montages/fields/space/reports/niftis/meshes)
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: subject
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: unknown subject
  /api/catalog/simulations/{name}:
    get:
      tags: [catalog]
      summary: One simulation's full detail (same per-item shape as the list, fetched directly)
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
        - in: query
          name: subject
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: unknown subject or simulation
  /api/system:
    get:
      tags: [system]
      summary: One system snapshot (same payload as the /ws/system stream)
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/system/storage:
    get:
      tags: [system]
      summary: What the project is using on disk, by output kind
      description: >-
        A full walk of the project, which on a large volume takes minutes -- so it is cached on
        disk (`code/ti-toolbox/cache/storage.json`) and refreshed in a background thread. This
        route never blocks on the walk: it answers from the cache immediately, starts a refresh
        when that cache is older than ten minutes (or `refresh=true`), and sets `scanning` while
        one is running. A project never scanned answers with zeros and `scanning: true`.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: refresh
          required: false
          schema: { type: boolean, default: false }
          description: start a rescan even when the cache is fresh
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectStorage"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/system/terminate:
    post:
      tags: [system]
      summary: Terminate a toolbox-relevant host process by pid (System screen "Terminate" action)
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pid]
              properties:
                pid: { type: integer }
      responses:
        "200":
          description: the pid, and whether it is gone
          content:
            application/json:
              schema:
                type: object
                required: [pid, terminated]
                properties:
                  pid: { type: integer }
                  terminated: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: no such process
  /auth/session:
    get:
      tags: [auth]
      summary: Token -> cookie exchange (called by the launcher once)
      parameters:
        - in: query
          name: token
          required: true
          schema: { type: string }
      responses:
        "303":
          description: cookie set, redirect to /
        "401":
          description: bad token
  /auth/logout:
    post:
      tags: [auth]
      summary: End the cookie session (cookie or Bearer auth required)
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "204":
          description: cookie cleared, session forgotten
        "401":
          $ref: "#/components/responses/Unauthorized"
  /ws/system:
    get:
      tags: [system]
      summary: WebSocket; one SystemSnapshot JSON message every 2 s (auth via cookie or ?token=)
      responses:
        "101":
          description: switching protocols

  /ws/tetravox:
    get:
      tags: [system]
      summary: WebSocket; app-level events (today only tetravox.updated)
      description: >-
        Silent until the Tetravox embed bundle is replaced under the app by the auto-update policy
        (A3). One message shape: {"type": "tetravox.updated", version, protocol, message}. Same
        handshake rules as /ws/system: cookie, Bearer or ?token=, and a present Origin must match
        Host. This is deliberately not on /ws/jobs (a stream about jobs) or /ws/system (a stream
        of one snapshot shape), and deliberately not in contracts/events.schema.json, which
        describes one line of a job's events.jsonl.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "101":
          description: switching protocols
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------------------------- catalog (v1)
  /api/catalog/subjects/{id}:
    get:
      tags: [catalog]
      summary: One subject's full detail (flags, m2m path, eeg nets, leadfields, dwi/ct presence)
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/catalog/electrode-overlays:
    get:
      tags: [catalog]
      summary: Electrode-overlay NIfTI presence for one simulation, per TI/mTI mode
      description: >-
        Listing-only: whether `tit.tools.electrode_overlay` (a `tools` job) has already produced
        `<simulation>/<mode>/montage_imgs/electrode_overlay_subject.nii.gz` for each mode, and its
        path. Building the overlay is out of scope here; see `tit/server/routes/viewers.py` and
        `tit/catalog.py::electrode_overlays`.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: subject
          required: true
          schema: { type: string }
        - in: query
          name: simulation
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ElectrodeOverlay" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: unknown subject or simulation
  /api/catalog/montages:
    get:
      tags: [catalog]
      summary: All montages, grouped by EEG net and polarity kind
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Montages"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/catalog/montages/{net}/{kind}/{name}:
    put:
      tags: [catalog]
      summary: Create or overwrite one montage
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: path
          name: net
          required: true
          schema: { type: string }
        - in: path
          name: kind
          required: true
          schema: { type: string, enum: [uni_polar, multi_polar] }
        - in: path
          name: name
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pairs]
              properties:
                pairs:
                  $ref: "#/components/schemas/MontagePairs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MontagePairs"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [catalog]
      summary: Delete one montage
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: path
          name: net
          required: true
          schema: { type: string }
        - in: path
          name: kind
          required: true
          schema: { type: string, enum: [uni_polar, multi_polar] }
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        "204":
          description: deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/catalog/eeg-nets:
    get:
      tags: [catalog]
      summary: EEG nets available to a subject (electrode labels per net)
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: subject
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EegNet" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: unknown subject
  /api/catalog/atlases:
    get:
      tags: [catalog]
      summary: Atlases available to a subject in a given space
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: subject
          required: true
          schema: { type: string }
        - in: query
          name: space
          required: false
          schema: { type: string, enum: [subject, mni] }
        - in: query
          name: kind
          required: false
          schema: { type: string, enum: [cortical, subcortical] }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Atlas" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: unknown subject
  /api/catalog/atlases/regions:
    get:
      tags: [catalog]
      summary: Regions of one atlas, optionally filtered by hemisphere
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: subject
          required: true
          schema: { type: string }
        - in: query
          name: atlas
          required: true
          schema: { type: string }
        - in: query
          name: hemi
          required: false
          schema: { type: string, enum: [lh, rh, both] }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Region" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: unknown subject or atlas
  /api/catalog/nifti/labels:
    get:
      tags: [catalog]
      summary: Integer labels present in one NIfTI label volume
      description: >-
        The label browser the 3D Visual Exporter's sub-cortical mode picks from. `path` is
        optional: omitted, it means the subject's own `<m2m>/segmentation/labeling.nii.gz`.
        A path outside the project jail returns 404, the same status as a file that is not
        there, so the route cannot be used to probe the filesystem.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: subject
          required: true
          schema: { type: string }
        - in: query
          name: path
          required: false
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NiftiLabel" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: unknown subject, or no readable label volume at that path
  /api/catalog/rois:
    get:
      tags: [catalog]
      summary: Saved ROIs for a subject
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: subject
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Roi" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: unknown subject
    post:
      tags: [catalog]
      summary: Save a new ROI for a subject
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: subject
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Roi"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Roi"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/catalog/rois/{name}:
    delete:
      tags: [catalog]
      summary: Delete one saved ROI
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
        - in: query
          name: subject
          required: true
          schema: { type: string }
      responses:
        "204":
          description: deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/catalog/leadfields:
    get:
      tags: [catalog]
      summary: Precomputed leadfields for a subject
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: subject
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Leadfield" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: unknown subject
  /api/catalog/flex-runs:
    get:
      tags: [catalog]
      summary: Flex-search runs for a subject
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: subject
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FlexRun" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: unknown subject
  /api/catalog/flex-runs/{run}/mapping:
    get:
      tags: [catalog]
      summary: Map one flex-search run's optimised positions onto an EEG net
      description: >-
        The run's electrodes as `eeg_net`'s labels. A run only carries
        `electrode_mapping_<net>.json` for nets it was already mapped onto; this maps the
        optimised XYZ onto any net the subject has (Hungarian assignment) and caches the
