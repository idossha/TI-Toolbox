  # ---------------------------------------------------------------------------------- viewers (v1)
  /api/view/{kind}:
    get:
      tags: [viewers]
      summary: Build a declarative ViewSpec for something to view (renderer-agnostic; consumed by the viewer launchers)
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: path
          name: kind
          required: true
          schema: { type: string, enum: [subject, simulation, analysis, group, custom] }
        - in: query
          name: subject
          required: false
          schema: { type: string }
        - in: query
          name: simulation
          required: false
          schema: { type: string }
        - in: query
          name: space
          required: false
          schema: { type: string, enum: [subject, mni] }
        - in: query
          name: field
          required: false
          schema: { type: string }
        - in: query
          name: analysis
          required: false
          schema: { type: string }
        - in: query
          name: atlas
          required: false
          description: >-
            which atlas overlay to build, as an id from GET /api/catalog/atlases for the same
            subject and space (kind=subject), or the basename of a bundled MNI atlas
            (kind=group, or kind=subject with space=mni). Absent preserves the previous
            behaviour exactly -- the server picks (labeling.nii.gz, else the first listed
            subject atlas; DEFAULT_MNI_ATLAS in MNI). An unknown id falls back to that same
            server choice rather than 404-ing, so a stale bookmark still renders something.
          schema: { type: string }
        - in: query
          name: roi
          required: false
          schema: { type: string }
        - in: query
          name: path
          required: false
          description: container path to an arbitrary volume/mesh, for kind=custom
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewSpec"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: unknown subject/simulation/analysis

  /api/view/open:
    post:
      tags: [viewers]
      summary: Write the scene file the host-installed Tetravox desktop app opens
      description: >-
        V2 (docs/dev/HISTORY.md § 2026-09-06 (native panes, external viewer)). Builds exactly the ViewSpec
        GET /api/view/{kind} would build for the same selection, rewrites every dataset and
        sidecar path from an /api/files/raw URL to the host's own absolute path, and writes it
        to <project>/code/ti-toolbox/viewer/<name>.tetravox.json -- the compound extension the
        Tetravox app registers as its scene type. This launches nothing: the server has no
        display, and the app it is written for runs on the host. One file per selection kind,
        overwritten on every Open, so the directory does not grow without bound.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              description: the same selection GET /api/view/{kind} takes, as a body
              properties:
                kind: { type: string, enum: [subject, simulation, analysis, group, custom] }
                subject: { type: [string, "null"] }
                simulation: { type: [string, "null"] }
                space: { type: [string, "null"] }
                field: { type: [string, "null"] }
                analysis: { type: [string, "null"] }
                atlas: { type: [string, "null"] }
                roi: { type: [string, "null"] }
                path: { type: [string, "null"] }
                dry_run:
                  type: boolean
                  default: false
                  description: >-
                    VM. Resolve the selection and answer with the scene and its file list, but
                    write nothing -- the Viewer page's preview strip, which must be able to show
                    what a selection resolves to without leaving a file behind or launching
                    anything.
                files:
                  type: array
                  items: { type: string }
                  description: >-
                    VM2. The scene's datasets, in order, as absolute container paths -- the
                    Viewer page's editable "what will open" list. **Authoritative when given**:
                    these files, this order, and nothing the view type would otherwise have
                    contributed. What the client does not send is how each file should look;
                    a path the view type already produced keeps exactly that view type's layer
                    settings, and only an added path is described from scratch
                    (tit/viewspec.py::_layer_for_path). Every entry is re-resolved through the
                    project jail, and one that does not resolve is dropped rather than refused,
                    so a stale row in a restored preset does not cost the whole scene. Absent
                    means the view type decides, exactly as before.
                extras:
                  type: array
                  items: { type: string, enum: [t1, atlas, electrodes, gm_mesh] }
                  description: >-
                    VM. Extra layers to add to whatever this view type already builds ("Also
                    open"). Each reuses the layer builder the server already trusted for that
                    file, and one this view already opens is a no-op rather than a second copy.
                    Absent adds nothing, which is what every caller before VM did.
                overrides:
                  type: object
                  additionalProperties: true
                  description: >-
                    VM. Additive, optional edits to the finished ViewSpec -- per-layer
                    `{visible, opacity, colormap, showIn3D, showColorbar, contoursIn2D,
                    threshold:{lo,hi}, colorMode, clip}` keyed by layer id, plus `layout`
                    (1x1 | 1+3 | 2x2 | 3d-only), `camera` (A|P|L|R|S|I), `radiological` and
                    `background` (dark|black|light, or an [r,g,b,a] vec4). Values the engine's
                    own type would not accept are dropped rather than written. Absent means the
                    document is byte-identical to what this endpoint returned before overrides
                    existed (tit/viewspec.py::apply_scene_overrides,
                    tests/test_viewspec_overrides.py).
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewerOpen"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: unknown subject/simulation/analysis

      # POST /api/view/args (freeview_args/freeview_command preview + scene) and the removed D3
      # /api/viewers/{freeview,gmsh} launch routes are deliberately not declared here, matching
      # this contract's existing practice of documenting only a subset of the live API (see
      # contracts/CHANGES.md) -- /api/view/args's request/response shape is exercised by
      # tests/test_catalog_v1.py and desktop/tests/mock-server/server.mjs instead.

  /api/viewer/candidates:
    get:
      tags: [viewers]
      summary: Every file this subject/simulation offers the Viewer's "+ Add…"
      description: >-
        VM2. Only files a scene can use (volumes and meshes), grouped the way a person looks for
        one, each with its size -- one of them is routinely 64 MB, and the point of the picker is
        to choose without guessing. A read: it opens nothing and writes nothing.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { in: query, name: subject, schema: { type: string } }
        - { in: query, name: simulation, schema: { type: string } }
        - { in: query, name: space, schema: { type: string, enum: [subject, mni] } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [candidates]
                properties:
                  candidates:
                    type: array
                    items: { $ref: "#/components/schemas/ViewerCandidate" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/viewer/tree:
    get:
      tags: [viewers]
      summary: What one subject offers the Menu's composition tree
      description: >-
        The Menu is a tree, not a row of dropdowns (2026-09-07): a subject, then Anatomy,
        Simulations and Analyses, each listing the inputs it actually has. Availability is driven
        by the catalog and by what is on disk right now -- every node is a real file with its size,
        or it is marked unavailable with the reason, because a tree that offers something which is
        not there moves the failure to Open. `simulations` repeats and says which ones are
        expanded, so analyses are listed only for those; a subject with a dozen simulations has a
        dozen Analyses directories, and listing all of them turns a menu into a file browser.
        Reads no voxels -- it is os.listdir and os.stat, because it is redrawn as a person clicks.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: subject
          schema: { type: string }
        - in: query
          name: space
          schema: { type: string, enum: [subject, mni] }
        - in: query
          name: simulations
          schema: { type: array, items: { type: string } }
          description: which simulations are expanded; absent means all of them
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ViewerTree" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/viewer/compositions:
    get:
      tags: [viewers]
      summary: Saved Viewer compositions
      description: >-
        A composition is *what a person chose* -- a subject, a space and the inputs ticked in the
        tree, by stable id (the container path). Small, diffable, and it survives a re-run of the
        pipeline: reloading it re-resolves today's choices against whatever is on disk then, and
        reports what has gone missing rather than failing. Distinct from a saved *scene*, which is
        what a person was looking at. One unreadable file is skipped, never fatal.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [compositions]
                properties:
                  compositions:
                    type: array
                    items: { $ref: "#/components/schemas/ViewerComposition" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/viewer/compositions/{name}:
    put:
      tags: [viewers]
      summary: Save one Viewer composition
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ViewerComposition" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ViewerComposition" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: a name that cannot become a file (refused rather than silently renamed)
    delete:
      tags: [viewers]
      summary: Forget one composition
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  deleted: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: no composition by that name
  /api/viewer/scenes:
    get:
      tags: [viewers]
      summary: Saved Tetravox scenes
      description: >-
        A scene is *what a person was looking at* -- the embed's own serialized ViewSpec, camera
        and per-layer window included -- written in the app's own format so the standalone
        Tetravox app opens it by double-click. The suffix `.tetravox.json` is not negotiable: the
        app routes any other suffix as a dataset and tries to read the JSON as a volume, silently.
        A PNG thumbnail and a metadata file share the stem. The documents themselves are not
        returned here (one is megabytes); GET /api/viewer/scenes/{name} is the read. Newest first.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [scenes]
                properties:
                  scenes:
                    type: array
                    items: { $ref: "#/components/schemas/SavedScene" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/viewer/scenes/suggest/name:
    get:
      tags: [viewers]
      summary: A default name for a new scene
      description: >-
        `<subject>_<sim>_<field>_<date>`. Server-side so the name a scene gets does not depend on
        which client saved it, and so the date is the project's clock rather than a browser's.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: subject
          schema: { type: string }
        - in: query
          name: simulation
          schema: { type: string }
        - in: query
          name: field
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [name]
                properties:
                  name: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/viewer/scenes/{name}:
    get:
      tags: [viewers]
      summary: One saved scene document
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [name, path, scene]
                properties:
                  name: { type: string }
                  path: { type: string }
                  scene:
                    type: object
                    additionalProperties: true
                    description: the Tetravox ViewSpec v2 document, verbatim
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: no saved scene by that name
    put:
      tags: [viewers]
      summary: Save the scene the viewer is showing
      description: >-
        `scene` is the embed's own `serialize` reply -- the live ViewSpec, with the camera the
        person left it at and every layer's current window -- and is written verbatim: a server
        that re-derived any part of it would be recording something other than what was on screen.
        `thumbnail` is the embed's `screenshot` reply as a data URL; anything that is not a real
        PNG, or is over the size cap, is dropped rather than refused, because a scene worth
        keeping is still worth keeping without its picture.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scene]
              properties:
                scene:
                  type: object
                  additionalProperties: true
                  description: the embed's serialized ViewSpec; must carry at least one layer
                thumbnail:
                  type: [string, "null"]
                  description: "data:image/png;base64,... from the embed's screenshot reply"
                subject: { type: [string, "null"] }
                simulation: { type: [string, "null"] }
                field: { type: [string, "null"] }
                space: { type: [string, "null"] }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedScene" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: scene document is implausibly large
        "422":
          description: an unusable name, or a scene with no layers
    delete:
      tags: [viewers]
      summary: Forget one saved scene
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  deleted: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: no saved scene by that name
  /api/viewer/presets:
    get:
      tags: [viewers]
      summary: Saved Viewer selections
      description: >-
        VM. Plain JSON documents under <project>/code/ti-toolbox/viewer/presets/. They live in the
        project, not in browser storage, because the project is the unit people copy, archive and
        share -- a preset kept in a browser would be lost exactly when the work it describes was
        passed on. The path is /api/viewer/presets and not /api/view/presets because the latter is
        shadowed by GET /api/view/{kind}. A preset that cannot be parsed is skipped, not fatal.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [presets]
                properties:
                  presets:
                    type: array
                    items: { $ref: "#/components/schemas/ViewerPreset" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/viewer/presets/{name}:
    put:
      tags: [viewers]
      summary: Save one Viewer selection
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ViewerPreset" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ViewerPreset" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: a name that cannot become a file (refused rather than silently renamed)
    delete:
      tags: [viewers]
      summary: Forget one saved selection
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  deleted: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ------------------------------------------------------------------------------------- files (v1)
  /api/files/mask:
    post:
      tags: [files]
      summary: Upload a custom NIfTI mask
      description: Finite nonempty 3D mask, at most 64 MiB uploaded and 512 MiB decompressed. Coordinate space is selected in the job.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: name
          required: true
          schema: { type: string }
        - in: query
          name: subject
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Stored mask
          content:
            application/json:
              schema:
                type: object
                required: [path]
                properties:
                  path: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Mask directory escapes the project
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: Mask exceeds the size limit
        "422":
          description: Invalid NIfTI mask or filename
  /api/files/report/{id}:
    get:
      tags: [files]
      summary: One generated HTML report, served with its own CSP for a sandboxed iframe
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            text/html:
              schema: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/files/raw/{path}:
    get:
      tags: [files]
      summary: Raw bytes of one volume/mesh/LUT file for the in-app viewer, jailed to the project
      description: >-
        Unlike /api/files/artifact this is not restricted to the document extension allow-list:
        it streams any file inside the project (or the bundled resources/atlas directory) as
        opaque bytes for the in-app viewer -- .nii, .nii.gz, .msh, .msh.opt, .gii, .geo,
        *_LUT.txt, .lut, .annot, .mgz. Extensions a browser could execute as a document
        (.html, .htm, .xhtml, .svg, .xml, .xsl, .mhtml) are refused with 403. The URL path IS
        the file's absolute container path minus its leading slash, so the last URL segment is
        the real file name -- the viewer's loader takes the file name, its gzip decision and its
        volume-vs-mesh routing from that segment. Every response is application/octet-stream
        with X-Content-Type-Options: nosniff and Content-Disposition: attachment, and never
        carries a Content-Encoding (a .nii.gz reaches the viewer still deflated). Supports HTTP
        Range (206 / Accept-Ranges: bytes / 416), If-Range, and ETag revalidation (304). HEAD
        returns the same headers with no body.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: path
          name: path
          required: true
          description: absolute container path without its leading slash
          schema: { type: string }
        - in: header
          name: Range
          required: false
          schema: { type: string }
      responses:
        "200":
          description: raw file bytes
          headers:
            Accept-Ranges: { schema: { type: string } }
            ETag: { schema: { type: string } }
          content:
            "*/*":
              schema: { type: string, format: binary }
        "206":
          description: partial content
          content:
            "*/*":
              schema: { type: string, format: binary }
        "304":
          description: not modified (If-None-Match matched the ETag)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: path escapes the project jail, or a document-executable extension
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          description: requested range not satisfiable
    head:
      tags: [files]
      summary: Size, ETag and range support of one raw file, without its bytes
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: path
          name: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: headers only
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: path escapes the project jail
        "404":
          $ref: "#/components/responses/NotFound"
  /api/files/artifact:
    get:
      tags: [files]
      summary: One job/analysis artifact by path (pdf/png/csv/json/txt), jailed to the project directory
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: raw file bytes; media type matches the artifact's extension
          content:
            "*/*":
              schema: { type: string, format: binary }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: path escapes the project jail
        "404":
          $ref: "#/components/responses/NotFound"
  /api/files/text:
    get:
      tags: [files]
      summary: Tail of a text/log file, jailed to the project directory
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: path
          required: true
          schema: { type: string }
        - in: query
          name: tail
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          content:
            text/plain:
              schema: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: path escapes the project jail
        "404":
          $ref: "#/components/responses/NotFound"
  /api/files/csv:
    get:
      tags: [files]
      summary: A CSV file parsed into a table, jailed to the project directory
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableData"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: path escapes the project jail
        "404":
          $ref: "#/components/responses/NotFound"

  # ----------------------------------------------------------------------------------- settings (v1)
  /api/settings:
    get:
      tags: [settings]
      summary: Server/project settings and app-level preferences
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [settings]
      summary: Replace server/project settings
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthorized"


  # ---------------------------------------------------------------------------------- pipelines (v1)
  # A pipeline is a DAG of existing job kinds (contracts/pipeline.schema.json). Running one is
  # exactly one `submit_plan` call, so a pipeline run is ONE job group with ONE group_id -- there
  # is no pipeline executor and no new job kind. See tit/pipeline/ and docs/wiki/pipelines.md.
  /api/pipelines:
    get:
      tags: [pipelines]
      summary: Saved pipelines in this project (code/ti-toolbox/pipelines/)
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PipelineListEntry" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/pipelines/kinds:
    get:
      tags: [pipelines]
      summary: Node kinds and their typed ports (the canvas palette)
      description: >-
        The canvas draws its ports from this rather than from a hand-kept copy, so a port added
        on the server appears in the UI without a renderer change.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineKinds"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/pipelines/validate:
    post:
      tags: [pipelines]
      summary: Validate a pipeline graph, with a reason per problem
      description: >-
        Never 500s on a graph problem: a cycle, an incompatible port or an unbound required input
        comes back as an `issue` with a sentence the UI shows next to the node or wire. A 422 means
        the document is not shaped like a pipeline at all.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PipelineRequest" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PipelineValidation" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: the document is not a valid pipeline document

  /api/pipelines/run:
    post:
      tags: [pipelines]
      summary: Run a whole pipeline as one job group
      description: >-
        One submission. Every job's `after` is the document's edges resolved to real job ids, and
        every job carries the one `group_id` in the response -- so Jobs shows the pipeline as one
        row with its member tree and cancels as one thing. Ports whose value only exists after the
        producer ran (montage names from an optimizer, a leadfield, a simulation name whose montages
        were themselves optimized) get a small `tools` resolve job planned between producer and
        consumer.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PipelineRunRequest" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PipelineRunResult" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: the pipeline does not validate (body carries the issues) or a config is invalid

  /api/pipelines/export:
    post:
      tags: [pipelines]
      summary: Export a pipeline as a Jupyter notebook
      description: >-
        A pure function of the document. The body is the `.ipynb` JSON as text; the pipeline itself
        rides along in `metadata.ti_toolbox.pipeline`, so a later import restores the canvas without
        parsing Python.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: format
          required: false
          schema: { type: string, enum: [ipynb], default: ipynb }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PipelineRequest" }
      responses:
        "200":
          content:
            text/plain:
              schema: { type: string, description: the .ipynb document as JSON text }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: unsupported format, or an invalid document
        "501":
          description: nbformat is not installed in this environment

  /api/pipelines/{name}:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
    get:
      tags: [pipelines]
      summary: Load a saved pipeline
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pipeline" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: illegal pipeline name, or the saved file is not a pipeline document
    put:
      tags: [pipelines]
      summary: Save a pipeline document
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PipelineRequest" }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [name, saved]
                properties:
                  name: { type: string }
                  saved: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: illegal pipeline name, or an invalid document
    delete:
      tags: [pipelines]
      summary: Delete a saved pipeline
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "204":
          description: deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ----------------------------------------------------------------------------------- tetravox (v1)
  # docs/dev/HISTORY.md § 2026-09-04 (embed convergence), decisions E1-E4. Nothing here auto-installs: every
  # write starts at a request the user made in Settings -> Viewer engine.
  /api/tetravox:
    get:
      tags: [tetravox]
      summary: The active embed bundle, everything installed, and the supported protocol range
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TetravoxState"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/tetravox/updates:
    get:
      tags: [tetravox]
      summary: Check the release index for installable embed bundles
      description: >-
        The index is the GitHub Releases API of idossha/tetravox (A2,
        docs/dev/HISTORY.md § 2026-09-05/06 (Tetravox auto-update, selection, pipeline canvas)): non-draft, non-prerelease releases
        carrying tetravox-embed-<ver>.tgz plus its .tgz.sha256 and .manifest.json sidecars, the
        protocol read from the manifest asset so the check never downloads a bundle.
        TIT_TETRAVOX_RELEASE_INDEX overrides it for a mirror and accepts either that JSON or a
        flat {"releases": [...]} index. Answers 200 with available=false and a readable message
        when the index cannot be reached or GitHub rate-limits it: being offline is a state the
        Settings page renders, not an error to retry. The answer comes from the cache the
        background check writes unless refresh=true.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: refresh
          required: false
          schema: { type: boolean, default: false }
          description: >-
            ask the index again instead of answering from the cache ("Check now"). Unauthenticated
            GitHub allows 60 requests per hour per IP, so a plain render never spends one.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TetravoxUpdates"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/tetravox/policy:
    post:
      tags: [tetravox]
      summary: Turn automatic viewer updates on or off
      description: >-
        A3. With auto_update on (the default) the server checks the release index at startup and
        every 24 h and installs a newer bundle **only** when its protocol is inside the supported
        range; a release past the range is reported as needing a TI-Toolbox update and is never
        installed. Off means check and report, not stop knowing. Persisted in
        <install root>/policy.json.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auto_update]
              properties:
                auto_update: { type: boolean }
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TetravoxState"
        "400":
          description: auto_update is not a boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/tetravox/install:
    post:
      tags: [tetravox]
      summary: Download, verify and activate an embed bundle
      description: >-
        Either {url, sha256}, or {version} resolved from the release index. The digest is verified
        before the archive is opened; extraction is traversal-safe; the manifest's protocol must be
        inside the supported range; activation is a single os.replace, so a half-extracted install
        is never served (E3).
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              # Either {url, sha256} -- the digest is mandatory, it is the whole trust model --
              # or {version}, whose url and digest are read from the release index.
              type: object
              properties:
                url: { type: string }
                sha256: { type: string }
                version: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TetravoxState"
        "400":
          description: bad digest, bad manifest, unsupported protocol, or a host off the allowlist
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: the download or the release index could not be reached
  /api/tetravox/activate:
    post:
      tags: [tetravox]
      summary: Activate an installed version, or "baked" to roll back to the image's copy
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version:
                  type: string
                  description: an installed version, or "baked" to roll back to the image's copy
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TetravoxState"
        "400":
          description: no version given
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/tetravox/{version}:
    delete:
      tags: [tetravox]
      summary: Remove an installed embed bundle
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: version
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TetravoxState"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # -------------------------------------------------------------------------------------- scene (v1)
  # docs/dev/HISTORY.md § 2026-09-04 (scene service) §2, decisions S1-S3. Response bodies are plain dicts (the
  # pattern every /api/catalog route follows), so the shapes below are stated inline rather
  # than as named components -- there is no server-side Pydantic model for the dump to name.
  /api/scene/manifest:
    get:
      tags: [scene]
      summary: Everything one subject's scene pane can load, with cache state
      description: >-
        `202` with a `Retry-After` header while the surfaces are still being extracted from the
        head mesh; the body then carries `cache.state: "building"`, an empty `parts`, and the
        cheap halves (`nets`, `atlases`, `volumes`) already filled in. `wait=<seconds>` asks for
        an explicit, capped block instead of polling — the default of 0 never holds the
        connection. `X-Scene-Build-Ms` reports what the served artifacts cost to build and
        `X-Scene-Cache: hit|building` whether this request paid it.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: subject
          required: true
          schema: { type: string }
        - in: query
          name: wait
          required: false
          description: seconds to block for a cold build before answering 202 (0 = never block)
          schema: { type: number, default: 0 }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [subject, space, parts, nets, atlases, volumes, cache]
                properties:
                  subject: { type: string }
                  space: { type: string, enum: [subject-ras] }
                  bbox:
                    type: [array, "null"]
                    description: >-
                      [x0, y0, z0, x1, y1, z1] over every served part, world mm; `null` when no
                      part is cached yet, which is the body a `202` carries.
                    items: { type: number }
                  focus_bbox:
                    type: [array, "null"]
                    description: >-
                      The framing hint (plan §S7): the same box with the neck cut off at the
                      lowest grey-matter vertex, i.e. everything at or above the bottom of the
                      cerebellum. `bbox` is what the scene *contains*; this is what a pane should
                      *frame*, because a head model's skin runs to the shoulders (sub-ernie:
                      z = -128.9 mm, against -50.7 for grey matter) and framing that spends about
                      a fifth of a pane's height on neck. `null` on a `202`, and on any cache
                      entry written before builder version 2.
                    items: { type: number }
                  parts:
                    type: array
                    items:
                      type: object
                      required: [id, kind, triangles, vertices, bytes, fingerprint, url]
                      properties:
                        id: { type: string, enum: [skin, gm] }
                        kind: { type: string, enum: [surface] }
                        triangles: { type: integer }
                        vertices: { type: integer }
                        bytes: { type: integer }
                        fingerprint: { type: string }
                        url: { type: string }
                        simplified: { type: boolean }
                        within_budget:
                          type: boolean
                          description: >-
                            false when the §S3 budget (150 000 triangles, 3 MB) could not be met;
                            the true counts are still reported rather than the payload silently
                            shipping oversized.
                        max_deviation_mm: { type: number }
                        bbox:
                          type: array
                          items: { type: number }
                        focus_bbox:
                          type: array
                          description: this part's own contribution to the manifest's focus_bbox
                          items: { type: number }
                  nets:
                    type: array
                    items:
                      type: object
                      required: [name, electrodes, url]
                      properties:
                        name: { type: string }
                        electrodes: { type: integer }
                        url: { type: string }
                  atlases:
                    type: array
                    items:
                      type: object
                      required: [id, hemispheres, regions, url]
                      properties:
                        id: { type: string }
                        hemispheres:
                          type: array
                          items: { type: string, enum: [lh, rh] }
                        regions: { type: integer }
                        url: { type: string }
                  volumes:
                    type: array
                    items:
                      type: object
                      required: [id, url, legend_url]
                      properties:
                        id: { type: string }
                        url: { type: string }
                        legend_url: { type: string }
                  cache:
                    type: object
                    required: [state]
                    properties:
                      state: { type: string, enum: [ready, building] }
                      built_ms: { type: number }
        "202":
          description: the cache is building; retry after Retry-After seconds
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >-
            `detail` is one sentence a user can act on, never "unknown subject": a subject the
            project does not have is told which ids it does have; a subject whose head model has
            not been built yet (listed by `GET /api/catalog/subjects`, including one whose raw
            data is only staged under `sourcedata/`) is told that `m2m_<id>/` is missing and what
            to run. Every `/api/scene/*` route answers a subject-level question the same way.
  /api/scene/surface:
    get:
      tags: [scene]
      summary: One scene surface (skin or gm) as TVSC1 or GIfTI binary
      description: >-
        The `tvsc` payload is the `TVSC1` layout frozen in `docs/dev/HISTORY.md § 2026-09-04 (scene service)` §2.3:
        a 32-byte header (magic `TVSC`, version 1, `u32` vertexCount, `u32` indexCount, `u32`
        flags, 12 reserved bytes) then `float32` positions in world millimetres and `uint32`
        triangle indices. `format=gii` serves the same vertices and triangles as a GIfTI mesh for
        the embedded Tetravox renderer. `ETag` is the part plus its source fingerprint and the
        requested format, and the response is `must-revalidate`, because the same URL legitimately
        changes content after charm is re-run. `X-Scene-Vertices` / `X-Scene-Triangles` repeat the
        manifest's counts so a client can size a buffer before reading the body.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: subject
          required: true
          schema: { type: string }
        - in: query
          name: part
          required: true
          schema: { type: string, enum: [skin, gm] }
        - in: query
          name: format
          required: false
          description: >-
            Which serialisation to serve. `tvsc` is the frozen `TVSC1` binary above;
            `gii` is GIfTI — `NIFTI_INTENT_POINTSET` (float32) plus
            `NIFTI_INTENT_TRIANGLE` (int32), `GZipBase64Binary` (a zlib stream), the
            coordinate system declared as `NIFTI_XFORM_SCANNER_ANAT` with an identity
            matrix — which the Tetravox embed reads with no bespoke decoder
            (`docs/dev/HISTORY.md § 2026-09-04 (embed convergence)` decision E7). Both are built from
            the same vertices and triangles by one build, and the `ETag` names the
            format so one payload can never be revalidated as the other.
          schema: { type: string, enum: [tvsc, gii], default: tvsc }
        - in: query
          name: wait
          required: false
          schema: { type: number, default: 0 }
        - in: header
          name: If-None-Match
          required: false
          schema: { type: string }
      responses:
        "200":
          description: TVSC1 or GIfTI binary, per ?format
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "202":
          description: the cache is building; retry after Retry-After seconds
        "304":
          description: not modified (If-None-Match matched the ETag)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >-
            `detail` is one sentence a user can act on, never "unknown subject": a subject the
            project does not have is told which ids it does have; a subject whose head model has
            not been built yet (listed by `GET /api/catalog/subjects`, including one whose raw
            data is only staged under `sourcedata/`) is told that `m2m_<id>/` is missing and what
            to run. Every `/api/scene/*` route answers a subject-level question the same way.
            Also: a `part` other than `skin` or `gm`, which names the parts that exist.
  /api/scene/labels:
    get:
      tags: [scene]
      summary: Per-vertex uint16 region labels aligned to part "gm", as TVSC1 or GIfTI binary
      description: >-
        `format=tvsc` serves the compatibility labels payload (`indexCount` 0, `flags` bit0 set):
        the same positions the `gm` surface serves, in the same order, followed by one `uint16` per
        vertex. `format=gii` serves a renderable GIfTI mesh carrying the grey-matter triangles plus
        a `NIFTI_INTENT_LABEL` array and the atlas' `<LabelTable>`, so Tetravox can render and pick
        cortical regions from this one dataset. `0` means "no region" — the head mesh's grey-matter
        tag covers cerebellum and brainstem, which no cortical atlas describes. The label values
        index the `legend[].label` field of `GET /api/scene/regions` for the same atlas.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: subject
          required: true
          schema: { type: string }
        - in: query
          name: atlas
          required: true
          schema: { type: string }
        - in: query
          name: format
          required: false
          description: >-
            Which serialisation to serve. `tvsc` is the frozen `TVSC1` binary above;
            `gii` is GIfTI — `NIFTI_INTENT_POINTSET` (float32) plus
            `NIFTI_INTENT_TRIANGLE` (int32), `GZipBase64Binary` (a zlib stream), the
            coordinate system declared as `NIFTI_XFORM_SCANNER_ANAT` with an identity
            matrix — which the Tetravox embed reads with no bespoke decoder
            (`docs/dev/HISTORY.md § 2026-09-04 (embed convergence)` decision E7). Both are built from
            the same vertices and triangles by one build, and the `ETag` names the
            format so one payload can never be revalidated as the other.
          schema: { type: string, enum: [tvsc, gii], default: tvsc }
        - in: query
          name: wait
          required: false
          schema: { type: number, default: 0 }
        - in: header
          name: If-None-Match
          required: false
          schema: { type: string }
      responses:
        "200":
          description: TVSC1 labels payload or a renderable GIfTI mesh with label data, per ?format
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "202":
          description: the cache is building; retry after Retry-After seconds
        "304":
          description: not modified (If-None-Match matched the ETag)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >-
            `detail` is one sentence a user can act on, never "unknown subject": a subject the
            project does not have is told which ids it does have; a subject whose head model has
            not been built yet (listed by `GET /api/catalog/subjects`, including one whose raw
            data is only staged under `sourcedata/`) is told that `m2m_<id>/` is missing and what
            to run. Every `/api/scene/*` route answers a subject-level question the same way.
            Also: an atlas this subject has no annotation for, which names the ones it has.
  /api/scene/regions:
    get:
      tags: [scene]
      summary: One atlas' legend plus the URL of its label payload for part "gm"
      description: >-
        `legend[].label` is the `uint16` value that appears in the payload at `url`;
        `legend[].id` is the region's `.annot` row index within its own hemisphere — the same
        integer `GET /api/catalog/atlases/regions` and `FlexConfig.AtlasROI.label` use, so a
        pick in the pane maps straight onto a config.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: subject
          required: true
          schema: { type: string }
        - in: query
          name: atlas
          required: true
          schema: { type: string }
        - in: query
          name: wait
          required: false
          schema: { type: number, default: 0 }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [atlas, subject, legend, url, cache]
                properties:
                  atlas: { type: string }
                  subject: { type: string }
                  aligned_to: { type: string, enum: [gm] }
                  vertices: { type: integer }
                  radius_mm:
                    type: number
                    description: >-
                      a gm vertex further than this from any central-surface vertex is left
                      unlabelled rather than given the least-far region
                  labelled_fraction: { type: number }
                  url: { type: string }
                  legend:
                    type: array
                    items:
                      type: object
                      required: [label, id, hemi, name, color]
                      properties:
                        label: { type: integer }
                        id: { type: integer }
                        hemi: { type: string, enum: [lh, rh] }
                        name: { type: string }
                        color: { type: string }
                  cache:
                    type: object
                    properties:
                      state: { type: string, enum: [ready, building] }
                      built_ms: { type: number }
        "202":
          description: the labels payload is building; retry after Retry-After seconds
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >-
            `detail` is one sentence a user can act on, never "unknown subject": a subject the
            project does not have is told which ids it does have; a subject whose head model has
            not been built yet (listed by `GET /api/catalog/subjects`, including one whose raw
            data is only staged under `sourcedata/`) is told that `m2m_<id>/` is missing and what
            to run. Every `/api/scene/*` route answers a subject-level question the same way.
            Also: an atlas this subject has no annotation for, which names the ones it has.
  /api/scene/electrodes:
    get:
      tags: [scene]
      summary: One EEG net's electrode positions, in the surfaces' own world space
      description: >-
        Parsed from `m2m_<id>/eeg_positions/<net>.csv` (`<type>,x,y,z,name` rows). Coordinates
        are world millimetres in the same space as `GET /api/scene/surface`, which is what makes
        a marker land on the skin instead of beside it.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: subject
          required: true
          schema: { type: string }
        - in: query
          name: net
          required: true
          description: the net's CSV file name, as listed by GET /api/catalog/eeg-nets
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [net, space, electrodes, reference, fiducials]
                properties:
                  net: { type: string }
                  space: { type: string, enum: [subject-ras] }
                  electrodes:
                    type: array
                    items:
                      type: object
                      required: [name, world]
                      properties:
                        name: { type: string }
                        world:
                          type: array
                          items: { type: number }
                  reference:
                    type: array
                    items:
                      type: object
                      required: [name, world]
                      properties:
                        name: { type: string }
                        world:
                          type: array
                          items: { type: number }
                  fiducials:
                    type: array
                    items:
                      type: object
                      required: [name, world]
                      properties:
                        name: { type: string }
                        world:
                          type: array
                          items: { type: number }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >-
            `detail` is one sentence a user can act on, never "unknown subject": a subject the
            project does not have is told which ids it does have; a subject whose head model has
            not been built yet (listed by `GET /api/catalog/subjects`, including one whose raw
            data is only staged under `sourcedata/`) is told that `m2m_<id>/` is missing and what
            to run. Every `/api/scene/*` route answers a subject-level question the same way.
            Also: a net file this subject does not have.
  /api/scene/volume-legend:
    get:
      tags: [scene]
      summary: The label volume's id -> name/colour legend
      description: >-
        Parsed from `m2m_<id>/segmentation/labeling_LUT.txt` with the same line parser the
        optimizer's ROI picker uses, so the scene legend and the ROI dropdown cannot disagree
        about what a label is called. `color` is `null` when the table carries no RGB columns.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: subject
          required: true
          schema: { type: string }
        - in: query
          name: id
          required: false
          schema: { type: string, default: labeling }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [id, entries]
                properties:
                  id: { type: string }
                  entries:
                    type: array
                    items:
                      type: object
                      required: [id, name, color]
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        color: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >-
            `detail` is one sentence a user can act on, never "unknown subject": a subject the
            project does not have is told which ids it does have; a subject whose head model has
            not been built yet (listed by `GET /api/catalog/subjects`, including one whose raw
            data is only staged under `sourcedata/`) is told that `m2m_<id>/` is missing and what
            to run. Every `/api/scene/*` route answers a subject-level question the same way.
            Also: a volume id with no `labeling_LUT.txt` beside it.

  # -------------------------------------------------------------------------------------- guide (v1)
  # docs/dev/HISTORY.md § 2026-09-05 R4. The fixed guide scene: the same shapes /api/scene/* answers
  # with, minus every project-dependent part of them. No `subject` parameter, no cache state worth
  # polling, no build -- each response is a read of a file packaged with the installation.
  /api/guide/manifest:
    get:
      tags: [guide]
      summary: Everything the fixed guide scene contains
      description: >-
        The guide is prebuilt and immutable, so this never answers `202` and never depends on a
        project being bound. `space` is `guide-ras`, never `subject-ras`: the millimetres belong to
        the guide head, and a client that wrote one into a research subject's configuration would
        produce a coordinate no later validation could catch (R4). `parts[]`, `nets[]` and
        `atlases[]` have the same shape as the scene manifest's, so one pane component consumes
        either.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [guide, space, parts, nets, atlases, volumes, cache]
                properties:
                  guide:
                    type: object
                    required: [id, label]
                    properties:
                      id: { type: string, description: the source subject the guide was derived from }
                      label: { type: string }
                  guide_version: { type: integer }
                  space: { type: string, enum: [guide-ras] }
                  bbox:
                    type: [array, "null"]
                    items: { type: number }
                  focus_bbox:
                    type: [array, "null"]
                    items: { type: number }
                  parts:
                    type: array
                    items:
                      type: object
                      required: [id, kind, triangles, vertices, bytes, fingerprint, url]
                      properties:
                        id: { type: string, enum: [skin, gm] }
                        kind: { type: string, enum: [surface] }
                        triangles: { type: integer }
                        vertices: { type: integer }
                        bytes:
                          type: integer
                          description: size of the TVSC1 payload, held to the same 3 MB budget as a subject's
                        fingerprint: { type: string }
                        url: { type: string }
                        simplified: { type: boolean }
                        within_budget: { type: boolean }
                        max_deviation_mm: { type: number }
                        bbox:
                          type: array
                          items: { type: number }
                        focus_bbox:
                          type: array
                          items: { type: number }
                  nets:
                    type: array
                    items:
                      type: object
                      required: [name, electrodes, url]
                      properties:
                        name: { type: string }
                        electrodes: { type: integer }
                        url: { type: string }
                  atlases:
                    type: array
                    items:
                      type: object
                      required: [id, hemispheres, regions, url]
                      properties:
                        id: { type: string }
                        hemispheres:
                          type: array
                          items: { type: string, enum: [lh, rh] }
                        regions: { type: integer }
                        url: { type: string }
                  volumes:
                    type: array
                    description: always empty; the guide packages no label volume
                    items: { type: object }
                  provenance:
                    type: object
                    description: where the guide anatomy came from and under which licence
                    properties:
                      source: { type: string }
                      source_url: { type: string }
                      license: { type: string }
                      notes: { type: string }
                  cache:
                    type: object
                    required: [state]
                    properties:
                      state: { type: string, enum: [ready] }
                      built_ms: { type: number }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: the guide assets are not installed; `detail` says how to regenerate them
  /api/guide/surface:
    get:
      tags: [guide]
      summary: One packaged guide surface as TVSC1 or GIfTI binary
      description: >-
        The same two payload formats `GET /api/scene/surface` serves, from the packaged guide.
        `ETag` is the file's SHA-256 and `Cache-Control` is a year plus `immutable`: unlike a
        subject's surface, this URL's bytes cannot change without the installation changing.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: part
          required: true
          schema: { type: string, enum: [skin, gm] }
        - in: query
          name: format
          required: false
          schema: { type: string, enum: [tvsc, gii], default: tvsc }
      responses:
        "200":
          description: TVSC1 or GIfTI binary
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "304":
          description: not modified (If-None-Match matched the ETag)
        "400":
          description: unknown ?format
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: no such packaged part, or the guide is not installed
  /api/guide/labels:
    get:
      tags: [guide]
      summary: One packaged atlas' grey-matter surface with per-vertex labels
      description: >-
        A GIfTI mesh carrying the guide's grey-matter triangles, a `NIFTI_INTENT_LABEL` array and
        the atlas' own `<LabelTable>` — the payload the embedded renderer draws and picks regions
        on. Its label values index the `legend[].label` field of `GET /api/guide/regions`.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: atlas
          required: true
          schema: { type: string }
        - in: query
          name: format
          required: false
          schema: { type: string, enum: [gii], default: gii }
      responses:
        "200":
          description: GIfTI binary with a label array and label table
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "304":
          description: not modified
        "400":
          description: unknown ?format
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: no such packaged atlas, or the guide is not installed
  /api/guide/regions:
    get:
      tags: [guide]
      summary: One packaged atlas' legend plus the URL of its label payload
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: atlas
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [atlas, space, legend, url]
                properties:
                  atlas: { type: string }
                  space: { type: string, enum: [guide-ras] }
                  aligned_to: { type: string, enum: [gm] }
                  vertices: { type: integer }
                  radius_mm: { type: number }
                  labelled_fraction: { type: number }
                  legend:
                    type: array
                    items:
                      type: object
                      required: [label, id, hemi, name, color]
                      properties:
                        label:
                          type: integer
                          description: the uint16 value in the label payload
                        id:
                          type: integer
                          description: the .annot row index, which is what a config's AtlasROI.label carries
                        hemi: { type: string, enum: [lh, rh] }
                        name: { type: string }
                        color: { type: string }
                  url: { type: string }
                  cache:
                    type: object
                    properties:
                      state: { type: string, enum: [ready] }
                      built_ms: { type: number }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: no such packaged atlas, or the guide is not installed
  /api/guide/electrodes:
    get:
      tags: [guide]
      summary: One packaged EEG net's electrode positions in the guide's own space
      description: >-
        `world` is millimetres in `guide-ras`. Names are what a montage form writes; the positions
        exist so the pane can draw the net, not so a configuration can carry them.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - in: query
          name: net
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [net, space, electrodes]
                properties:
                  net: { type: string }
                  space: { type: string, enum: [guide-ras] }
                  electrodes:
                    type: array
                    items:
                      type: object
                      required: [name, world]
                      properties:
                        name: { type: string }
                        world:
                          type: array
                          items: { type: number }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: no such packaged net, or the guide is not installed

  # ---------------------------------------------------------------- notebooks (NB lane, §7.6)
  /api/notebooks:
    get:
      tags: [notebooks]
      summary: List the project's notebooks, newest first
      description: >-
        Everything under `<project>/code/ti-toolbox/notebooks`, which is also where the pipeline
        canvas's exported notebooks land.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotebookList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [notebooks]
      summary: Create a notebook, or store one that was uploaded
      description: >-
        With no `content` the notebook is the starter: a first code cell that already imports
        `tit` and prints this project's root, so the TI-Toolbox environment is loaded rather
        than described. With `content`, this is the import path -- "Import .ipynb" and the
        pipeline canvas saving its export are the same call.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                content: { type: object, additionalProperties: true, description: nbformat v4 document }
                overwrite: { type: boolean, default: false }
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notebook"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: a notebook of that name already exists
        "422":
          description: unusable name, or the document is not a valid notebook

  /api/notebooks/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [notebooks]
      summary: Read one notebook
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notebook"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [notebooks]
      summary: Write one notebook
      description: >-
        Validated with `nbformat.validate` before it lands: a document that fails is one every
        other tool in the project would then refuse to open, so the save is rejected rather than
        the file broken.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: object, additionalProperties: true }
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotebookEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: unusable name, or the document is not a valid notebook
    delete:
      tags: [notebooks]
      summary: Delete one notebook
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------- kernels (NB lane, §7.6)
  /api/kernels:
    get:
      tags: [kernels]
      summary: List the kernels this server is running
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KernelList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [kernels]
      summary: Start a kernel for a notebook session
      description: >-
        The kernelspec defaults to `simnibs` -- the container's SimNIBS Python with `tit` on the
        path -- and the working directory is the project root, so a relative path in a cell means
        what it means everywhere else in TI-Toolbox.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                kernelName: { type: string, default: simnibs }
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kernel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: the concurrent-kernel limit is already reached
        "501":
          description: no jupyter_client, or no such kernelspec, in this container

  /api/kernels/{kernel_id}:
    parameters:
      - name: kernel_id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [kernels]
      summary: Shut a kernel down
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [id, state]
                properties:
                  id: { type: string }
                  state: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/kernels/{kernel_id}/interrupt:
    parameters:
      - name: kernel_id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [kernels]
      summary: Interrupt the running cell
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [id, interrupted]
                properties:
                  id: { type: string }
                  interrupted: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/kernels/{kernel_id}/restart:
    parameters:
      - name: kernel_id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [kernels]
      summary: Restart a kernel; every variable is lost
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kernel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: tit_session
    bearerAuth:
      type: http
      scheme: bearer

  responses:
    Unauthorized:
      description: missing or invalid session/token
    NotFound:
      description: no such resource

  parameters: {}

  schemas:
    # ------------------------------------------------------------------ notebooks and kernels
    NotebookEntry:
      type: object
      required: [name, size, modified, example]
      properties:
        name: { type: string, description: "file name; may carry the one `examples/` prefix" }
        size: { type: integer }
        modified: { type: number, description: mtime, seconds since the epoch }
        example:
          type: boolean
          description: >-
            Lives under `examples/`. The seeded worked example, which the list sorts last and
            labels; a user's own notebooks are what they came for and are never pushed below it.
    NotebookList:
      type: object
      required: [dir, notebooks]
      properties:
        dir: { type: string, description: container path of code/ti-toolbox/notebooks }
        notebooks:
          type: array
          items: { $ref: "#/components/schemas/NotebookEntry" }
    Notebook:
      type: object
      required: [name, content]
      properties:
        name: { type: string }
        content:
          type: object
          additionalProperties: true
          description: an nbformat v4 document, verbatim
    Kernel:
      type: object
      required: [id, name, displayName, language, cwd, state, startedAt, lastUsed]
      properties:
        id: { type: string }
        name: { type: string, description: the kernelspec name, e.g. "simnibs" }
        displayName: { type: string }
        language: { type: string }
        cwd: { type: string }
        state: { type: string, enum: [starting, idle, busy, dead] }
        startedAt: { type: number }
        lastUsed: { type: number }
    KernelList:
      type: object
      required: [kernels, max, idleTimeoutSeconds]
      properties:
        kernels:
          type: array
          items: { $ref: "#/components/schemas/Kernel" }
        max: { type: integer, description: concurrent kernels this container allows }
        idleTimeoutSeconds: { type: number }
    # ------------------------------------------------------------------------------- v0, unchanged
    Health:
      type: object
      required: [status, uptime_s]
      properties:
        status: { type: string, enum: [ok] }
        uptime_s: { type: number }
    Version:
      type: object
      required: [tit_version, server_api, schema_hash, python, simnibs]
      properties:
        tit_version:
          type: string
          description: >-
            The installed `tit` package version at build time (e.g. "2.4.0"). This is expected to
            differ from this document's own `info.version` -- see the top-level description.
        server_api: { type: string, enum: [v0] }
        schema_hash: { type: string, description: sha256 of contracts/generated/config.schema.json (empty until Phase 1) }
        python: { type: string }
        simnibs: { type: [string, "null"] }
    Capabilities:
      # D3 (docs/dev/HISTORY.md § 2026-09-03 (Docker streamline)): x11_display/freeview/gmsh/freesurfer removed
      # from the runtime entirely; tetravox_embed/fastsurfer replace them.
      type: object
      required: [docker_socket, bpy, jupyter, tetravox_embed, fastsurfer]
      properties:
        docker_socket: { type: boolean }
        bpy: { type: boolean }
        jupyter: { type: boolean }
        tetravox_embed:
          type: object
          required: [available, version, protocol, source, features, compatible, supported]
          description: >-
            the *active* embed bundle at /tetravox/, resolved the way tit/server/static.py resolves
            it (dev override -> pinned/newest installed -> baked into the image), from its
            manifest.json. E1: `features` and `supported` are what let a host ask "can this embed
            do markers" instead of comparing version numbers.
          properties:
            available: { type: boolean }
            version: { type: [string, "null"] }
            protocol: { type: [integer, "null"] }
            source:
              type: [string, "null"]
              description: one of override, installed, baked; null when no bundle is available
            features:
              type: array
              items: { type: string }
              description: >-
                derived from the protocol, or taken verbatim from the manifest's own `features`
                array when it has one -- so a future embed can name a feature this build has never
                heard of
            compatible: { type: boolean }
            supported: { $ref: "#/components/schemas/ProtocolRange" }

        fastsurfer:
          type: boolean
          description: FASTSURFER_HOME (or /opt/fastsurfer) has run_fastsurfer.sh
    ProtocolRange:
      type: object
      required: [min, max]
      description: the inclusive embed-protocol range this build can host (tit/tetravox/protocol.py)
      properties:
        min: { type: integer }
        max: { type: integer }
    TetravoxRelease:
      type: object
      required: [version, protocol, source, path, features, compatible, active]
      properties:
        version: { type: string }
        protocol: { type: [integer, "null"] }
        source: { type: string, enum: [override, installed, baked] }
        path: { type: string }
        name: { type: [string, "null"] }
        sha: { type: [string, "null"] }
        features:
          type: array
          items: { type: string }
        compatible:
          type: boolean
          description: its protocol is inside ProtocolRange
        active:
          type: boolean
          description: this is the bundle /tetravox/ currently serves
    TetravoxState:
      type: object
      required: [reason, installed, supported, install_root, index_url, auto_update]
      properties:
        active:
          oneOf:
            - $ref: "#/components/schemas/TetravoxRelease"
            - type: "null"
        reason:
          type: string
          description: one line saying why that bundle is the active one
        installed:
          type: array
          items: { $ref: "#/components/schemas/TetravoxRelease" }
        baked:
          oneOf:
            - $ref: "#/components/schemas/TetravoxRelease"
            - type: "null"
        supported: { $ref: "#/components/schemas/ProtocolRange" }
        install_root:
          type: string
          description: <user config>/tetravox/embed unless TIT_TETRAVOX_INSTALL_ROOT says otherwise
        index_url: { type: string }
        auto_update:
          type: boolean
          description: >-
            A3: the server checks at startup and every 24 h and installs a newer *compatible*
            bundle on its own. Persisted in <install root>/policy.json; POST /api/tetravox/policy
    TetravoxUpdate:
      type: object
      required: [version, url, sha256, compatible, installed]
      properties:
        version: { type: string }
        protocol: { type: [integer, "null"] }
        url: { type: string }
        sha256: { type: string }
        notes: { type: [string, "null"] }
        published: { type: [string, "null"] }
        compatible:
          type: boolean
          description: protocol inside the supported range, i.e. installable by this build
        installed: { type: boolean }
    TetravoxUpdates:
      type: object
      required: [available, index_url, releases]
      properties:
        available:
          type: boolean
          description: false with a `message` when the index could not be reached
        message: { type: [string, "null"] }
        index_url: { type: string }
        releases:
          type: array
          items: { $ref: "#/components/schemas/TetravoxUpdate" }
        auto_update:
          type: boolean
          description: the persisted policy (A3); see TetravoxState
        checked_at:
          type: [number, "null"]
          description: unix seconds of the check this answer comes from (cached or fresh)
        from_cache:
          type: boolean
          description: >-
            this answer came from the cache rather than a request just made -- GitHub allows 60
            unauthenticated requests per hour per IP
        last_outcome:
          oneOf:
            - $ref: "#/components/schemas/TetravoxUpdateOutcome"
            - type: "null"
    TetravoxUpdateOutcome:
      type: object
      required: [action, message]
      description: >-
        what the last automatic pass decided (A3). `installed` = a newer compatible bundle is now
        active; `available` = there is one and automatic updates are off; `current`;
        `unsupported` = its protocol is past this build's range, so it was reported and never
        installed (A1); `failed` = offline, rate-limited, or a digest that did not match.
      properties:
        action:
          type: string
          enum: [installed, available, current, unsupported, failed]
        message: { type: string }
        version: { type: [string, "null"] }
        protocol: { type: [integer, "null"] }
        at: { type: [number, "null"], description: unix seconds }
    ViewerOpen:
      type: object
      required: [name, path, host_path, scene, view]
      description: >-
        One resolution of POST /api/view/open, in both addressings. `view` is the ViewSpec the
        **embed** is given: every dataset and sidecar path an /api/files/raw/... URL fetched back
        through this origin, and it is what the Viewer page posts into the iframe at /tetravox/.
        `scene` is the same document with every path re-rooted onto the host, and is what was
        written to <project>/code/ti-toolbox/viewer/<kind>.tetravox.json so the selection can be
        exported or opened outside this app. Both come from a single tit.viewspec.build_view call:
        two resolutions could differ (a job finishing between them is enough) and then the file
        list, the file on disk and the picture on screen would disagree with nothing to say which
        was right. `path` is inside the container; `host_path` is that same file as the *host* sees
        it (tit/server/host_path.py), or null when this server cannot know its project's host root.
      properties:
        name:
          type: string
          description: the scene file's basename, ending in `.tetravox.json`
        path:
          type: string
          description: absolute container path, under <project>/code/ti-toolbox/viewer/
        host_path: { type: [string, "null"] }
        scene:
          type: object
          additionalProperties: true
          description: >-
            the ViewSpec v2 document that was written, with every dataset/sidecar path rewritten
            from an /api/files/raw URL to the host's own absolute path -- the desktop app reads
            files, not URLs. Validated by contracts/tetravox-viewspec-v2.schema.json.
        view:
          type: object
          additionalProperties: true
          description: >-
            the same scene as the embed is given it: every dataset/sidecar path an
            /api/files/raw/... URL. Validated by contracts/tetravox-viewspec-v2.schema.json.
        files:
          type: array
          items: { $ref: "#/components/schemas/ViewerSceneFile" }
          description: >-
            VM. One row per dataset the scene references, so the Viewer page can show what a
            selection resolves to -- and how big it is -- before another application's window
            opens on top of someone's work.
        dry_run:
          type: boolean
          description: true when the request asked to resolve only; nothing was written
    ViewerCandidate:
      type: object
      required: [name, path, kind, group]
      properties:
        name: { type: string }
        path: { type: string, description: absolute container path }
        kind: { type: string, enum: [volume, mesh] }
        group: { type: string, description: the heading it is listed under }
        bytes: { type: [integer, "null"] }
    ViewerTreeNode:
      type: object
      required: [id, name, label, path, kind, default_on, available]
      description: >-
        One input in the Menu's composition tree. `id` is the container path, deliberately: a
        composition saved today has to resolve against a project that has since gained or lost
        files, and the only thing that survives that is what the file is called.
      properties:
        id: { type: string }
        name: { type: string }
        label: { type: string, description: the curated display name, e.g. "GM · TI_max" }
        path: { type: string }
        kind:
          type: string
          enum: [volume, label-volume, surface, mesh, annotation, morph, surface-data]
          description: >-
            What the file is, decided once by `tit/catalog.py::classify_view_file`. A **mesh** is
            SimNIBS's tetrahedral FEM domain (`.msh`, 24-420 MB); a **surface** is a triangulated
            2-D sheet (`.gii`, a FreeSurfer binary, ~8 MB) that carries nothing on its own. They
            were one word until 2026-09-07, which told a reader the two cost and answered the
            same. `annotation`, `morph` and `surface-data` appear only as a surface's
            `attachments`.
        bytes: { type: [integer, "null"] }
        default_on: { type: boolean, description: ticked when the tree is first drawn }
        available: { type: boolean }
        reason: { type: [string, "null"], description: why it is unavailable }
        attachments:
          type: array
          description: >-
            A surface's `.annot` parcellations, morphometry curves and data GIfTIs, matched to it
            by hemisphere. Present only on a `surface` node -- nothing else has anywhere to hang
            one. Drawn as sub-checkboxes under the surface, because a `.annot` on its own is a
            colour table with nowhere to go.
          items: { $ref: "#/components/schemas/ViewerTreeNode" }
    ViewerTreeSimulation:
      type: object
      required: [name, fields, meshes, surfaces, electrodes]
      properties:
        name: { type: string }
        fields:
          type: array
          items: { $ref: "#/components/schemas/ViewerTreeNode" }
        meshes:
          type: array
          description: the tetrahedral `.msh` outputs, which are the ones that cost a minute to open
          items: { $ref: "#/components/schemas/ViewerTreeNode" }
        surfaces:
          type: array
          description: >-
            the GIfTI/fsaverage sheets. Their own bucket rather than a corner of `meshes`: a
            projected sheet is a few MB and a `.msh` is 64, and filing them together said they
            were the same sort of wait.
          items: { $ref: "#/components/schemas/ViewerTreeNode" }
        electrodes:
          type: array
          items: { $ref: "#/components/schemas/ViewerTreeNode" }
    ViewerTreeAnalysis:
      type: object
      required: [name, simulation, space, outputs]
      properties:
        name: { type: string }
        simulation: { type: string }
        space: { type: string, enum: [voxel, mesh] }
        outputs:
          type: array
          items: { $ref: "#/components/schemas/ViewerTreeNode" }
    ViewerTree:
      type: object
      required: [subject, space, anatomy, simulations, analyses, available]
      properties:
        subject: { type: [string, "null"] }
        space: { type: string, enum: [subject, mni] }
        anatomy:
          type: array
          items: { $ref: "#/components/schemas/ViewerTreeNode" }
        simulations:
          type: array
          items: { $ref: "#/components/schemas/ViewerTreeSimulation" }
        analyses:
          type: array
          items: { $ref: "#/components/schemas/ViewerTreeAnalysis" }
        available: { type: boolean }
        reason:
          type: [string, "null"]
          description: >-
            why the tree is empty -- "no subject chosen" and "no head model" are different
            problems and the Menu has to be able to say which
    ViewerComposition:
      type: object
      required: [name]
      description: >-
        What a person chose, by stable id. Unknown keys are kept rather than rejected: the tree's
        vocabulary will grow, and a server that refused new keys would make every Menu change a
        two-repository change.
      additionalProperties: true
      properties:
        name: { type: string }
        version: { type: integer }
        saved_at: { type: string }
        subject: { type: [string, "null"] }
        space: { type: [string, "null"], enum: [subject, mni, null] }
        inputs:
          type: array
          items: { type: string }
          description: chosen input ids (container paths), in layer order
        simulations:
          type: array
          items: { type: string }
    SavedScene:
      type: object
      required: [name, slug, path]
      properties:
        name: { type: string }
        slug: { type: string }
        path: { type: string, description: ends in .tetravox.json }
        host_path: { type: [string, "null"] }
        bytes: { type: [integer, "null"] }
        saved_at: { type: [string, "null"] }
        subject: { type: [string, "null"] }
        simulation: { type: [string, "null"] }
        field: { type: [string, "null"] }
        space: { type: [string, "null"] }
        has_thumbnail: { type: boolean }
    ViewerPreset:
      type: object
      required: [name]
      description: >-
        VM/VM2. One saved Viewer selection -- the source and, when the person edited it, the file
        list, exactly as POST /api/view/open takes them, so restoring a preset is replaying a
        request rather than reconstructing one. `extras`/`overrides` are still accepted for a
        preset saved by the VM panel that briefly exposed them.
      properties:
        name: { type: string }
        selection:
          type: object
          additionalProperties: true
          description: kind, subject, simulation, analysis, field, atlas, roi, path, space
        files:
          type: [array, "null"]
          items: { type: string }
          description: the edited list, or null when the view type's own set was saved
        extras:
          type: array
          items: { type: string }
        overrides:
          type: object
          additionalProperties: true
    ViewerSceneFile:
      type: object
      required: [name, path]
      properties:
        id: { type: [string, "null"] }
        kind: { type: [string, "null"], description: '"volume" or "mesh"' }
        name: { type: string }
        path: { type: string, description: the path written into the scene (host-facing) }
        container_path:
          type: [string, "null"]
          description: >-
            VM2. The same file as the server sees it -- what the client sends back in `files`
            when the row is kept, moved or joined by another. A row that reported only the host
            path could not be handed back to a server that jails container paths.
        bytes:
          type: [integer, "null"]
          description: size on disk, or null when the file could not be stat'ed
    Project:
      type: object
      required: [container_path, name]
      properties:
        container_path: { type: string }
        host_path: { type: [string, "null"], description: from LOCAL_PROJECT_DIR when known }
        name: { type: string }
    Subject:
      type: object
      required: [id, has_raw, has_fastsurfer, has_freesurfer, has_m2m, n_simulations]
      properties:
        id: { type: string, description: without the sub- prefix }
        has_raw: { type: boolean }
        has_fastsurfer: { type: boolean }
        has_freesurfer:
          {
            type: boolean,
            description: legacy derivatives/freesurfer, still detected read-only,
          }
        has_m2m: { type: boolean }
        n_simulations: { type: integer }
        has_sourcedata:
          {
            type: boolean,
            description:
              "sourcedata/sub-<id>/ has a raw T1w or T2w series staged (DICOM
              or equivalent), converted or not -- 'not converted' is this
              True with has_raw False. Optional: added 2026-09-03, lane FX5.",
          }
    SubjectList:
      type: object
      required: [subjects]
      properties:
        subjects:
          type: array
          items: { $ref: "#/components/schemas/Subject" }
    Simulation:
      type: object
      required: [name, path, has_ti, has_mti]
      properties:
        name: { type: string }
        path: { type: string, description: container path }
        has_ti: { type: boolean }
        has_mti: { type: boolean }
    SimulationList:
      type: object
      required: [simulations]
      properties:
        simulations:
          type: array
          items: { $ref: "#/components/schemas/SimulationDetail" }
    # ---- system snapshot (GET /api/system, /ws/system) ----
    #
    # Everything past the six original required fields was added 2026-09-07 for the System page
    # and is OPTIONAL with a default: a client written against the earlier payload parses this
    # one unchanged, and a host that cannot answer a field (no getloadavg, no Docker socket,
    # /var/lib/docker not visible from inside the container) omits it rather than failing the
    # whole snapshot. See contracts/CHANGES.md.
    MemoryInfo:
      type: object
      required: [total, available, used, percent]
      properties:
        total: { type: integer }
        available: { type: integer }
        used: { type: integer }
        percent: { type: number }
        free: { type: integer }
        cached: { type: integer, description: "Linux only; 0 elsewhere" }
        buffers: { type: integer, description: "Linux only; 0 elsewhere" }
    SwapInfo:
      type: object
      required: [total, used, free, percent]
      properties:
        total: { type: integer }
        used: { type: integer }
        free: { type: integer }
        percent: { type: number }
    DiskInfo:
      type: object
      required: [total, free, percent]
      properties:
        total: { type: integer }
        free: { type: integer }
        percent: { type: number }
        path: { type: string, description: the mount point measured (optional, added 2026-09-07) }
    NetIO:
      type: object
      required: [bytes_sent, bytes_recv]
      properties:
        bytes_sent: { type: integer }
        bytes_recv: { type: integer }
    SelfProcessInfo:
      type: object
      required: [pid, cpu_percent, rss]
      properties:
        pid: { type: integer }
        cpu_percent: { type: number }
        rss: { type: integer }
    ProcessInfo:
      type: object
      required: [pid, name, cpu_percent, rss, started]
      properties:
        pid: { type: integer }
        name: { type: string }
        cmdline: { type: string }
        cpu_percent: { type: number }
        rss: { type: integer }
        started: { type: number }
        ppid: { type: integer }
        status: { type: string, description: "psutil status: running, sleeping, zombie, ..." }
        mem_percent: { type: number }
        threads: { type: integer }
        relevant:
          type: boolean
          description: matches the toolbox keyword filter (what the pre-2026-09-07 list held)
        owner_kind:
          type: ["string", "null"]
          description: >-
            "job" | "kernel" | "server", or null for an unowned process. Only an owned process
            gets a stop affordance in the UI.
        owner_id: { type: ["string", "null"] }
        owner_label: { type: string }
    ContainerInfo:
      type: object
      required: [id, name, image, state, status]
      properties:
        id: { type: string }
        name: { type: string }
        image: { type: string }
        state: { type: string }
        status: { type: string }
    DockerDf:
      type: object
      description: "`docker system df` totals, summed from the Engine's rows"
      properties:
        images_size: { type: integer }
        images_count: { type: integer }
        images_reclaimable: { type: integer }
        containers_size: { type: integer }
        containers_count: { type: integer }
        volumes_size: { type: integer }
        volumes_count: { type: integer }
        volumes_reclaimable: { type: integer }
        build_cache_size: { type: integer }
    DockerImage:
      type: object
      required: [repo_tag, size]
      properties:
        repo_tag: { type: string }
        size: { type: integer }
    DockerMount:
      type: object
      required: [source, destination]
      properties:
        source: { type: string }
        destination: { type: string }
        mode: { type: string }
    OwnContainer:
      type: object
      description: this server's own container, as `docker inspect` describes it
      required: [id, name, image]
      properties:
        id: { type: string }
        name: { type: string }
        image: { type: string }
        image_id: { type: string }
        state: { type: string }
        status: { type: string }
        health: { type: string }
        started_at: { type: string }
        restarts: { type: integer }
        cpu_limit: { type: ["number", "null"], description: cores; null means no limit set }
        mem_limit: { type: ["integer", "null"], description: bytes; null means no limit set }
        mounts:
          type: array
          items: { $ref: "#/components/schemas/DockerMount" }
    DockerHealth:
      type: object
      description: >-
        Daemon reachability, disk usage and our own container, read on a 5 s TTL with a 3 s socket
        timeout. `reachable: false` with an `error` is a first-class answer -- the panel says the
        daemon is unreachable rather than showing zeros that look like a healthy, empty daemon.
      properties:
        reachable: { type: boolean }
        latency_ms: { type: ["number", "null"] }
        version: { type: string }
        api_version: { type: string }
        error: { type: string }
        df:
          allOf: [{ $ref: "#/components/schemas/DockerDf" }]
        own:
          allOf: [{ $ref: "#/components/schemas/OwnContainer" }]
        containers:
          type: array
          items: { $ref: "#/components/schemas/ContainerInfo" }
        images:
          type: array
          items: { $ref: "#/components/schemas/DockerImage" }
        warnings:
          type: array
          items: { type: string }
    StorageKind:
      type: object
      required: [kind, label, bytes, files]
      properties:
        kind: { type: string }
        label: { type: string }
        bytes: { type: integer, description: real disk usage (st_blocks * 512), hardlinks counted once }
        files: { type: integer }
    StorageItem:
      type: object
      required: [name, kind, bytes]
      properties:
        name: { type: string }
        kind: { type: string }
        bytes: { type: integer }
    ProjectStorage:
      type: object
      required: [project_dir, total_bytes, total_files, scanned_at, duration_s]
      properties:
        project_dir: { type: string }
        total_bytes: { type: integer }
        total_files: { type: integer }
        scanned_at: { type: number, description: "unix seconds; 0 when never scanned" }
        duration_s: { type: number }
        scanning:
          type: boolean
          description: a background refresh is running; these are the last numbers
        partial: { type: boolean, description: the scan was abandoned before it finished }
        kinds:
          type: array
          items: { $ref: "#/components/schemas/StorageKind" }
        largest:
          type: array
          description: the biggest subject x kind combinations
          items: { $ref: "#/components/schemas/StorageItem" }
    SystemSnapshot:
      type: object
      required: [ts, cpu_percent, cpu_count, mem, disk, processes]
      properties:
        ts: { type: number, description: unix seconds }
        cpu_percent: { type: number }
        cpu_count: { type: integer }
        mem: { $ref: "#/components/schemas/MemoryInfo" }
        disk: { $ref: "#/components/schemas/DiskInfo" }
        processes:
          type: array
          description: >-
            The busiest processes, capped server-side; `relevant` flags the ones matching the
            toolbox keyword filter that used to be the whole list.
          items: { $ref: "#/components/schemas/ProcessInfo" }
        process_total:
          type: integer
          description: how many processes exist; `processes` is the top N by CPU
        cpu_per_core:
          type: array
          description: per-core utilisation, same order as psutil
          items: { type: number }
        load_avg:
          type: array
          description: 1/5/15-minute load average; empty where unsupported
          items: { type: number }
        uptime_s: { type: number, description: seconds since boot of the machine we see }
        swap:
          allOf: [{ $ref: "#/components/schemas/SwapInfo" }]
        disk_docker:
          allOf: [{ $ref: "#/components/schemas/DiskInfo" }]
          description: the Docker root filesystem, when it is visible from here
        own:
          allOf: [{ $ref: "#/components/schemas/SelfProcessInfo" }]
          description: the server process itself (never listed in `processes`)
        kernels: { type: integer, description: notebook kernels this server currently owns }
        containers:
          type: array
          description: Docker sibling containers (QSIPrep/QSIRecon), if any
          items: { $ref: "#/components/schemas/ContainerInfo" }
        net:
          allOf: [{ $ref: "#/components/schemas/NetIO" }]
        docker:
          allOf: [{ $ref: "#/components/schemas/DockerHealth" }]

    # -------------------------------------------------------------------------------- catalog (v1)
    SubjectDetail:
      description: v0 Subject plus m2m path, eeg nets, leadfield presence, dwi/ct presence
      allOf:
        - $ref: "#/components/schemas/Subject"
        - type: object
          required: [m2m_path, eeg_nets, has_leadfields, has_dwi, has_ct]
          properties:
            m2m_path: { type: [string, "null"] }
            eeg_nets:
              type: array
              items: { type: string }
            has_leadfields:
              type: array
              items: { type: string }
              description: EEG net names with a precomputed leadfield
            has_dwi: { type: boolean }
            has_ct: { type: boolean }
    NiftiRef:
      type: object
      required: [path, field, space]
      properties:
        path: { type: string }
        field: { type: string }
        space: { type: string, enum: [subject, mni] }
        tissue: { type: [string, "null"] }
    MeshRef:
      type: object
      required: [path, kind]
      properties:
        path: { type: string }
        kind: { type: string }
    SimulationDetail:
      description: v0 Simulation plus montages, fields, spaces, reports, niftis, meshes
      allOf:
        - $ref: "#/components/schemas/Simulation"
        - type: object
          required: [montages, fields, space, report_ids, niftis, meshes]
          properties:
            montages:
              type: array
              items: { type: string }
            fields:
              type: array
              items: { type: string }
            space:
              type: array
              items: { type: string, enum: [subject, mni] }
            report_ids:
              type: array
              items: { type: string }
            niftis:
              type: array
              items: { $ref: "#/components/schemas/NiftiRef" }
            meshes:
              type: array
              items: { $ref: "#/components/schemas/MeshRef" }
    MontagePairs:
      type: array
      description: pairs of electrode labels, e.g. [["E1","E2"],["E3","E4"]]
      items:
        type: array
        items: { type: string }
        minItems: 2
        maxItems: 2
    MontageNet:
      type: object
      properties:
        uni_polar:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/MontagePairs"
        multi_polar:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/MontagePairs"
    Montages:
      type: object
      required: [nets]
      properties:
        nets:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/MontageNet"
    EegNet:
      type: object
      required: [name, electrodes, n]
      properties:
        name: { type: string }
        electrodes:
          type: array
          items: { type: string }
        n: { type: integer }
    Atlas:
      type: object
      required: [id, name, path]
      properties:
        id: { type: string }
        name: { type: string }
        path: { type: string }
        hemispheres:
          type: array
          items: { type: string, enum: [lh, rh] }
    Region:
      type: object
      required: [id, name, hemi]
      description: >-
        For a cortical (surface/annotation) atlas, `id` is the FreeSurfer `.annot` label index --
        exactly the integer `FlexConfig.AtlasROI.label` / `ExConfig`'s equivalent needs, not a
        display string -- and `hemi` is that region's own hemisphere ("lh"/"rh"), since one
        `.annot` file is per-hemisphere and a cortical ROI can union regions across both. For a
        subcortical (volumetric) atlas, `id` is the voxel label value in that atlas's NIfTI and
        `hemi` is `null` (volumetric atlases are not inherently split by hemisphere).
      properties:
        id: { type: integer }
        name: { type: string }
        hemi:
          type: [string, "null"]
          enum: [lh, rh, null]
    NiftiLabel:
      type: object
      required: [id, name, n_voxels]
      description: >-
        One integer label present in a segmentation volume. `id` is the voxel value (what
        `SubcorticalConfig.labels` carries), `name` comes from a sidecar colour table or the
        bundled FreeSurfer LUT and falls back to `Label {id}`, and `n_voxels` is how many voxels
        carry it — the size cue that tells a stray label from a real structure.
      properties:
        id: { type: integer }
        name: { type: string }
        n_voxels: { type: integer }
    Roi:
      type: object
      required: [name, x, y, z, space]
      properties:
        name: { type: string }
        x: { type: number }
        y: { type: number }
        z: { type: number }
        radius: { type: number }
        space: { type: string, enum: [subject, mni] }
    Leadfield:
      type: object
      required: [net, path, exists, size_bytes]
      properties:
        net: { type: string }
        path: { type: string }
        exists: { type: boolean }
        size_bytes: { type: integer }
    FlexRun:
      type: object
      required: [name, path, goal, roi, created, manifest, artifacts]
      properties:
        name: { type: string }
        path: { type: string }
        goal: { type: string }
        roi:
          type: object
          additionalProperties: true
        created: { type: string, format: date-time }
        manifest:
          type: object
          additionalProperties: true
        mappings:
          type: array
          description: >-
            EEG-label electrode pairs already mapped for this run, one entry per net
            (from its electrode_mapping_<net>.json files). Empty when the run has never
            been mapped onto a net; `optimized` is then the only way to simulate it.
          items: { $ref: "#/components/schemas/FlexMapping" }
        optimized:
          type: array
          nullable: true
          description: >-
            The run's free XYZ electrode pairs (Montage mode flex_free), from
            electrode_positions.json; null when the run wrote no usable positions.
          items:
            type: array
            items:
              type: array
              items: { type: number }
        artifacts:
          type: array
          items: { $ref: "#/components/schemas/Artifact" }
          description: run outputs (Pareto-front/convergence PNGs, CSVs, manifests) to list, not just reveal-in-folder
    FlexMapping:
      type: object
      required: [eeg_net, pairs]
      properties:
        eeg_net: { type: string }
        pairs:
          type: array
          description: one [anode, cathode] EEG-label pair per stimulation channel
          items:
            type: array
            items: { type: string }
    ExBest:
      type: object
      required: [montage, score]
      properties:
        montage: { type: string }
        score: { type: number }
    ExRun:
      type: object
      required: [run_name, path, eeg_net, created, artifacts]
      properties:
        run_name: { type: string }
        path: { type: string }
        eeg_net: { type: string }
        created: { type: string, format: date-time }
        best:
          oneOf:
            - $ref: "#/components/schemas/ExBest"
            - type: "null"
        artifacts:
          type: array
          items: { $ref: "#/components/schemas/Artifact" }
          description: run outputs (PNG plots, results CSV, config JSON) to list on the Results/Optimizer pages
    Analysis:
      type: object
      required: [name, space, field, roi, csv, json]
      properties:
        name: { type: string }
        space: { type: string, enum: [subject, mni] }
        field: { type: string }
        roi: { type: string }
        csv: { type: string }
        json: { type: string }
        msh: { type: [string, "null"] }
        nifti: { type: [string, "null"] }
        pdf: { type: [string, "null"] }
    Report:
      type: object
      required: [id, kind, title, path, created]
      properties:
        id: { type: string }
        kind: { type: string }
        title: { type: string }
        path: { type: string }
        created: { type: string, format: date-time }
    ElectrodeOverlay:
      type: object
      required: [mode, path, exists]
      properties:
        mode: { type: string, enum: [TI, mTI] }
        path: { type: string, description: container path (may not exist yet -- see `exists`) }
        exists: { type: boolean }
    ElectrodePosition:
      type: object
      required: [x, y, z]
      properties:
        label: { type: string }
        x: { type: number }
        y: { type: number }
        z: { type: number }
    FreehandConfig:
      type: object
      required: [name, type, electrode_positions]
      properties:
        name: { type: string }
        type:
          type: string
          enum: [U, M]
          description: >-
            On-disk stim_configs semantics (unipolar/multipolar), not xyz/label -- see
            `tit/catalog.py::_read_freehand_file`, the source of truth for
            `m2m_<id>/stim_configs/*.json` written by
            `tit/gui/extensions/electrode_placement.py`.
        electrode_positions:
          type: array
          items: { $ref: "#/components/schemas/ElectrodePosition" }
    GroupCatalog:
      type: object
      required: [stats, nilearn, group_analyses]
      properties:
        stats:
          type: array
          items: { type: object, additionalProperties: true }
        nilearn:
          type: array
          items: { type: object, additionalProperties: true }
        group_analyses:
          type: array
          items: { type: object, additionalProperties: true }
    Notes:
      type: object
      required: [text]
      properties:
        text: { type: string }
        updated_at: { type: [string, "null"], format: date-time }
    TableData:
      type: object
      required: [columns, rows]
      properties:
        columns:
          type: array
          items: { type: string }
        rows:
          type: array
          items:
            type: array
            items: {}

    # ------------------------------------------------------------------------------- overview (v1)
    PresenceState:
      type: string
      description: >
        Presence of one artefact for one subject. `partial` is a distinguishable state
        (raw staged under sourcedata/ but never converted; some but not all EEG nets have a
        leadfield); `pending` means a job that would produce it is queued or running now;
        `failed` means the newest such job failed and the artefact is still absent.
      enum: [present, absent, partial, pending, failed]
    OverviewCounts:
      type: object
      required: [simulations, optimizations, analyses]
      properties:
        simulations: { type: integer }
        optimizations: { type: integer, description: flex + ex + mEx search runs }
        analyses: { type: integer }
    OverviewReadiness:
      type: object
      required: [stage, ready]
      properties:
        stage:
          type: string
          enum: [preprocess, simulator, optimizer, analyzer]
        ready: { type: boolean }
        reason:
          type: [string, "null"]
          description: the missing requirement, never a sentence
    OverviewSubject:
      type: object
      required: [id, raw, fastsurfer, freesurfer, m2m, dwi, ct, leadfield, eeg_net, leadfields, eeg_nets, counts, readiness]
      properties:
        id: { type: string, description: without the sub- prefix }
        raw: { $ref: "#/components/schemas/PresenceState" }
        fastsurfer: { $ref: "#/components/schemas/PresenceState" }
        freesurfer: { $ref: "#/components/schemas/PresenceState" }
        m2m: { $ref: "#/components/schemas/PresenceState" }
        dwi: { $ref: "#/components/schemas/PresenceState" }
        ct: { $ref: "#/components/schemas/PresenceState" }
        leadfield: { $ref: "#/components/schemas/PresenceState" }
        eeg_net: { $ref: "#/components/schemas/PresenceState" }
        leadfields:
          type: array
          items: { type: string }
          description: EEG nets with a precomputed leadfield
        eeg_nets:
          type: array
          items: { type: string }
        counts: { $ref: "#/components/schemas/OverviewCounts" }
        readiness:
          type: array
          items: { $ref: "#/components/schemas/OverviewReadiness" }
    OverviewCoverage:
      type: object
      required: [id, have, total]
      properties:
        id: { type: string }
        have: { type: integer }
        total: { type: integer }
    OverviewTotals:
      type: object
      required: [subjects, simulations, optimizations, analyses, coverage]
      properties:
        subjects: { type: integer }
        simulations: { type: integer }
        optimizations: { type: integer }
        analyses: { type: integer }
        coverage:
          type: array
          items: { $ref: "#/components/schemas/OverviewCoverage" }
    Overview:
      type: object
      required: [subjects, totals]
      properties:
        subjects:
          type: array
          items: { $ref: "#/components/schemas/OverviewSubject" }
        totals: { $ref: "#/components/schemas/OverviewTotals" }

    # --------------------------------------------------------------------------------- schema (v1)
    # (no dedicated component; /api/schema[/…] responses are typed as a generic object above)

    # ---------------------------------------------------------------------- validate / plan (v1)
    PipelineKind:
      type: string
      enum:
        [
          pre,
          sim,
          flex,
          flex_adaptive,
          flex_pareto,
          ex,
          mex,
          leadfield,
          analyzer,
          stats,
          source,
          blender,
          nifti_average,
          nilearn,
        ]
    ValidateError:
      type: object
      required: [path, message]
      properties:
        path: { type: string }
        message: { type: string }
    ValidateResult:
      type: object
      required: [ok, errors]
      properties:
        ok: { type: boolean }
        errors:
          type: array
          items: { $ref: "#/components/schemas/ValidateError" }
    LockConflict:
      type: object
      required: [key, held_by, kind, subject, started_at]
      properties:
        key: { type: string }
        held_by: { type: string, description: job id holding the lock }
        kind: { $ref: "#/components/schemas/JobKind" }
        subject: { type: string }
        started_at: { type: string, format: date-time }
    PlanJob:
      type: object
      required: [kind, subject, output_dir, exists, will_overwrite]
      properties:
        kind: { $ref: "#/components/schemas/JobKind" }
        subject: { type: string }
        output_dir: { type: string }
        exists: { type: boolean }
        will_overwrite: { type: boolean }
    PlanSystem:
      type: object
      description: >-
        The machine PlanCost.eta_minutes was computed for (tit.jobs.eta.detect_system): the
        container's core count, whether the image is running under CPU emulation (an amd64 image
        under Rosetta/QEMU, ~3x slower), and the resulting multiplier applied to every calibrated
        constant. Lets the UI say "on this machine" rather than quoting a universal duration.
      required: [cpus, emulated, factor]
      properties:
        cpus: { type: integer }
        emulated: { type: boolean }
        factor: { type: number }
    PlanCost:
      type: object
      required: [cpus, mem_gb]
      properties:
        cpus: { type: number }
        mem_gb: { type: number }
        eta_minutes:
          description: >-
            Estimated wall-clock minutes for the WHOLE plan on this machine (unlike cpus/mem_gb,
            which are one representative job's). Modelled in tit.jobs.eta from what actually
            drives the run -- electrodes in the EEG cap for a leadfield, electrode pairs for a
            simulation, evaluated combinations for ex/mEx, the DE budget for flex, the stage list
            for pre-processing -- scaled by the subject's head-mesh size and by PlanSystem.factor,
            and divided by the concurrency. null when the kind has no model, or when the inputs it
            needs cannot be read (a leadfield whose cap CSV is missing). Always an estimate: the
            UI must label it as one.
          oneOf:
            - type: number
            - type: "null"
        system:
          oneOf:
            - $ref: "#/components/schemas/PlanSystem"
            - type: "null"
    MontageSources:
      type: object
      description: >-
        Subject-scoped montage sources (flex-search run picks, saved freehand stim-configs) to
        merge into config.montages -- kind=sim only. tit.server.routes.plan resolves these via
        tit.sim.montage_sources and returns the merged set as PlanResolved.montages, one entry per
        (subject, source) pair. Kept out of the SimulationConfig dataclass itself: unlike a plain
        montage_list.json entry these two sources are inherently per-subject (a flex-search run
        directory or a stim_configs/*.json file only exists under one subject's m2m), so they
        cannot be part of the montage list every subject in a batch shares.
      properties:
        flex:
          type: array
          items:
            type: object
            required: [run]
            properties:
              subject: { type: string, description: "defaults to the job's own subject when omitted" }
              run: { type: string, description: "flex-search run directory name (FlexRun.name)" }
              electrode_type: { type: string }
              eeg_net: { type: string }
        freehand:
          type: array
          items:
            type: object
            required: [name]
            properties:
              subject: { type: string, description: "defaults to the job's own subject when omitted" }
              name: { type: string, description: "FreehandConfig.name" }
    PlanResolved:
      type: object
      properties:
        montages:
          type: array
          items: { type: object, additionalProperties: true }
        search_space:
          type: object
          additionalProperties: true
    PlanResult:
      type: object
      required: [jobs, lock_conflicts, cost, warnings]
      properties:
        jobs:
          type: array
          items: { $ref: "#/components/schemas/PlanJob" }
        lock_conflicts:
          type: array
          items: { $ref: "#/components/schemas/LockConflict" }
        cost: { $ref: "#/components/schemas/PlanCost" }
        warnings:
          type: array
          items: { type: string }
        resolved:
          oneOf:
            - $ref: "#/components/schemas/PlanResolved"
            - type: "null"

    # ------------------------------------------------------------------------------------- jobs (v1)
    JobKind:
      type: string
      enum:
        [
          pre,
          sim,
          flex,
          flex_adaptive,
          flex_pareto,
          ex,
          mex,
          leadfield,
          analyzer,
          stats,
          source,
          blender,
          nifti_average,
          nilearn,
          project_init,
          tools,
          report,
        ]
    JobState:
      type: string
      enum: [queued, running, succeeded, failed, cancelled, skipped, lost]
    JobProgress:
      type: object
      required: [stage, i, n, pct]
      properties:
        stage: { type: string }
        i: { type: integer }
        n: { type: integer }
        pct: { type: number }
    WaitingOn:
      type: object
      required: [key, job_id]
      properties:
        key: { type: string }
        job_id: { type: string }
    JobError:
      type: object
      required: [type, message, last_lines]
      properties:
        type:
          type: string
          enum:
            [
              preflight,
              lock_wait,
              budget_wait,
              runner_failed,
              oom_suspected,
              cancelled,
              skipped,
              lost,
              docker_unavailable,
              kind_error,
            ]
          description: >-
            The nine-value taxonomy `pages/jobs/format.ts::ERROR_LABEL` labels, plus `kind_error`
            (`tit/jobs/manager.py:628`, an unknown/disallowed job kind rejected before a runner ever
            starts). `pages/jobs/format.ts::errorLabel` title-cases any other value it does not
            recognise, so a not-yet-enumerated runner-emitted type degrades gracefully rather than
            crashing the Jobs page.
        message: { type: string }
        last_lines:
          type: array
          items: { type: string }
    Artifact:
      type: object
      required: [path, kind]
      properties:
        path: { type: string }
        kind: { type: string }
        label: { type: string }
    JobStatus:
      type: object
      required: [id, kind, state, subject_ids, created_at, artifacts]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/JobKind" }
        state: { $ref: "#/components/schemas/JobState" }
        subject_ids:
          type: array
          items: { type: string }
        group_id: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        progress:
          oneOf:
            - $ref: "#/components/schemas/JobProgress"
            - type: "null"
        liveness:
          type: [string, "null"]
          enum: [active, stalled, null]
        waiting_on:
          type: array
          items: { $ref: "#/components/schemas/WaitingOn" }
        exit_code: { type: [integer, "null"] }
        error:
          oneOf:
            - $ref: "#/components/schemas/JobError"
            - type: "null"
        artifacts:
          type: array
          items: { $ref: "#/components/schemas/Artifact" }
        cpu_percent: { type: [number, "null"] }
        rss: { type: [integer, "null"] }
        log_path:
          type: [string, "null"]
          description: >-
            Container path to this job's raw stdout/stderr log (`code/ti-toolbox/jobs/<id>/stdout.log`),
            the same file `GET /api/jobs/{id}/log` serves. Present so `pages/jobs/JobDetailDrawer.tsx`
            can show/copy it without reconstructing the path convention client-side (ra_13 finding 6).
    JobSpec:
      type: object
      required: [kind, config, subject_ids]
      properties:
        kind: { $ref: "#/components/schemas/JobKind" }
        config: { $ref: "#/components/schemas/PipelineConfig" }
        subject_ids:
          type: array
          items: { type: string }
        after:
          type: array
          items: { type: string }
          description: job ids this job must run after (DAG edges)
        tags:
          type: array
          items: { type: string }
        overwrite: { type: boolean }
    JobDetail:
      type: object
      required: [spec, status, artifacts]
      properties:
        spec: { $ref: "#/components/schemas/JobSpec" }
        status: { $ref: "#/components/schemas/JobStatus" }
        artifacts:
          type: array
          items: { $ref: "#/components/schemas/Artifact" }
    # -------------------------------------------------------------------------------- pipelines
    PipelineNode:
      type: object
      description: >-
        One node. `subjects` names the cohort and runs nothing; every other kind is exactly one
        existing job kind carrying exactly the config that page builds — **its own**, never
        inherited from the node upstream of it.
      required: [id, kind]
      properties:
        id: { type: string, description: canvas-scoped node id, unique within the document }
        kind:
          type: string
          enum: [subjects, pre, leadfield, flex, ex, mex, sim, analyzer, source, stats]
        label: { type: string, description: user-visible name; defaults to the kind }
        config:
          $ref: "#/components/schemas/PipelineConfig"
        position:
          type: object
          description: canvas coordinates; carried through untouched by the server
          properties:
            x: { type: number }
            y: { type: number }
    PipelineEdge:
      type: object
      description: >-
        A typed wire. `port` is one named output of `from` bound into the same-named input of `to`
        -- which is what makes "Optimizer -> Simulator" mean "the simulator's montage list is the
        optimizer's result" rather than a drawn line with no semantics.
      required: [from, to, port]
      properties:
        from: { type: string }
        to: { type: string }
        port:
          type: string
          enum: [subjects, montages, simulation, roi, leadfield]
    Pipeline:
      type: object
      description: The canvas document; mirrors contracts/pipeline.schema.json exactly.
      required: [version, nodes]
      properties:
        version: { type: integer, enum: [1] }
        name: { type: string }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/PipelineNode" }
        edges:
          type: array
          items: { $ref: "#/components/schemas/PipelineEdge" }
    PipelineRequest:
      type: object
      description: >-
        A pipeline document, either sent bare or wrapped as `{pipeline: <document>}` (the wrapped
        form is what `run` uses, since it carries submission options alongside).
      properties:
        pipeline: { $ref: "#/components/schemas/Pipeline" }
        version: { type: integer, enum: [1] }
        name: { type: string }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/PipelineNode" }
        edges:
          type: array
          items: { $ref: "#/components/schemas/PipelineEdge" }
    PipelineRunRequest:
      type: object
      required: [pipeline]
      properties:
        pipeline: { $ref: "#/components/schemas/Pipeline" }
        parallel_subjects:
          type: integer
          minimum: 1
          default: 1
          description: >-
            The same per-group concurrency cap JobGroupRequest carries; enforced by the scheduler.
        tags:
          type: array
          items: { type: string }
        overwrite:
          type: boolean
          description: Replace existing output instead of skipping it, for every job in the pipeline.
    PipelineIssue:
      type: object
      description: >-
        One validation finding. `message` is for a human; `code` is what a client keys on, so the
        canvas can tell an "it runs on its own" note (stated once for the whole graph) from a real
        blocker, and can render a `missing_input` as a chip on the node's own card that opens its
        editor at `port`.
      required: [level, message]
      properties:
        level: { type: string, enum: [error, warning] }
        message: { type: string, description: one sentence the UI shows verbatim }
        code:
          type: string
          description: stable machine-readable name of the finding (`tit.pipeline.validate.ISSUE_CODES`)
          enum:
            [
              empty,
              duplicate_id,
              edge_unknown_node,
              self_edge,
              bad_output,
              bad_input,
              double_bound,
              cycle,
              missing_input,
              unconfigured,
              unconnected,
              not_ready,
            ]
        port:
          type: string
          enum: [subjects, montages, simulation, roi, leadfield]
          description: the port a `missing_input`/`bad_input`/`bad_output`/`double_bound` is about
        node_id: { type: string }
        edge: { $ref: "#/components/schemas/PipelineEdge" }
    PipelineJobPreview:
      type: object
      description: >-
        One job `run` would submit -- the receipt, computed without submitting anything. `label`
        and `after` are the plan-scoped labels the server resolves to real job ids at submission.
      required: [label, kind, subject_ids, after]
      properties:
        label: { type: string }
        kind: { type: string }
        subject_ids:
          type: array
          items: { type: string }
        after:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
    PipelineValidation:
      type: object
      required: [ok, issues, order]
      properties:
        ok: { type: boolean, description: false iff any issue has level "error" }
        issues:
          type: array
          items: { $ref: "#/components/schemas/PipelineIssue" }
        order:
          type: array
          description: node ids in dependency-first order; empty when the graph has a cycle
          items: { type: string }
        jobs:
          type: array
          description: what Run would submit; empty when the pipeline does not validate
          items: { $ref: "#/components/schemas/PipelineJobPreview" }
    PipelineRunResult:
      type: object
      description: The one group the whole pipeline became.
      required: [group_id, jobs]
      properties:
        group_id: { type: string }
        pipeline: { type: string }
        jobs:
          type: array
          items: { $ref: "#/components/schemas/JobStatus" }
    PipelineListEntry:
      type: object
      required: [name, modified_at, size]
      properties:
        name: { type: string }
        modified_at: { type: number, description: unix seconds }
        size: { type: integer }
        nodes:
          type: integer
          description: >-
            How many steps the saved document has, so the Saved list can state a pipeline's size
            without loading it. Absent when the file could not be parsed as a document.
        edges:
          type: integer
          description: How many wires the saved document has. Absent when it could not be parsed.
    PipelineKinds:
      type: object
      description: >-
        The palette, and both tables that decide whether a wire may be drawn: the typed ports, and
        what each kind needs of a subject before it can run on it. The canvas gates a *drag* with
        these (there is no graph to ask the server about yet) and
        `POST /api/pipelines/validate` gates the graph with the same ones, so the refusal a user
        sees while dragging and the one in the receipt are the same sentence.
      required: [port_types, kinds]
      properties:
        port_types:
          type: array
          items: { type: string }
        capabilities:
          type: array
          description: >-
            What a subject can already have, in the order a reason lists them. Each is a fact
            `GET /api/catalog/overview` reports for every subject.
          items:
            type: object
            required: [capability, label]
            properties:
              capability:
                type: string
                enum: [raw, m2m, leadfield, simulation]
              label:
                type: string
                description: the wording a refusal uses, e.g. "head model"
        kinds:
          type: array
          items:
            type: object
            required: [kind, inputs, outputs, required]
            properties:
              kind: { type: string }
              inputs:
                type: array
                items: { type: string }
              outputs:
                type: array
                items: { type: string }
              required:
                type: array
                description: inputs that must be wired or satisfied by the node's own config
                items: { type: string }
              requires:
                type: array
                description: >-
                  Capabilities **every** subject reaching this node must already have. A cohort
                  whose subjects only have raw data may be wired to `pre` and to nothing else.
                items:
                  type: string
                  enum: [raw, m2m, leadfield, simulation]
              produces:
                type: array
                description: >-
                  What running this node leaves its subjects with, for the nodes downstream of it
                  — which is why `Subjects(raw) -> Pre -> Simulator` is legal and
                  `Subjects(raw) -> Simulator` is not.
                items:
                  type: string
                  enum: [raw, m2m, leadfield, simulation]
    JobGroupRequest:
      type: object
      required: [kind, config, subject_ids, parallel_subjects]
      properties:
        kind:
          type: string
          enum: [pre, sim, flex, flex_adaptive, flex_pareto, ex, mex]
          description: >-
            Every kind that runs one independent job per subject. `pre` expands into the
            per-subject G1-G6 stage DAG (tit.jobs.plans.plan_preprocessing) -- the subject
            report is an attachment of the last stage job, never a job of its own; the others expand
            into one job per (subject, config) entry (tit.jobs.plans.plan_per_subject). Cohort
            kinds (a grouped `analyzer` run, `stats`) are one job over the whole selection and
            are submitted through POST /api/jobs instead.
        config: { $ref: "#/components/schemas/PipelineConfig" }
        subject_ids:
          type: array
          items: { type: string }
        subject_configs:
          type: array
          description: >-
            Optional per-subject configs, for a workflow whose config depends on the subject (an
            ROI resolved against that subject's own atlas, a subject-specific leadfield path) or
            that runs several jobs for one subject (the Simulator's one job per (subject,
            montage)). Entries are matched to subject_ids by subject_id; a subject with no entry
            uses `config`. Whatever is sent, the server forces each generated config's subject_id
            to its own subject, so a config can never carry another subject's id.
          items:
            type: object
            required: [subject_id, config]
            properties:
              subject_id: { type: string }
              config: { $ref: "#/components/schemas/PipelineConfig" }
        tags:
          type: array
          description: Tags copied onto every job in the group.
          items: { type: string }
        overwrite:
          type: boolean
          description: >-
            Replace existing output instead of skipping it, for every job in the group (the same
            flag POST /api/jobs takes per job). Ignored for kind=pre, which carries that policy in
            its own config's skip_existing_outputs / replace_existing_outputs flags.
        parallel_subjects:
          type: integer
          minimum: 1
          description: >-
            Per-group concurrency cap: at most this many of the group's per-subject jobs run at
            once. Enforced by the scheduler (tit.jobs), not by the number of jobs submitted --
            every subject's job is created immediately with state "queued" and the scheduler
            releases them onto runners this-many-at-a-time as earlier ones finish.
    JobGroupResult:
      type: object
      required: [group_id, jobs]
      properties:
        group_id: { type: string }
        jobs:
          type: array
          items: { $ref: "#/components/schemas/JobStatus" }
    Event:
      type: object
      description: >-
        Mirrors contracts/events.schema.json exactly. code is required for exit; outputs is the
        arbitrary result payload (required for result); artifacts is the accumulated {path, kind,
        label} list carried alongside it (result only); path/kind/label are an artifact event's
        own flat fields (both required for artifact), not nested under outputs/artifacts.
      required: [seq, ts, type]
      properties:
        seq: { type: integer, minimum: 0 }
        ts: { type: number, description: unix seconds }
        type: { type: string, enum: [log, stage, progress, marker, artifact, result, exit] }
        level: { type: string, enum: [debug, info, warning, error, critical] }
        logger: { type: string }
        msg: { type: string }
        stage: { type: string }
        i: { type: integer }
        n: { type: integer }
        pct: { type: number }
        path: { type: string, description: "artifact events; the produced file's path" }
        kind: { type: string, description: "artifact events; the produced file's kind" }
        label: { type: string, description: "artifact events; optional human-readable label" }
        outputs:
          type: object
          additionalProperties: true
          description: "result events; the runner's arbitrary structured result payload"
        artifacts:
          type: array
          items: { $ref: "#/components/schemas/Artifact" }
          description: "result events; the job's accumulated artifact list"
        code: { type: integer, description: "exit events; the runner's process exit code" }
    JobsWsClientMessage:
      description: sent by the client to (un)subscribe to a job's events over the shared socket
      oneOf:
        - type: object
          required: [subscribe]
          properties:
            subscribe:
              type: object
              description: map of job id -> last seq already seen (0 for from the start)
              additionalProperties: { type: integer, minimum: 0 }
        - type: object
          required: [unsubscribe]
          properties:
            unsubscribe:
              type: array
              items: { type: string }
    JobsWsServerMessage:
      description: pushed by the server; "job" for every job's transitions, "event" only for subscribed jobs
      oneOf:
        - type: object
          required: [type, job]
          properties:
            type: { type: string, enum: [job] }
            job: { $ref: "#/components/schemas/JobStatus" }
        - type: object
          required: [type, job_id, event]
          properties:
            type: { type: string, enum: [event] }
            job_id: { type: string }
            event: { $ref: "#/components/schemas/Event" }

    # ---------------------------------------------------------------------------------- viewers (v1)
    ViewLayer:
      type: object
      required: [path, kind, colormap, opacity, visible]
      properties:
        path: { type: string }
        kind: { type: string, enum: [volume, label] }
        colormap: { type: string }
        opacity: { type: number, minimum: 0, maximum: 1 }
        visible: { type: boolean }
        cal_min: { type: [number, "null"] }
        cal_max: { type: [number, "null"] }
        lut: { type: [string, "null"] }
        percentile:
          oneOf:
            - type: object
              required: [lo, hi]
              properties:
                lo: { type: number, minimum: 0, maximum: 100 }
                hi: { type: number, minimum: 0, maximum: 100 }
            - type: "null"
          description: >-
            Requested percentile window (e.g. {lo: 95, hi: 99.9}), alternative to explicit
            cal_min/cal_max. The server resolves this against the volume's actual voxel-intensity
            distribution at launch time (GET /api/view/{kind} or POST /api/viewers/freeview),
            filling cal_min/cal_max with the resolved absolute values before responding -- a
            layer's cal_min/cal_max are always the final absolute thresholds a viewer applies,
            whether the caller supplied them directly or via percentile.
    ViewSpec:
      type: object
      required: [space, layers, freeview_args]
      properties:
        space: { type: string, enum: [subject, mni] }
        layers:
          type: array
          items: { $ref: "#/components/schemas/ViewLayer" }
          description: >-
            resolved_layers: by the time a ViewSpec leaves the server (from GET /api/view/{kind}
            or is accepted by POST /api/view/args), every layer's cal_min/cal_max is already
            resolved to concrete numbers -- percentile is carried for the client's display
            only (e.g. to preselect a threshold-mode control), never something the client must
            resolve itself.
        freeview_args:
          type: array
          items: { type: string }
          description: >-
            DEPRECATED (D3, docs/dev/HISTORY.md § 2026-09-03 (Docker streamline)): the exact argv tail an
            external Freeview process would need (to_freeview_args). Kept for one release; no
            route launches Freeview any more (there is no X11 in this runtime).
        scene:
          type: [object, "null"]
          description: >-
            The real Tetravox ViewSpec v2 document (tit.viewspec.to_tetravox_viewspec) the
            embedded viewer's Engine.load() accepts directly -- datasets addressed by
            origin-relative /api/files/raw/... URLs (both DatasetRef.path and .absPath), layers
            in the engine's own vocabulary (VolumeLayer/MeshLayer). Derived from `layers` by a
            pure function, so the two always describe the same files. Untyped here (a generic
            object) because the full engine scene model is Tetravox-owned; the subset this
            server emits is hand-schema'd in contracts/tetravox-viewspec-v2.schema.json
            (host-facing). Optional, so an older server still satisfies this contract.

    # ------------------------------------------------------------------------------------ files (v1)
    # (no dedicated components; responses are raw bytes / text / TableData, typed inline above)

    # -------------------------------------------------------------------------------- settings (v1)
    Telemetry:
      type: object
      required: [consented, enabled]
      properties:
        consented: { type: boolean }
        enabled: { type: boolean }
    Settings:
      type: object
      required: [telemetry, panels, allow_unsafe_overrides, theme]
      properties:
        telemetry: { $ref: "#/components/schemas/Telemetry" }
        panels:
          type: array
          items: { type: string }
          description: enabled optional panels (Source, Cluster Permutation, NIfTI Group Average, Nilearn Visuals, Quick Notes)
        image_tag: { type: [string, "null"] }
        allow_unsafe_overrides: { type: boolean }
        theme: { type: string, enum: [system, light, dark] }

    # --------------------------------------------------------------- config placeholders (F1b fills)
    SimulationConfig:
      type: object
      additionalProperties: true
      x-tit-config: SimulationConfig
      description: "injected from contracts/generated/config.schema.json by dev/build_contract.py"
    Montage:
      type: object
      additionalProperties: true
      x-tit-config: Montage
      description: "injected from contracts/generated/config.schema.json by dev/build_contract.py"
    FlexConfig:
      type: object
      additionalProperties: true
      x-tit-config: FlexConfig
      description: "injected from contracts/generated/config.schema.json by dev/build_contract.py"
    ExConfig:
      type: object
      additionalProperties: true
      x-tit-config: ExConfig
      description: "injected from contracts/generated/config.schema.json by dev/build_contract.py"
    MExConfig:
      type: object
      additionalProperties: true
      x-tit-config: MExConfig
      description: "injected from contracts/generated/config.schema.json by dev/build_contract.py"
    AnalyzerConfig:
      type: object
      additionalProperties: true
      x-tit-config: AnalyzerConfig
      description: "injected from contracts/generated/config.schema.json by dev/build_contract.py"
    PreprocessConfig:
      type: object
      additionalProperties: true
      x-tit-config: PreprocessConfig
      description: "injected from contracts/generated/config.schema.json by dev/build_contract.py"
    QSIPrepConfig:
      type: object
      additionalProperties: true
      x-tit-config: QSIPrepConfig
      description: "injected from contracts/generated/config.schema.json by dev/build_contract.py"
    QSIReconConfig:
      type: object
      additionalProperties: true
      x-tit-config: QSIReconConfig
      description: "injected from contracts/generated/config.schema.json by dev/build_contract.py"
    GroupComparisonConfig:
