version: 2.1

executors:
  vm-docker:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: false

commands:
  common-setup:
    steps:
      - checkout

  prepare-test-image:
    steps:
      - run:
          name: Pull TI-Toolbox test image
          command: |
            set -eo pipefail
            TEST_IMAGE="idossha/ti-toolbox-test:latest"
            echo "Pulling TI-Toolbox test image: ${TEST_IMAGE}"
            docker pull ${TEST_IMAGE}
            docker tag ${TEST_IMAGE} ti-test:latest

jobs:

  # v3 image build + smoke (docs/dev/ARCHITECTURE.md; docs/dev/HISTORY.md 2026-09-03).
  #
  # KNOWN RUNTIME PROBLEM (VE, 2026-09-06, docs/dev/HISTORY.md 2026-09-06).
  # This job used to build the *layered* recipe (Dockerfile.ti-toolbox.layered, FROM
  # idossha/simnibs:v2.5.0) precisely so it would be CI-tractable: pull ~6 GB, build in
  # minutes. The maintainer deleted that recipe, so `build.sh` now has one recipe and this
  # job builds SimNIBS from scratch — 30-60+ minutes even on native hardware (see
  # container/blueprint/Dockerfile.ti-toolbox's own header and
  # container/blueprint/README.md), well past
  # this job's 15m `no_output_timeout` and well past what the default `machine` resource
  # class (2 vCPU / 8 GB) should absorb on every push. Nothing here has provisioned a
  # `resource_class: large`/`xlarge` or self-hosted executor.
  #
  # This job is therefore EXPECTED TO TIME OUT until one of: a larger executor is
  # provisioned, the job moves to a nightly/release trigger instead of every push, or a
  # published base image is reintroduced to build from. It is left declared rather than
  # deleted so the gap is visible in CI rather than only in a note. See
  # docs/dev/HISTORY.md (2026-09-03, Docker streamline) for the original reasoning.
  #
  # `ubuntu-2204:current` is an x86_64 machine, so this build and its smoke run natively
  # (no QEMU emulation) — unlike a build on Apple Silicon, this is a legitimate place to
  # eventually measure a native-amd64 FastSurfer runtime (w2/w3b notes both flag that
  # number as "not yet measured"); not attempted in this job to keep it fast (checkpoints
  # are already baked into the image at build time — no download needed — but a full
  # segmentation run adds several more minutes per subject).
  build-and-smoke-image:
    executor: vm-docker
    steps:
      - common-setup

      - run:
          name: Build idossha/ti-toolbox
          no_output_timeout: 15m
          command: |
            set -euo pipefail
            # One recipe: --layered/--from-scratch/--skip-ui-build are gone with
            # Dockerfile.ti-toolbox.layered, and the UI is built inside the image's own Node
            # stage. See this job's header for why that makes this step over-long here.
            # The embed release is resolved by build.sh from the GitHub Releases API; no
            # version is pinned in this file.
            #
            # --ref: the clone path (the ref is pushed by definition here). It builds the
            # branch/tag TIP, which is this commit unless a later push raced the job; the
            # smoke steps below bind-mount the checkout over /ti-toolbox, so they test this
            # commit either way. Dropping --ref would build from the checkout itself
            # (build.sh's default, ~140 MB context) and record the exact sha instead.
            ./container/blueprint/build.sh --tag idossha/ti-toolbox:ci \
                --ref "${CIRCLE_TAG:-$CIRCLE_BRANCH}"

      - run:
          name: Start the container
          command: |
            set -euo pipefail
            mkdir -p /tmp/ti-toolbox-smoke-project
            docker run -d --name tit-ci-smoke \
                -p 127.0.0.1:18765:8765 \
                -e PROJECT_DIR_NAME=smoke \
                -e TIT_SERVER_PORT=8765 \
                -v /tmp/ti-toolbox-smoke-project:/mnt/smoke \
                -v "$(pwd)":/ti-toolbox \
                -e PYTHONPATH=/ti-toolbox \
                idossha/ti-toolbox:ci
            echo "Waiting for the container to become healthy..."
            for i in $(seq 1 30); do
              status="$(docker inspect tit-ci-smoke --format '{{.State.Health.Status}}' 2>/dev/null || echo starting)"
              if [ "$status" = "healthy" ]; then
                echo "healthy after ${i}0s"
                break
              fi
              if [ "$status" = "unhealthy" ] || [ "$(docker inspect tit-ci-smoke --format '{{.State.Running}}')" != "true" ]; then
                echo "Container did not become healthy (status=$status):"
                docker logs tit-ci-smoke
                exit 1
              fi
              sleep 10
            done

      - run:
          name: Smoke test the image
          command: |
            set -euo pipefail

            echo "-- /api/health --"
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18765/api/health)"
            [ "$code" = "200" ] || { echo "expected 200, got $code"; exit 1; }

            echo "-- / (UI or status page) --"
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18765/)"
            [ "$code" = "200" ] || { echo "expected 200, got $code"; exit 1; }

            # The viewer ships in the image and this server serves it (VE). Assert the route,
            # the manifest and the embed's own CSP -- an index.html answered by the SPA
            # catch-all would pass a bare status check and mean the bundle is not there.
            echo "-- /tetravox/ serves the embed --"
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18765/tetravox/)"
            [ "$code" = "200" ] || { echo "expected 200 at /tetravox/, got $code"; exit 1; }
            body="$(curl -sD /tmp/tvx.h http://127.0.0.1:18765/tetravox/manifest.json)"
            case "$body" in
                *'"protocol"'*) : ;;
                *) echo "/tetravox/manifest.json is not a manifest: $body"; exit 1 ;;
            esac
            grep -qi 'wasm-unsafe-eval' /tmp/tvx.h \
                || { echo "the embed CSP is missing from /tetravox/"; exit 1; }
            rm -f /tmp/tvx.h

            echo "-- /etc/ti-toolbox-build.json (which source the image was built from) --"
            docker exec tit-ci-smoke cat /etc/ti-toolbox-build.json
            docker exec tit-ci-smoke sh -c 'grep -q "\"sha\":\"[0-9a-f]\{40\}\"" /etc/ti-toolbox-build.json' \
                || { echo "the build record has no full sha"; exit 1; }

            echo "-- FastSurfer --help --"
            docker exec tit-ci-smoke bash -lc \
                'cd "$FASTSURFER_HOME" && ./run_fastsurfer.sh --help | head -5'

            echo "-- SimNIBS / FastAPI / torch import --"
            docker exec tit-ci-smoke simnibs_python -c \
                "import simnibs, fastapi, torch; print(simnibs.__version__, fastapi.__version__, torch.__version__)"
            docker exec tit-ci-smoke simnibs_python -c \
                "import simnibs.segmentation, brainnet; print('charm imports OK')"

      - run:
          name: Container pytest subset (server + viewspec + catalog + files routes)
          command: |
            set -euo pipefail
            docker exec tit-ci-smoke simnibs_python -m pip install --no-cache-dir --quiet pytest
            docker exec -w /ti-toolbox tit-ci-smoke simnibs_python -m pytest -q \
                tests/test_catalog_v1.py \
                tests/test_server_skeleton.py \
                tests/test_viewspec.py \
                tests/test_viewspec_scene.py \
                tests/test_files_raw.py \
                tests/test_files_routes.py \
                tests/test_pre_fastsurfer.py

      - run:
          name: Stop and remove the container
          when: always
          command: |
            docker logs tit-ci-smoke || true
            docker stop tit-ci-smoke || true
            docker rm tit-ci-smoke || true

  build-and-run-tests:
    executor: vm-docker
    steps:
      - common-setup
      - prepare-test-image

      - run:
          name: Run test suite with coverage
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            TEST_IMAGE=ti-test:latest bash ./tests/test.sh --verbose --coverage

      - run:
          name: Prepare coverage for Codecov
          command: |
            set -euo pipefail

            if [ -z "${CODECOV_TOKEN:-}" ]; then
              echo "ERROR: CODECOV_TOKEN is not set. Add it in CircleCI project settings."
              exit 1
            fi

            COVERAGE_FILE="/tmp/coverage/coverage.xml"

            if [ ! -f "$COVERAGE_FILE" ] || [ ! -s "$COVERAGE_FILE" ]; then
              echo "ERROR: $COVERAGE_FILE not found or empty."
              exit 1
            fi

            # Docker writes coverage as root; fix ownership so we can rewrite it.
            sudo chown $(id -u):$(id -g) "$COVERAGE_FILE"

            # Rewrite <source> paths so Codecov maps files correctly.
            python3 .circleci/fix_coverage_paths.py

      - restore_cache:
          keys:
            - codecov-cli-v1

      - run:
          name: Upload coverage to Codecov
          command: |
            set -euo pipefail

            if [ ! -x /tmp/codecov ]; then
              echo "Downloading Codecov CLI..."
              curl -fsSL https://cli.codecov.io/latest/linux/codecov -o /tmp/codecov
              chmod +x /tmp/codecov
            fi

            /tmp/codecov --verbose upload-process \
              -t ${CODECOV_TOKEN} \
              -r idossha/TI-Toolbox \
              -C ${CIRCLE_SHA1} \
              -B ${CIRCLE_BRANCH} \
              --git-service github \
              -f /tmp/coverage/coverage.xml \
              --disable-search \
              -F unittests \
              -n "CircleCI-${CIRCLE_BUILD_NUM}" \
              -Z

      - save_cache:
          key: codecov-cli-v1
          paths:
            - /tmp/codecov

      - store_test_results:
          path: /tmp/test-results

      - store_artifacts:
          path: /tmp/test-results
          destination: test-results

      - store_artifacts:
          path: /tmp/coverage
          destination: coverage

  # Desktop app checks (FX3 fix lane, qa-security-notes.md finding #2: "the desktop app has
  # zero CI enforcement"). Every gate the Phase-A/B/C lane notes in
  # the 2026-09-03 docker-streamline lanes cited as already passing in a developer's own session --
  # typecheck, lint, unit tests, the production build, and the offscreen Electron e2e suite --
  # re-run here on every push, so a later commit breaking one of them (the offscreen guarantee
  # included) is caught instead of silently regressing until someone happens to run it by hand.
  #
  # Reuses `vm-docker` (not a lighter `docker:` executor) even though this job never touches
  # Docker itself: it is the one executor type already proven to work on this project, and a
  # real X11-capable Linux userspace (glib/gtk/nss/dbus/X libs) is exactly what Electron needs
  # to start at all -- a minimal `docker:` image would need most of the same packages
  # `playwright install-deps` already installs below, for no real savings.
  #
  # `npm run e2e:quiet` itself stays macOS-only by design (its own header:
  # "macOS only -- it is the platform with the monitor to hijack (Linux CI runs under Xvfb)");
  # this job runs the plain `npm run e2e` it wraps, under Xvfb -- Electron's Chromium backend
  # needs a real X display to initialize even with `TIT_E2E_OFFSCREEN=1` (a window built but
  # never shown is not the same as no window server existing at all), so `xvfb-run` supplies
  # one rather than skipping the offscreen guarantee's own e2e suite in CI.
  desktop-checks:
    executor: vm-docker
    steps:
      - common-setup

      - run:
          name: "Install Node 22 (package.json engines: >=22.12.0)"
          command: |
            set -euo pipefail
            export NVM_DIR="$HOME/.nvm"
            # ubuntu-2204:current ships nvm; install/select 22 explicitly rather than trust
            # whatever LTS the image defaults to today.
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm install 22
            nvm alias default 22
            {
              echo 'export NVM_DIR="$HOME/.nvm"'
              echo '[ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"'
              # Each `run` step is a fresh shell that only sources $BASH_ENV -- sourcing
              # nvm.sh alone does not select a version, so activate "default" explicitly
              # rather than depend on this image's own bashrc doing it.
              echo 'nvm use default >/dev/null'
            } >> "$BASH_ENV"
            node --version
            npm --version

      - restore_cache:
          keys:
            - desktop-npm-cache-v1-{{ checksum "desktop/package-lock.json" }}
            - desktop-npm-cache-v1-

      - run:
          name: npm ci
          working_directory: desktop
          command: |
            set -euo pipefail
            # `npm ci` always wipes and reinstalls node_modules by design, so what actually
            # benefits from caching is npm's own download cache (~/.npm), not node_modules
            # itself -- restored/saved below keyed on package-lock.json's checksum.
            npm ci

      - save_cache:
          key: desktop-npm-cache-v1-{{ checksum "desktop/package-lock.json" }}
          paths:
            - ~/.npm

      - run:
          name: Typecheck
          working_directory: desktop
          command: npm run typecheck

      - run:
          name: Lint
          working_directory: desktop
          command: npm run lint

      - run:
          name: Unit tests (vitest)
          working_directory: desktop
          command: npx vitest run

      - run:
          name: Production build
          working_directory: desktop
          command: npm run build

      - run:
          name: Install Xvfb + Playwright's Chromium OS deps
          command: |
            set -euo pipefail
            sudo apt-get update
            sudo apt-get install -y xvfb
            # Electron bundles Chromium, so the OS libraries Playwright's own Chromium needs
            # (nss, gtk3, dbus, atk, ...) are the same ones Electron needs to start at all --
            # this installs them without downloading a browser binary this project never
            # launches directly (only Electron, via `_electron.launch`).
            cd desktop && npx playwright install-deps chromium

      - run:
          name: E2E (Electron, offscreen, under Xvfb)
          command: |
            set -euo pipefail
            cd desktop
            export TIT_E2E_OFFSCREEN=1
            xvfb-run -a npm run e2e

      - store_artifacts:
          path: desktop/test-results
          destination: desktop-e2e-test-results
          when: always

workflows:
  test_workflow:
    jobs:
      - build-and-run-tests
      - build-and-smoke-image
      - desktop-checks
