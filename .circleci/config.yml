version: 2.1

parameters:
  build_image:
    type: boolean
    default: false

executors:
  vm-docker:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: false

commands:
  common-setup:
    steps:
      - checkout

  desktop-setup:
    description: Node 22 and `npm ci` in desktop/ (desktop-checks and desktop-e2e-mock)
    steps:
      - run:
          name: "Install Node 22 (package.json engines: >=22.12.0)"
          command: |
            set -euo pipefail
            export NVM_DIR="$HOME/.nvm"
            # ubuntu-2204:current ships nvm; install/select 22 explicitly rather than trust
            # whatever LTS the image defaults to today.
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm install 22
            nvm alias default 22
            {
              echo 'export NVM_DIR="$HOME/.nvm"'
              echo '[ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"'
              # Each `run` step is a fresh shell that only sources $BASH_ENV -- sourcing
              # nvm.sh alone does not select a version, so activate "default" explicitly
              # rather than depend on this image's own bashrc doing it.
              echo 'nvm use default >/dev/null'
            } >> "$BASH_ENV"
            node --version
            npm --version

      - restore_cache:
          keys:
            - desktop-npm-cache-v1-{{ checksum "desktop/package-lock.json" }}
            - desktop-npm-cache-v1-

      - run:
          name: npm ci
          working_directory: desktop
          command: |
            set -euo pipefail
            # `npm ci` always wipes and reinstalls node_modules by design, so what actually
            # benefits from caching is npm's own download cache (~/.npm), not node_modules
            # itself -- restored/saved below keyed on package-lock.json's checksum.
            npm ci

      - save_cache:
          key: desktop-npm-cache-v1-{{ checksum "desktop/package-lock.json" }}
          paths:
            - ~/.npm


jobs:

  # Full image verification is explicit: rebuilding SimNIBS takes 30-60+ minutes natively
  # so ordinary PRs
  # keep source tests and desktop checks; they do not claim an image was built or verified.
  build-and-smoke-image:
    executor: vm-docker
    steps:
      - common-setup

      - run:
          name: Build idossha/ti-toolbox
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            ARGS=(--tag idossha/ti-toolbox:ci)
            # Build the checked-out SHA. A moving --ref branch could race a later push.
            ./container/blueprint/build.sh "${ARGS[@]}"

      - run:
          name: Start the container
          command: |
            set -euo pipefail
            mkdir -p /tmp/ti-toolbox-smoke-project
            docker run -d --name tit-ci-smoke \
                -p 127.0.0.1:18765:8765 \
                -e PROJECT_DIR_NAME=smoke \
                -e TIT_SERVER_PORT=8765 \
                -v /tmp/ti-toolbox-smoke-project:/mnt/smoke \
                -v "$(pwd)":/workspace:ro \
                -e PYTHONPATH=/ti-toolbox \
                idossha/ti-toolbox:ci
            echo "Waiting for the container to become healthy..."
            for i in $(seq 1 30); do
              status="$(docker inspect tit-ci-smoke --format '{{.State.Health.Status}}' 2>/dev/null || echo starting)"
              if [ "$status" = "healthy" ]; then
                echo "healthy after ${i}0s"
                break
              fi
              if [ "$status" = "unhealthy" ] || [ "$(docker inspect tit-ci-smoke --format '{{.State.Running}}')" != "true" ]; then
                echo "Container did not become healthy (status=$status):"
                docker logs tit-ci-smoke
                exit 1
              fi
              sleep 10
            done

      - run:
          name: Smoke test the image
          command: |
            set -euo pipefail

            echo "-- /api/health --"
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18765/api/health)"
            [ "$code" = "200" ] || { echo "expected 200, got $code"; exit 1; }

            echo "-- / (UI or status page) --"
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18765/)"
            [ "$code" = "200" ] || { echo "expected 200, got $code"; exit 1; }

            echo "-- /etc/ti-toolbox-build.json (which source the image was built from) --"
            docker exec tit-ci-smoke cat /etc/ti-toolbox-build.json
            docker exec tit-ci-smoke sh -c 'grep -q "\"sha\":\"[0-9a-f]\{40\}\"" /etc/ti-toolbox-build.json' \
                || { echo "the build record has no full sha"; exit 1; }

            echo "-- FastSurfer --help --"
            docker exec tit-ci-smoke bash -lc \
                'cd "$FASTSURFER_HOME" && ./run_fastsurfer.sh --help | head -5'

            echo "-- SimNIBS / FastAPI / torch import --"
            docker exec tit-ci-smoke simnibs_python -c \
                "import simnibs, fastapi, torch; print(simnibs.__version__, fastapi.__version__, torch.__version__)"
            docker exec tit-ci-smoke simnibs_python -c \
                "import simnibs.segmentation, brainnet; print('charm imports OK')"

      - run:
          name: Container pytest subset (server + viewspec + catalog + files routes)
          command: |
            set -euo pipefail
            docker exec tit-ci-smoke simnibs_python -m pip install --no-cache-dir --quiet pytest
            # /workspace is read-only: pytest.ini's log file and cache go to /tmp instead
            # (nested pytest runs inherit PYTEST_ADDOPTS).
            docker exec -w /workspace \
                -e PYTEST_ADDOPTS="-p no:cacheprovider -o log_file=/tmp/pytest.log" \
                tit-ci-smoke simnibs_python -m pytest -q \
                tests/test_catalog_v1.py \
                tests/test_server_skeleton.py \
                tests/test_viewspec.py \
                tests/test_viewspec_scene.py \
                tests/test_files_raw.py \
                tests/test_files_routes.py \
                tests/test_pre_fastsurfer.py

      - run:
          name: Real-library numerical leg in the built image (tests/numerical)
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            mkdir -p /tmp/test-results
            docker exec -w /workspace -e PYTHONDONTWRITEBYTECODE=1 \
                -e PYTEST_ADDOPTS="-p no:cacheprovider -o log_file=/tmp/pytest.log" \
                tit-ci-smoke simnibs_python -m pytest tests/numerical -q \
                --junitxml=/tmp/numerical.xml || true
            docker cp tit-ci-smoke:/tmp/numerical.xml /tmp/test-results/numerical.xml || true
            # Fails on 0 collected, any failure or error, and any skip not on the allowlist.
            python3 dev/check_junit.py --leg numerical-image /tmp/test-results/numerical.xml

      # Every store step says `when: always` (tests/test_circleci_e2e_mock_job.py): a red
      # run is the one whose reports are needed, and a step after a failed one is
      # otherwise skipped. The e2e job #162 removed did the same.
      - store_test_results:
          path: /tmp/test-results
          when: always

      - run:
          name: Stop and remove the container
          when: always
          command: |
            docker logs tit-ci-smoke || true
            docker stop tit-ci-smoke || true
            docker rm tit-ci-smoke || true

  # tests/numerical needs the real SimNIBS stack, so it runs inside the released image with
  # this checkout mounted read-only. It goes red on a numerical regression the host suite's
  # mocks cannot see; idossha/ti-toolbox:v3.1.1 is red on
  # test_simnibs_vector_warp.py (the shipped nan_to_num patch) until the image is rebuilt.
  numerical-image:
    executor: vm-docker
    steps:
      - common-setup
      - run:
          name: Real-library numerical leg in the released image (tests/numerical)
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            VERSION="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' tit/__init__.py)"
            IMAGE="idossha/ti-toolbox:v${VERSION}"
            mkdir -p /tmp/test-results
            docker pull --platform linux/amd64 "$IMAGE"
            docker run --rm --platform linux/amd64 --entrypoint bash \
                -v "$(pwd)":/ti-toolbox:ro -v /tmp/test-results:/out -w /ti-toolbox \
                -e PYTHONDONTWRITEBYTECODE=1 \
                -e PYTEST_ADDOPTS="-p no:cacheprovider -o log_file=/tmp/pytest.log" \
                "$IMAGE" -lc '
                  simnibs_python -c "import pytest" 2>/dev/null || {
                    simnibs_python -m pip install --quiet --target /tmp/pydeps pytest
                    export PYTHONPATH=/tmp/pydeps
                  }
                  simnibs_python -m pytest tests/numerical -q --junitxml=/out/numerical.xml
                ' || true
            # Fails on 0 collected, any failure or error, and any skip not on the allowlist.
            python3 dev/check_junit.py --leg numerical-image /tmp/test-results/numerical.xml
      - store_test_results:
          path: /tmp/test-results
          when: always
      - store_artifacts:
          path: /tmp/test-results
          destination: test-results
          when: always

  build-and-run-tests:
    executor: vm-docker
    steps:
      - common-setup
      - run:
          name: Self-test canonical documentation guard
          command: python3 -m unittest discover -s tests -p test_documentation_policy.py -v
      - run:
          name: Reject temporary requirement stores
          command: python3 dev/documentation_policy.py
      - run:
          name: Self-test build and version guards
          command: python3 -m unittest discover -s tests -p test_internal_packaging.py -v
      - run:
          name: Agent-plugin MCP stdio wire tests
          command: python3 -m unittest discover -s agent-plugin/mcp -p 'test_*.py' -v
      - run:
          name: Self-test the test inventory guard
          command: python3 -m unittest discover -s tests -p test_test_inventory_guard.py -v
      - run:
          name: Every committed test file has a runner
          command: python3 dev/test_inventory_guard.py
      - run:
          name: Install host Python test environment (no scientific image)
          command: |
            set -euo pipefail
            # Ubuntu 22.04 defaults to Python 3.10; tit requires >=3.11.
            # #1063: the VM's python-build did not know 3.11.14. Select its installed
            # 3.11 first; fall back to the newest 3.11 definition it actually ships.
            if ! pyenv local 3.11; then
              pyenv install -s 3.11
              pyenv local 3.11
            fi
            python --version
            python -m venv /tmp/tit-ci-venv
            /tmp/tit-ci-venv/bin/python -m pip install -e '.[test]'

      - run:
          name: Self-test the contract guard
          command: /tmp/tit-ci-venv/bin/python -m pytest tests/test_contracts_check_unit.py -q -p no:cacheprovider

      - run:
          name: Route and generated-contract guards
          command: |
            set -euo pipefail
            /tmp/tit-ci-venv/bin/python dev/route_import_guard.py
            # This job has no desktop/node_modules, and with CI=true the guard exits 2 rather
            # than skip schema.d.ts silently. desktop-checks regenerates and diffs that file
            # after its npm ci ("Generated API types match the contract").
            /tmp/tit-ci-venv/bin/python dev/contracts_check.py --no-schema-d-ts

      - run:
          name: Host regression suite with coverage (tests/numerical runs in the image leg)
          no_output_timeout: 10m
          command: |
            set -euo pipefail
            mkdir -p /tmp/test-results /tmp/coverage
            # A 20-minute ceiling bounds hangs; historical mixed-image runs took ~7 minutes
            # before failing (CircleCI #1057). Host-only timing is measured by this job.
            timeout 20m /tmp/tit-ci-venv/bin/python -m pytest tests/ -q \
              --ignore=tests/numerical --junitxml=/tmp/test-results/host.xml \
              --cov=tit --cov-report=xml:/tmp/coverage/coverage.xml

      - run:
          name: Real-library stats tests on the host (tests/numerical -m host_numerical)
          command: |
            set -euo pipefail
            # These modules need only real numpy/scipy/nibabel, which the venv has; the
            # numerical conftest skips every other module here, so the leg must skip nothing.
            /tmp/tit-ci-venv/bin/python -m pytest tests/numerical -m host_numerical -q \
              --junitxml=/tmp/test-results/numerical-host.xml || true
            python3 dev/check_junit.py --leg no-skips /tmp/test-results/numerical-host.xml

      - run:
          name: Prepare coverage for Codecov
          command: |
            set -euo pipefail

            if [ -z "${CODECOV_TOKEN:-}" ]; then
              echo "ERROR: CODECOV_TOKEN is not set. Add it in CircleCI project settings."
              exit 1
            fi

            COVERAGE_FILE="/tmp/coverage/coverage.xml"

            if [ ! -f "$COVERAGE_FILE" ] || [ ! -s "$COVERAGE_FILE" ]; then
              echo "ERROR: $COVERAGE_FILE not found or empty."
              exit 1
            fi

            # Rewrite <source> paths so Codecov maps files correctly.
            python3 .circleci/fix_coverage_paths.py

      - restore_cache:
          keys:
            - codecov-cli-v1

      - run:
          name: Upload coverage to Codecov
          command: |
            set -euo pipefail

            if [ ! -x /tmp/codecov ]; then
              echo "Downloading Codecov CLI..."
              curl -fsSL https://cli.codecov.io/latest/linux/codecov -o /tmp/codecov
              chmod +x /tmp/codecov
            fi

            /tmp/codecov --verbose upload-process \
              -t ${CODECOV_TOKEN} \
              -r idossha/TI-Toolbox \
              -C ${CIRCLE_SHA1} \
              -B ${CIRCLE_BRANCH} \
              --git-service github \
              -f /tmp/coverage/coverage.xml \
              --disable-search \
              -F unittests \
              -n "CircleCI-${CIRCLE_BUILD_NUM}" \
              -Z

      - save_cache:
          key: codecov-cli-v1
          paths:
            - /tmp/codecov

      - store_test_results:
          path: /tmp/test-results
          when: always

      - store_artifacts:
          path: /tmp/test-results
          destination: test-results
          when: always

      - store_artifacts:
          path: /tmp/coverage
          destination: coverage
          when: always

  desktop-checks:
    executor: vm-docker
    steps:
      - common-setup
      - desktop-setup

      - run:
          name: Generated API types match the contract (schema.d.ts drift)
          working_directory: desktop
          command: |
            set -euo pipefail
            # build-and-run-tests checks contracts/generated/openapi.json against the contract
            # but has no node_modules; this job regenerates schema.d.ts from that file (the
            # same command as `npm run gen:api`) and fails on any difference.
            npx openapi-typescript ../contracts/generated/openapi.json -o /tmp/schema.d.ts
            diff -u src/renderer/api/schema.d.ts /tmp/schema.d.ts

      - run:
          name: Docs search results page (node --test, jsdom from desktop/)
          command: node --test docs/tests/search-results.test.mjs

      - run:
          name: Typecheck
          working_directory: desktop
          command: npm run typecheck

      - run:
          name: Lint
          working_directory: desktop
          command: npm run lint

      - run:
          name: Unit tests (vitest)
          working_directory: desktop
          # Full local units passed in the release rehearsal; cap a stuck worker without
          # carrying the browser/Electron dependency installation into daily CI.
          command: timeout 15m npx vitest run

      - run:
          name: Production build
          working_directory: desktop
          command: npm run build

  # The mock-server Electron e2e suite (Playwright project `default`: every spec under
  # desktop/tests/e2e except real/), offscreen under Xvfb. #162 took it out of the per-PR
  # checks for its cost, so it runs on main and nightly. playwright.config.ts starts the mock
  # server only when TIT_E2E_SERVER_URL is unset; the first step makes sure it is.
  desktop-e2e-mock:
    executor: vm-docker
    steps:
      - common-setup
      - desktop-setup

      - run:
          name: No real server, token or dataset is reachable from this job
          command: |
            set -euo pipefail
            for name in TIT_E2E_SERVER_URL TIT_E2E_TOKEN TIT_E2E_PROJECT_HOST TIT_DATASET_000; do
              if [ -n "${!name:-}" ]; then
                echo "$name is set: the mock e2e job must never reach a real server or dataset"
                exit 1
              fi
            done

      - run:
          name: Install Xvfb and the Chromium libraries Electron and browser-mode specs need
          command: |
            set -euo pipefail
            # needrestart otherwise waits at a service-restart dialog until CI times out.
            sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get update
            sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y xvfb
            cd desktop
            # Run Playwright as root with the selected Node PATH so its apt child inherits
            # these settings instead of losing them at an internal sudo hop.
            sudo env "PATH=$PATH" DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a \
              npx playwright install-deps chromium
            # browser-mode.spec.ts uses Playwright's own Chromium, installed for this user.
            npx playwright install chromium

      - run:
          name: Build with the gallery and scene hooks the specs drive (npm run pree2e)
          working_directory: desktop
          command: npm run pree2e

      - run:
          name: Mock e2e (Electron, offscreen, under Xvfb)
          working_directory: desktop
          no_output_timeout: 10m
          command: |
            set -euo pipefail
            mkdir -p /tmp/test-results
            # Measured 2026-10-22 (macOS, offscreen, one worker): 364 tests, 361 passed and
            # 3 allowed skips, in 470 s and 538 s (two green runs). The ceiling is twice the
            # slower one (18 min). Playwright's
            # exit code is not trusted alone: check_junit decides below.
            TIT_E2E_OFFSCREEN=1 PLAYWRIGHT_JUNIT_OUTPUT_NAME=/tmp/test-results/e2e-mock.xml \
              timeout 18m xvfb-run -a npx playwright test --project=default \
              --reporter=line,junit || true
            # Fails on 0 collected, any failure or error, and any skip not on the e2e-mock
            # allowlist (each entry states why it may skip).
            python3 ../dev/check_junit.py --leg e2e-mock /tmp/test-results/e2e-mock.xml

      # Traces and screenshots of failed specs: stored on the red runs above all.
      - store_test_results:
          path: /tmp/test-results
          when: always

      - store_artifacts:
          path: /tmp/test-results
          destination: test-results
          when: always

      - store_artifacts:
          path: desktop/test-results
          destination: desktop-e2e-test-results
          when: always


workflows:
  test_workflow:
    jobs:
      - build-and-run-tests
      - desktop-checks
      - desktop-e2e-mock:
          filters:
            branches:
              only: main

  image_verification:
    when: << pipeline.parameters.build_image >>
    jobs:
      - build-and-smoke-image

  numerical_nightly:
    triggers:
      - schedule:
          cron: "0 7 * * *"
          filters:
            branches:
              only: main
    jobs:
      - numerical-image

  e2e_mock_nightly:
    triggers:
      - schedule:
          cron: "30 7 * * *"
          filters:
            branches:
              only: main
    jobs:
      - desktop-e2e-mock
