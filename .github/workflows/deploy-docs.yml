name: "Deploy Docs"

# Pull requests build and check the site; only main deploys it. The extra paths are
# where docs URLs are written outside docs/ (check_links.py --repo resolves them).
on:
  push:
    branches: ["main"]
    paths:
      - 'tit/**'
      - 'docs/**'
      - 'desktop/src/**'
      - 'agent-plugin/**'
      - 'README.md'
      - 'resources/**'
      - 'container/**'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    paths:
      - 'tit/**'
      - 'docs/**'
      - 'desktop/src/**'
      - 'agent-plugin/**'
      - 'README.md'
      - 'resources/**'
      - 'container/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Deploys queue in one group; a pull request's newer push cancels its older check.
  group: ${{ github.event_name == 'pull_request' && format('docs-check-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build MkDocs API docs
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install -r docs/api_mkdocs/requirements.txt
          mkdocs build -f docs/api_mkdocs/mkdocs.yml --clean

      - name: Copy the example notebook into the site (single source is examples/)
        run: |
          mkdir -p docs/assets/notebooks
          cp -L examples/notebooks/example_workflow.ipynb docs/assets/notebooks/

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      # The Jekyll action writes _site as root inside its container; the search page fetches
      # search/search.json, which only this step writes (Pages builds run no plugins).
      - name: Write and check the search index
        run: |
          sudo chown -R "$(id -u):$(id -g)" ./_site
          python docs/tests/build_search_index.py ./_site --source docs
          python docs/tests/check_search_index.py ./_site --source docs

      - name: Check for broken asset references
        run: python docs/tests/check_assets.py ./_site

      - name: Check that only public sections are published
        run: python docs/tests/check_published_set.py ./_site

      - name: Check links, anchors, scripts and docs URLs written outside docs/
        run: python docs/tests/check_links.py ./_site --repo .

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
