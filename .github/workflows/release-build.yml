# Executable builds and tagged releases; Docker images are built/pushed manually.
# Publication stays draft until all platform jobs and the asset inventory pass.
name: Build and release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      mode:
        description: 'build exports unsigned installers; release signs and publishes an existing stable tag.'
        type: choice
        options: [build, release]
        default: build
      release_tag:
        description: 'Existing vX.Y.Z tag to recover with this workflow; source always comes from that tag.'
        type: string
        default: ''

  workflow_call:
    inputs:
      mode:
        type: string
        default: build
      release_tag:
        type: string
        default: ''
    secrets:
      CSC_LINK:
        required: false
      CSC_KEY_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false

permissions:
  contents: read

concurrency:
  group: release-build-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22.12.0'
  IMAGE_REPO: idossha/ti-toolbox
  APPLE_TEAM_ID: '3BMY24SA43' # Public Apple Developer team identifier, also used by the v2 release.

jobs:
  # ---------------------------------------------------------------------------------------------
  plan:
    name: Plan and version consistency
    runs-on: ubuntu-24.04
    # Guard-only job; 10m bounds checkout/API stalls (CI duration not yet measured).
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      source_ref: ${{ steps.source.outputs.ref }}
      version: ${{ steps.v.outputs.version }}
      mode: ${{ steps.v.outputs.mode }}
      image_tag: ${{ steps.v.outputs.image_tag }}
      python_version: ${{ steps.v.outputs.python_version }}
      release_notes: ${{ steps.notes.outputs.release_notes }}
    steps:
      # Control code follows the invoked workflow revision; packaged code follows the tag.
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          path: candidate

      - name: Resolve immutable source identity
        working-directory: candidate
        id: source
        env:
          RECOVERY_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          REF="$GITHUB_REF"
          if [ -n "$RECOVERY_TAG" ]; then
            [[ "$RECOVERY_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Invalid stable release tag'; exit 1; }
            REF="refs/tags/$RECOVERY_TAG"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Self-test build and version guards
        run: python3 -m unittest discover -s tests -p test_internal_packaging.py -v

      - name: Resolve version and mode
        id: v
        env:
          BUILD_MODE: ${{ inputs.mode || 'release' }}
          SOURCE_REF: ${{ steps.source.outputs.ref }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: python3 dev/update/build_plan.py --root candidate --mode "$BUILD_MODE" --ref "$SOURCE_REF" --sha "$SOURCE_SHA"

      - name: Refuse to replace a public release
        if: steps.v.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          STATE=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == env.RELEASE_TAG) | .draft')
          [ "$STATE" != "false" ] || { echo 'Release is already public; refusing asset replacement'; exit 1; }

      - name: Extract release notes
        id: notes
        if: steps.v.outputs.mode == 'release'
        run: |
          set -euo pipefail
          FILE="candidate/docs/releases/v${{ steps.v.outputs.version }}.md"
          if [ -f "$FILE" ]; then
            NOTES=$(awk '
              NR == 1 && $0 == "---" { fm = 1; next }
              fm && $0 == "---" { fm = 0; next }
              !fm { print }
            ' "$FILE")
          else
            echo "::warning::$FILE not found; falling back to the tagged commit message"
            NOTES=$(git -C candidate log -1 --pretty=%B)
          fi
          {
            echo "release_notes<<RELEASE_NOTES_EOF"
            echo "$NOTES"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  # Manifest metadata only: the maintainer owns image construction, smoke checks and push.
  image-available:
    name: Verify manually published image
    needs: plan
    if: needs.plan.outputs.mode == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # Registry metadata only; bound an unavailable registry, never pull layers.
    steps:
      - uses: actions/checkout@v4
      - name: Require the version image for Linux amd64
        env:
          IMAGE_TAG: ${{ needs.plan.outputs.image_tag }}
        run: |
          set -euo pipefail
          docker manifest inspect --verbose "${IMAGE_REPO}:$IMAGE_TAG" > image-manifest.json
          python3 dev/update/verify_release_assets.py --image-manifest image-manifest.json

  desktop-validate:
    name: Validate unsigned ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.os }}
    # Cross-platform packaging allowance; 45m bounds stalled downloads (unmeasured in CI).
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS
            builder_args: --mac --arm64 --x64
          - os: windows-2022
            name: Windows
            builder_args: --win --x64
          - os: ubuntu-24.04
            name: Linux
            builder_args: --linux --x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        working-directory: desktop
        run: npm ci

      - name: Build renderer/main/preload
        working-directory: desktop
        run: npm run build

      - name: Stage the packaged image default
        env:
          BUILD_MODE: ${{ needs.plan.outputs.mode }}
          SOURCE_REF: ${{ needs.plan.outputs.source_ref }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: python3 dev/update/build_plan.py --mode "$BUILD_MODE" --ref "$SOURCE_REF" --sha "$SOURCE_SHA" --stage-compose
        shell: bash

      - name: Package (unsigned)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.builder_args }} --config electron-builder.yml --publish never

      - name: Verify the packaged app (macOS, both arches)
        if: runner.os == 'macOS'
        working-directory: desktop
        run: |
          set -euo pipefail
          node scripts/verify-package.mjs "release/mac-arm64/TI-Toolbox.app" --expect-version "${{ needs.plan.outputs.version }}" --expect-image-tag "${{ needs.plan.outputs.image_tag }}"
          node scripts/verify-package.mjs "release/mac/TI-Toolbox.app" --expect-version "${{ needs.plan.outputs.version }}" --expect-image-tag "${{ needs.plan.outputs.image_tag }}"

      - name: Verify the packaged app
        if: runner.os != 'macOS'
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          DIR=$([ "${{ runner.os }}" = "Windows" ] && echo release/win-unpacked || echo release/linux-unpacked)
          node scripts/verify-package.mjs "$DIR" --expect-version "${{ needs.plan.outputs.version }}" --expect-image-tag "${{ needs.plan.outputs.image_tag }}"

      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.name }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------------------------
  create-release:
    name: Create draft GitHub Release
    permissions:
      contents: write
    needs: [plan, image-available, desktop-validate]
    if: needs.plan.outputs.mode == 'release'
    runs-on: ubuntu-24.04
    # Single release API operation; 10m bounds API stalls (unmeasured).
    timeout-minutes: 10
    steps:
      - name: Refuse an already-public release immediately before draft creation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          STATE=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == env.RELEASE_TAG) | .draft')
          [ "$STATE" != "false" ] || { echo 'Release is already public'; exit 1; }
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.plan.outputs.version }}
          name: v${{ needs.plan.outputs.version }}
          body: ${{ needs.plan.outputs.release_notes }}
          draft: true
          prerelease: false

  # ---------------------------------------------------------------------------------------------
  # Signed + notarised, uploaded to the release. Everything that could be checked unsigned already
  # was, so a failure here is a credential or notarisation failure, not a packaging one.
  desktop-publish:
    name: Stage release ${{ matrix.name }}
    permissions:
      contents: write
    needs: [plan, image-available, desktop-validate, create-release]
    if: needs.plan.outputs.mode == 'release'
    runs-on: ${{ matrix.os }}
    # Notarisation is a round trip to Apple and can take 30+ minutes on a first submission.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS
            builder_args: --mac --arm64 --x64
          - os: windows-2022
            name: Windows
            builder_args: --win --x64
          - os: ubuntu-24.04
            name: Linux
            builder_args: --linux --x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_sha }}

      - name: Signing secrets must be present
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || env.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          MISSING=""
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then MISSING="$MISSING $name"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::macOS publish refuses to run unsigned; missing secrets:$MISSING"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        working-directory: desktop
        run: npm ci

      - name: Build renderer/main/preload
        working-directory: desktop
        run: npm run build

      - name: Stage the packaged image default
        env:
          BUILD_MODE: ${{ needs.plan.outputs.mode }}
          SOURCE_REF: ${{ needs.plan.outputs.source_ref }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: python3 dev/update/build_plan.py --mode "$BUILD_MODE" --ref "$SOURCE_REF" --sha "$SOURCE_SHA" --stage-compose
        shell: bash

      - name: Package, sign and stage draft artifacts
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || env.APPLE_TEAM_ID }}
        run: npx electron-builder ${{ matrix.builder_args }} --config electron-builder.yml --publish never

      - name: Verify the rebuilt release app
        working-directory: desktop
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            node scripts/verify-package.mjs release/mac-arm64/TI-Toolbox.app --expect-version "$RELEASE_VERSION" --expect-image-tag "$RELEASE_VERSION"
            node scripts/verify-package.mjs release/mac/TI-Toolbox.app --expect-version "$RELEASE_VERSION" --expect-image-tag "$RELEASE_VERSION"
          else
            DIR=$([ "$RUNNER_OS" = "Windows" ] && echo release/win-unpacked || echo release/linux-unpacked)
            node scripts/verify-package.mjs "$DIR" --expect-version "$RELEASE_VERSION" --expect-image-tag "$RELEASE_VERSION"
          fi

      - name: Verify signature, Gatekeeper and staple
        if: runner.os == 'macOS'
        working-directory: desktop
        run: |
          set -euo pipefail
          for APP in release/mac-arm64/TI-Toolbox.app release/mac/TI-Toolbox.app; do
            echo "=== $APP ==="
            codesign -dv --verbose=4 "$APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
            spctl -a -vvv -t exec "$APP"
            xcrun stapler validate "$APP"
          done

      - name: Attach verified executables to the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=(release/*.dmg release/*.zip release/*.exe release/*.AppImage release/*.deb)
          [ "${#FILES[@]}" -gt 0 ] || { echo 'No executable artifacts'; exit 1; }
          [ "$(gh release view "v$RELEASE_VERSION" --json isDraft --jq .isDraft)" = true ] || { echo 'Release is no longer a draft'; exit 1; }
          gh release upload "v$RELEASE_VERSION" "${FILES[@]}" --clobber

  finalize:
    needs: [plan, image-available, desktop-publish]
    if: needs.plan.outputs.mode == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # Small API reads; 10m bounds API hangs (unmeasured).
    timeout-minutes: 10
    steps:
      # Use this control revision's asset guard; all uploaded executables came from source_sha.
      - uses: actions/checkout@v4
      # The loaders (loader.sh / tit/cli.py) refuse to install a desktop app they cannot
      # verify, so the checksum manifest is a release artifact like any other.
      - name: Publish the SHA256SUMS the loaders verify against
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          [ "$(gh release view "v$RELEASE_VERSION" --json isDraft --jq .isDraft)" = true ] || { echo 'Release is no longer a draft'; exit 1; }
          mkdir -p checksums
          cd checksums
          gh release download "v$RELEASE_VERSION" --clobber
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          gh release upload "v$RELEASE_VERSION" SHA256SUMS --clobber
      - name: Verify every release artifact is attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          gh release view "v$RELEASE_VERSION" --json isDraft,assets > release-assets.json
          python3 dev/update/verify_release_assets.py "$RELEASE_VERSION" release-assets.json
      - name: Publish complete draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          gh release edit "v$RELEASE_VERSION" --draft=false --latest
