name: Host paths

# Host <-> container path rules (tit/host_path.py, desktop/src/shared/paths.ts) on real
# win32, macOS and Linux runners. Both suites read tests/fixtures/host_paths.json.
on:
  pull_request:
    paths:
      - 'tit/host_path.py'
      - 'desktop/src/shared/paths.ts'
      - 'tests/fixtures/host_paths.json'
      - 'tests/test_host_path_table.py'
      - 'desktop/tests/unit/paths.test.ts'
      - '.github/workflows/host-paths.yml'
  push:
    branches: [main]
    paths:
      - 'tit/host_path.py'
      - 'desktop/src/shared/paths.ts'
      - 'tests/fixtures/host_paths.json'
      - 'tests/test_host_path_table.py'
      - 'desktop/tests/unit/paths.test.ts'
      - '.github/workflows/host-paths.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-paths:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Two tiny test files; 10 min covers a cold npm ci on Windows.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python host-path tests
        run: |
          python -m pip install -q pytest
          python -m pytest -q -p no:cacheprovider tests/test_host_path_table.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: TS path tests
        working-directory: desktop
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx vitest run tests/unit/paths.test.ts
