# pytest configuration for TI-Toolbox
[pytest]

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Minimum version
minversion = 6.0

# Command line options applied by default
addopts =
    # Verbose output
    -v
    # Show summary of all test outcomes
    -ra
    # Strict markers - unregistered markers will error
    --strict-markers
    # Strict config - unknown config options will error
    --strict-config
    # Show local variables in tracebacks
    --showlocals
    # Disable warnings summary (can be noisy)
    --disable-warnings
    # Deselect the pipeline smoke harness by default (dev/notes/v3-pipelines-program.md, P5).
    # tests/smoke/ talks to a live tit.server over HTTP against a real BIDS project and starts
    # real jobs; collecting it is free, running it is not. The host suite must stay ~35 s with
    # zero smoke tests run, so it is opted into explicitly (dev/smoke.sh, or `-m smoke`, which
    # overrides this because the last -m on the command line wins). A second, independent
    # safety net lives in tests/smoke/conftest.py: without TIT_SMOKE_SERVER_URL and
    # TIT_SMOKE_TOKEN every smoke test skips with a printed reason, so `-m smoke` on a machine
    # with no container can never reach a real dataset.
    -m "not smoke"

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (slower, may require test data)
    slow: Slow tests (may take several minutes)
    requires_simnibs: Tests that require SimNIBS environment
    requires_freesurfer: Tests that require FreeSurfer environment
    requires_data: Tests that require test data files
    gui: GUI tests (require X11/display)
    smoke: Level A pipeline smoke harness (tests/smoke/) -- needs a live tit.server and a real
        project; deselected by default via addopts, gated on TIT_SMOKE_SERVER_URL +
        TIT_SMOKE_TOKEN. Run with dev/smoke.sh.

# Test output format
console_output_style = progress

# Logging
log_cli = false
log_cli_level = WARNING
log_file = tests/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Doctest options
doctest_optionflags = NORMALIZE_WHITESPACE ELLIPSIS
