# Codecov Configuration for TI-Toolbox
# Documentation: https://docs.codecov.com/docs/codecov-yaml

# Coverage report settings
codecov:
  require_ci_to_pass: yes
  notify:
    wait_for_ci: yes

# Coverage targets and thresholds
coverage:
  precision: 2
  round: down
  range: "60...100"

  status:
    # Overall project coverage
    project:
      default:
        target: 70%
        threshold: 2%
        base: auto
        if_ci_failed: error

    # Coverage for individual patches/PRs
    patch:
      default:
        target: 65%
        threshold: 5%
        base: auto
        if_ci_failed: error

# Coverage flags: exactly the flags CI uploads (`-F unittests` in .circleci/config.yml).
# A flag declared here but never uploaded reports nothing, so tests/test_coveragerc.py
# requires the two sets to be equal. What is left out of the measurement is decided once,
# in .coveragerc's omit list; there is no second ignore list here.
flags:
  unittests:
    paths:
      - tit/
    carryforward: false

# Comment configuration for pull requests
comment:
  layout: "reach,diff,flags,tree,footer"
  behavior: default
  require_changes: true
  require_base: no
  require_head: yes

# GitHub status checks configuration
github_checks:
  annotations: true
