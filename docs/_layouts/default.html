---
layout: null
---
<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}" data-baseurl="{{ site.baseurl }}">
  {%- include head.html -%}
  <body class="layout-{{ page.layout }}">
    {%- include header.html -%}
    <main class="site-main" aria-label="Content">
      {{ content }}
    </main>
    {%- include footer.html -%}
    <script src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  </body>
</html>
